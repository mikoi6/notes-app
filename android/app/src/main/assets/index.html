/* 按文件夹导出时，文件名已经承载了标题，正文里就不要再重复一遍；
   但如果正文本身没有一级标题，补一个，免得单独打开文件不知道叫什么 */
function firstMeaningfulLine(text){
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  for(let i = 0; i < lines.length; i++){ if(lines[i].trim()) return lines[i]; }
  return '';
}
function noteBodyMd(n){
  const title = n.title || '无标题';
  const body = String(n.content || '').replace(/\r\n?/g, '\n').trim();
  if(!body) return '# ' + title + '\n';
  return /^#\s+\S/.test(firstMeaningfulLine(body)) ? body + '\n' : '# ' + title + '\n\n' + body + '\n';
}
function noteBodyText(n){
  const title = n.title || '无标题';
  const body = String(n.content || '').trim();
  if(!body) return title + '\n';
  const plain = mdToPlain(body);
  return /^#\s+\S/.test(firstMeaningfulLine(body)) ? plain + '\n' : title + '\n\n' + plain + '\n';
}

/* ---------- 按文件夹结构导出（一条便签一个文件，目录层级照搬） ---------- */
const BAD_CHARS = /[\\/:*?"<>|\u0000-\u001f]/g;

/* 文件夹名/便签标题都可能含 / 或 :，直接当文件名会丢字符甚至跑出目录 */
function safeSeg(name, max){
  let s = String(name == null ? '' : name)
    .replace(BAD_CHARS, '_')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/^\.+$/, '_');
  if(!s) s = '未命名';
  const m = max || 60;
  return s.length > m ? s.slice(0, m).trim() : s;
}

function buildTreePlan(fmt, fid){
  const scope = fid ? folderPathText(fid).replace(/\s*\/\s*/g, '-') : '';
  const root = '便签' + (scope ? '-' + safeSeg(scope, 30) : '') + '-' + stamp();

  const dirs  = [];                 // 目录相对路径（用 / 分隔）
  const files = [];                 // { dir, name, content }
  const seenDir  = new Set();
  const seenName = new Map();       // dir -> Set(小写文件名)，避免同名覆盖

  function addDir(dir){
    if(dir && !seenDir.has(dir)){ seenDir.add(dir); dirs.push(dir); }
  }
  function uniqName(dir, base, ext){
    if(!seenName.has(dir)) seenName.set(dir, new Set());
    const set = seenName.get(dir);
    let name = base + ext, i = 2;
    while(set.has(name.toLowerCase())){ name = base + ' (' + i + ')' + ext; i++; }
    set.add(name.toLowerCase());
    return name;
  }
  function addNote(n, dir){
    addDir(dir);
    const content = fmt === 'md'   ? noteBodyMd(n)
                  : fmt === 'txt'  ? noteBodyText(n)
                  :                  buildNoteHTML(n);
    files.push({
      dir: dir,
      name: uniqName(dir, safeSeg(n.title || '无标题', 60), '.' + fmt),
      content: content,
      time: n.updatedAt || n.createdAt || Date.now()
    });
  }
  function walk(pid, dir){
    addDir(dir);
    notesIn(pid).forEach(function(n){ addNote(n, dir); });
    subFolders(pid).forEach(function(f){
      const sub = dir ? dir + '/' + safeSeg(f.name, 50) : safeSeg(f.name, 50);
      walk(f.id, sub);
    });
  }

  walk(fid || null, '');
  return { root: root, dirs: dirs, files: files };
}

/* ---- 极简 ZIP 打包（仅存储，不压缩；足够让解压工具还原目录） ---- */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let i = 0; i < 256; i++){
    let c = i;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(entries){
  const enc = new TextEncoder();
  const fallback = new Date();
  function dos(d){
    const t = d instanceof Date && !isNaN(d) ? d : fallback;
    let y = t.getFullYear();
    if(y < 1980) y = 1980;
    if(y > 2107) y = 2107;
    return [
      ((t.getHours() << 11) | (t.getMinutes() << 5) | (t.getSeconds() >> 1)) & 0xFFFF,
      (((y - 1980) << 9) | ((t.getMonth() + 1) << 5) | t.getDate()) & 0xFFFF
    ];
  }

  const locals = [];   // { header, name, data }
  const centrals = [];
  let offset = 0;

  entries.forEach(function(e){
    const nameBytes = enc.encode(e.name);
    const data = e.dir ? new Uint8Array(0) : (e.data || new Uint8Array(0));
    const crc = crc32(data);
    const dt = dos(e.time);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);           // 解压所需版本
    lh.setUint16(6, 0x0800, true);       // bit 11：文件名为 UTF-8
    lh.setUint16(8, 0, true);            // 0 = 仅存储
    lh.setUint16(10, dt[0], true);
    lh.setUint16(12, dt[1], true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);
    locals.push({ header:new Uint8Array(lh.buffer), name:nameBytes, data:data });

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);           // 制作版本
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dt[0], true);
    ch.setUint16(14, dt[1], true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint16(30, 0, true);           // extra
    ch.setUint16(32, 0, true);           // comment
    ch.setUint16(34, 0, true);           // disk
    ch.setUint16(36, 0, true);           // 内部属性
    ch.setUint32(38, e.dir ? 0x41ED0010 : 0x81A40000, true);   // 外部属性：目录位 / 常规文件
    ch.setUint32(42, offset, true);
    centrals.push({ header:new Uint8Array(ch.buffer), name:nameBytes });

    offset += 30 + nameBytes.length + data.length;
  });

  let centralSize = 0;
  centrals.forEach(function(c){ centralSize += 46 + c.name.length; });

  const total = offset + centralSize + 22;
  const out = new Uint8Array(total);
  let p = 0;

  locals.forEach(function(l){
    out.set(l.header, p); p += l.header.length;
    out.set(l.name, p);   p += l.name.length;
    out.set(l.data, p);   p += l.data.length;
  });
  centrals.forEach(function(c){
    out.set(c.header, p); p += c.header.length;
    out.set(c.name, p);   p += c.name.length;
  });

  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  out.set(new Uint8Array(eocd.buffer), p);
  return out;
}

function zipPlan(plan){
  const enc = new TextEncoder();
  const entries = [{ name: plan.root + '/', dir: true }];
  plan.dirs.forEach(function(d){ entries.push({ name: plan.root + '/' + d + '/', dir: true }); });
  plan.files.forEach(function(f){
    entries.push({
      name: plan.root + '/' + (f.dir ? f.dir + '/' : '') + f.name,
      data: enc.encode(f.content),
      time: f.time ? new Date(f.time) : null,
      dir: false
    });
  });
  return makeZip(entries);
}

async function exportTree(fmt, fid){
  const plan = buildTreePlan(fmt, fid);
  if(!plan.files.length){ toast('这里还没有便签可以导出'); return; }

  // 安卓壳：直接建真实的多层目录，不用解压
  if(window.AndroidBridge && window.AndroidBridge.saveTree){
    try{
      const res = String(window.AndroidBridge.saveTree(JSON.stringify(plan)));
      if(res.indexOf('ok|') === 0){
        const p = res.split('|');
        const skipped = Number(p[2] || 0);
        toast('已写入「下载/' + plan.root + '」' + p[1] + ' 个文件' +
              (skipped ? '（' + skipped + ' 个空文件夹已略过）' : ''));
        return;
      }
      if(res.indexOf('err|') === 0) toast('目录写入失败：' + res.slice(4).slice(0, 40));
    }catch(e){ /* 落回 zip */ }
  }

  // 浏览器：打包成 zip，解压后就是同样的目录结构
  await saveBlob(plan.root + '.zip', new Blob([zipPlan(plan)], { type:'application/zip' }));
}

async function importJSON(file){
  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(e){
    toast('文件不是有效的 JSON');
    return;
  }
  if(!data || !Array.isArray(data.folders) || !Array.isArray(data.notes)){
    toast('这不是本应用导出的备份文件');
    return;
  }
  const ok = await confirmDialog('将导入 ' + data.folders.length + ' 个文件夹、' + data.notes.length + ' 条便签，并与现有数据合并。继续？');
  if(!ok) return;

  const idMap = new Map();
  data.folders.forEach(function(f){ idMap.set(f.id, uid()); });
  data.folders.forEach(function(f){
    db.folders.push({
      id: idMap.get(f.id),
      name: f.name || '未命名',
      parentId: f.parentId ? (idMap.get(f.parentId) || null) : null,
      color: typeof f.color === 'number' ? f.color : 0,
      createdAt: f.createdAt || Date.now()
    });
  });
  let base = db.notes.length ? Math.max.apply(null, db.notes.map(n => n.order)) + 1 : 0;
  data.notes.forEach(function(n){
    db.notes.push({
      id: uid(),
      folderId: n.folderId ? (idMap.get(n.folderId) || null) : null,
      title: n.title || '',
      content: n.content || '',
      tags: Array.isArray(n.tags) ? n.tags.slice() : [],
      pinned: !!n.pinned,
      order: base++,
      createdAt: n.createdAt || Date.now(),
      updatedAt: n.updatedAt || Date.now()
    });
  });
  save();
  ui.folderId = null;
  render();
  toast('导入完成');
}

    const nid = oNote.dataset.openNote;
    openEditor(nid);
    // 从搜索结果点进来，直接把关键词带进便签内查找
    if(ui.searching && ui.query) setTimeout(function(){ openFind(ui.query); }, 300);
    return;
  }

  if(e.target.closest('[data-toggle-outline]')){
    ui.outlineOn = !ui.outlineOn;
    render();
    return;
  }

  const oFolder = e.target.closest('[data-open-folder]');
  if(oFolder){
    ui.folderId = oFolder.dataset.openFolder;
    ui.view = 'notes';
    ui.tagFilter = null;
    render();
    $('#view').scrollTop = 0;
    return;
  }
  const chip = e.target.closest('[data-tag]');
  if(chip){
    ui.tagFilter = chip.dataset.tag;
    ui.searching = false;
    render();
    $('#view').scrollTop = 0;
    return;
  }
  if(e.target.closest('[data-clear-tag]')){
    ui.tagFilter = null;
    render();
    return;
  }
  if(e.target.closest('[data-new-note]'))   return newNote();
  if(e.target.closest('[data-new-folder]')) return newFolder(ui.folderId);
  if(e.target.closest('[data-go-root]')){
    ui.folderId = null;
    ui.view = 'notes';
    render();
  }
});

/* 拖拽：pointer 事件在列表容器上委托 */
const viewEl = $('#view');
viewEl.addEventListener('pointerdown', function(e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  dragStart(e);
}, { passive:true });

window.addEventListener('pointermove', function(e){
  if(!drag.el) return;
  if(!drag.active){
    // 长按判定期间：移动过多就取消
    if(Math.abs(e.clientX - drag.startX) > 8 || Math.abs(e.clientY - drag.startY) > 8){
      clearTimeout(drag.timer);
      drag.el = null;
    }
    return;
  }
  e.preventDefault();
  dragMove(e);
}, { passive:false });

window.addEventListener('pointerup', function(){
  if(drag.active) dragEnd();
  else { clearTimeout(drag.timer); drag.el = null; }
  setTimeout(function(){ ui.suppressClick = false; }, 320);
}, { passive:true });

window.addEventListener('pointercancel', dragCancel, { passive:true });
// 拖拽中阻止页面滚动
document.addEventListener('touchmove', function(e){
  if(drag.active) e.preventDefault();
}, { passive:false });

$('#btnBack').onclick = function(){
  const f = getFolder(ui.folderId);
  ui.folderId = f ? (f.parentId || null) : null;
  render();
};

document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    ui.view = t.dataset.tab;
    ui.searching = false;
    ui.tagFilter = null;
    $('#searchBar').classList.remove('on');
    render();
  };
});

$('#btnSearch').onclick = function(){
  ui.searching = true;
  ui.tagFilter = null;
  $('#searchBar').classList.add('on');
  $('#searchInput').value = '';
  ui.query = '';
  render();
  setTimeout(function(){ $('#searchInput').focus(); }, 50);
};
$('#searchInput').addEventListener('input', function(e){
  ui.query = e.target.value.trim();
  render();
});
$('#searchCancel').onclick = function(){
  ui.searching = false;
  ui.query = '';
  $('#searchBar').classList.remove('on');
  render();
};

$('#btnMenu').onclick = openMainMenu;
$('#btnFab').onclick = function(){
  menuItems('新建', [
    { icon:'note',   label:'新建便签',   onClick:newNote },
    { icon:'folder', label:'新建文件夹', onClick:function(){ newFolder(ui.folderId); } }
  ]);
};

/* 编辑器 */
$('#edBack').onclick = closeEditor;
$('#edTitle').addEventListener('input', function(){ maybeUndoSnapshot(); scheduleSave(); if(ui.preview) renderPreview(); });
$('#edBody').addEventListener('input', function(){ maybeUndoSnapshot(); scheduleSave(); updateCount(); if(ui.preview) renderPreview(); });

$('#edUndo').onclick = doUndo;
$('#edRedo').onclick = doRedo;

// Ctrl/Cmd + Z 撤回，Ctrl + Shift + Z 或 Ctrl + Y 重做
document.addEventListener('keydown', function(e){
  if(!$('#editor').classList.contains('open')) return;
  if(!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const ae = document.activeElement;
  // 便签内查找框里交给浏览器自己处理
  if(ae && ae.id === 'edFindInput') return;
  const k = (e.key || '').toLowerCase();
  if(k === 'z' && !e.shiftKey){ e.preventDefault(); doUndo(); }
  else if((k === 'z' && e.shiftKey) || k === 'y'){ e.preventDefault(); doRedo(); }
});

$('#edTags').addEventListener('click', function(e){
  const del = e.target.closest('[data-del-tag]');
  if(del){
    const n = db.notes.find(x => x.id === ui.editingId);
    if(!n) return;
    n.tags = n.tags.filter(t => t !== del.dataset.delTag);
    n.updatedAt = Date.now();
    save(); renderTags(); setSaved('已保存');
    return;
  }
  if(e.target.closest('#edAddTag')) addTags();
});

$('#edPreviewBtn').onclick = function(){
  ui.preview = !ui.preview;
  $('#editor').classList.toggle('preview', ui.preview);
  $('#edPreviewBtn').classList.toggle('on', ui.preview);
  if(ui.preview) renderPreview();
};
function renderPreview(){
  $('#edPreview').innerHTML = '<div class="md-body">' + mdToHtml($('#edBody').value) + '</div>';
}

/* 便签内查找 */
$('#edFindBtn').onclick = function(){ find.on ? closeFind() : openFind(''); };
$('#edFindClose').onclick = closeFind;
$('#edFindPrev').onclick = function(){ gotoFind(-1); };
$('#edFindNext').onclick = function(){ gotoFind(1); };
$('#edFindInput').addEventListener('input', function(){ renderFind(true); });
$('#edFindInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); gotoFind(e.shiftKey ? -1 : 1); }
  if(e.key === 'Escape'){ e.preventDefault(); closeFind(); }
});
$('#edFindView').addEventListener('click', function(e){
  const m = e.target.closest('mark[data-fi]');
  if(!m) return;
  find.idx = Number(m.dataset.fi);
  markFindCur();
  updateFindCount();
});

$('#edMore').onclick = function(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  menuItems('更多操作', [
    { icon:'pin',   label:n.pinned ? '取消置顶' : '置顶', onClick:function(){
        n.pinned = !n.pinned; save(); toast(n.pinned ? '已置顶' : '已取消置顶');
      } },
    { icon:'tag',   label:'添加标签', onClick:addTags },
    { icon:'palette', label:'背景皮肤', onClick:function(){ openSkinPicker(n.id); } },
    { icon:'clock', label:'历史版本', onClick:openHistory },
    { icon:'search', label:'在本便签内查找', onClick:function(){ openFind(''); } },
    { icon:'down',  label:'导出这条便签', onClick:function(){ commitEdits(); openNoteExportMenu(n.id); } },
    { icon:'move',  label:'移动到…',  onClick:function(){ moveNote(n.id); } },
    { icon:'trash', label:'删除', danger:true, onClick:async function(){
        const ok = await confirmDialog('删除这条便签？此操作无法撤销。');
        if(!ok) return;
        db.notes = db.notes.filter(x => x.id !== n.id);
        ui.editingId = null;
        $('#editor').classList.remove('open');
        save(); render(); toast('已删除');
      } }
  ]);
};

$('#fileInput').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(f) importJSON(f);
  e.target.value = '';
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden && ui.editingId){ clearTimeout(saveTimer); commitEdits(); }
});

/* ============================================================
   10. 启动
   ============================================================ */
applyTheme();
loadDB();
render();

/* 安卓返回键：逐层关闭，返回 true 表示已消费 */
window.androidBack = function(){
  if($('#sheetRoot').classList.contains('open')){ closeSheet(); return true; }
  if(find.on){ closeFind(); return true; }
  if(ui.editingId){ closeEditor(); return true; }
  if(ui.searching){
    ui.searching = false; ui.query = '';
    $('#searchBar').classList.remove('on');
    render(); return true;
  }
  if(ui.tagFilter){ ui.tagFilter = null; render(); return true; }
  if(ui.outlineOn){ ui.outlineOn = false; render(); return true; }
  if(ui.folderId){
    const f = getFolder(ui.folderId);
    ui.folderId = f ? (f.parentId || null) : null;
    render(); return true;
  }
  if(ui.view === 'tree'){ ui.view = 'notes'; render(); return true; }
  return false;
};

if(matchMedia('(prefers-color-scheme: dark)').addEventListener){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    // 只有「跟随系统」时才响应系统切换，手动选过就听用户的
    if(ui.theme === 'system'){ applyTheme(); render(); }
  });
}
</script>
</body>
</html>
