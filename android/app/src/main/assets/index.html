<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f2f2f7" id="metaTheme" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="便签" />
<meta name="format-detection" content="telephone=no" />
<title>便签</title>
<script>
/* 首屏就把主题定下来，避免先白后黑闪一下。
   这段必须放在样式之前，且不能依赖下面任何函数。 */
(function(){
  var t = 'system';
  try{ t = localStorage.getItem('noteapp.theme') || 'system'; }catch(e){}
  var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<style>
/* ============================================================
   1. 主题变量：只改这里就能换配色
   ============================================================ */
:root{
  --bg:#f2f2f7;
  --surface:#ffffff;
  --surface-2:#ececf1;
  --text:#1c1c1e;
  --t2:#8a8a8e;
  --line:rgba(60,60,67,.13);
  --accent:#e8890c;
  --soft:rgba(232,137,12,.12);
  --danger:#ff3b30;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  --bar:rgba(242,242,247,.86);
}
/* 深色：由 JS 写在 <html data-theme="dark"> 上，不再只用媒体查询 ——
   这样「手动选深色」和「跟随系统」走同一套变量，不会两处维护 */
:root[data-theme="dark"]{
  --bg:#000000;
  --surface:#1c1c1e;
  --surface-2:#2c2c2e;
  --text:#f2f2f7;
  --t2:#8e8e93;
  --line:rgba(255,255,255,.11);
  --accent:#ffa726;
  --soft:rgba(255,167,38,.16);
  --danger:#ff453a;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --bar:rgba(0,0,0,.78);
}

/* ---------- 便签皮肤：只覆盖颜色变量，子树里的组件全部自动跟着变 ----------
   生效范围是「挂了 data-skin 的元素及其子元素」，所以编辑器根节点和列表卡片共用同一套 */
[data-skin="cream"]{
  --bg:#f7efdc; --surface:#fffaf0; --surface-2:#f0e5cd;
  --text:#3a3327; --t2:#8a7c62; --line:rgba(90,75,50,.14);
  --bar:rgba(247,239,220,.88); --soft:rgba(200,140,30,.14);
}
[data-skin="mint"]{
  --bg:#e6f2ea; --surface:#f4fbf6; --surface-2:#dceee2;
  --text:#22352b; --t2:#6d8377; --line:rgba(40,80,60,.14);
  --bar:rgba(230,242,234,.88); --soft:rgba(40,140,90,.14);
}
[data-skin="rose"]{
  --bg:#f9e9ee; --surface:#fff7f9; --surface-2:#f3dde5;
  --text:#3d2830; --t2:#8d6c78; --line:rgba(120,60,80,.13);
  --bar:rgba(249,233,238,.88); --soft:rgba(200,80,120,.12);
}
[data-skin="sky"]{
  --bg:#e6eef8; --surface:#f5f9ff; --surface-2:#dbe7f5;
  --text:#22303f; --t2:#6b7c90; --line:rgba(50,80,120,.13);
  --bar:rgba(230,238,248,.88); --soft:rgba(50,120,200,.12);
}
[data-skin="sand"]{
  --bg:#efe8dd; --surface:#faf6f0; --surface-2:#e6dccc;
  --text:#382f26; --t2:#857864; --line:rgba(90,75,55,.14);
  --bar:rgba(239,232,221,.88); --soft:rgba(160,120,70,.14);
}
/* 变量只影响显式用 var() 的属性。文字颜色是「继承」下来的，
   所以挂皮肤的根节点必须自己重新取一次 --text，否则 input/卡片里的字还是主题色 */
[data-skin]{color:var(--text)}
:root[data-theme="dark"] [data-skin="cream"]{
  --bg:#241f17; --surface:#2d261c; --surface-2:#382f22;
  --text:#f0e6d2; --t2:#a99a80; --line:rgba(255,240,210,.12);
  --bar:rgba(36,31,23,.88); --soft:rgba(255,180,70,.15);
}
:root[data-theme="dark"] [data-skin="mint"]{
  --bg:#16241d; --surface:#1c2c23; --surface-2:#24382c;
  --text:#dfeee4; --t2:#8ba295; --line:rgba(220,255,235,.11);
  --bar:rgba(22,36,29,.88); --soft:rgba(90,220,160,.14);
}
:root[data-theme="dark"] [data-skin="rose"]{
  --bg:#271a1f; --surface:#312128; --surface-2:#3d2932;
  --text:#f4e2e8; --t2:#b1909c; --line:rgba(255,220,235,.11);
  --bar:rgba(39,26,31,.88); --soft:rgba(255,140,180,.14);
}
:root[data-theme="dark"] [data-skin="sky"]{
  --bg:#16202b; --surface:#1c2836; --surface-2:#243447;
  --text:#dfe9f5; --t2:#8ba0b6; --line:rgba(210,235,255,.11);
  --bar:rgba(22,32,43,.88); --soft:rgba(110,180,255,.14);
}
:root[data-theme="dark"] [data-skin="sand"]{
  --bg:#221d18; --surface:#2b241d; --surface-2:#362d24;
  --text:#ece2d4; --t2:#a2947f; --line:rgba(255,235,210,.11);
  --bar:rgba(34,29,24,.88); --soft:rgba(220,180,120,.14);
}

/* ============================================================
   2. 基础
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
  font-size:16px;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}

/* ============================================================
   3. 骨架
   ============================================================ */
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:640px; margin:0 auto;
  background:var(--bg);
}
.appbar{
  flex:none;
  position:relative; z-index:6;
  display:grid;
  grid-template-columns:88px 1fr 88px;
  align-items:center;
  padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;
  background:var(--bar);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:.5px solid var(--line);
}
.appbar h1{
  font-size:17px; font-weight:600; letter-spacing:.2px;
  text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.appbar-right{display:flex; justify-content:flex-end}
.appbar > .iconbtn{justify-self:start}
.iconbtn{
  width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center; color:var(--text);
  transition:background .15s;
  flex:none;
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn.on{color:var(--accent)}

.searchbar{
  position:absolute; inset:0; display:none; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;
  background:var(--bar);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
}
.searchbar.on{display:flex}
.searchbar input{
  flex:1; min-width:0;
  -webkit-appearance:none; appearance:none;
  border:0; outline:none;
  background:var(--surface-2);
  border-radius:10px; padding:8px 12px; font-size:16px;
}
.searchbar input::-webkit-search-cancel-button{-webkit-appearance:none}
.searchbar .cancel{font-size:15px; color:var(--accent); padding:0 4px; flex:none}

#view{
  flex:1; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:6px 16px calc(96px + env(safe-area-inset-bottom));
}

.tabbar{
  flex:none; display:flex;
  background:var(--bar);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border-top:.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; padding:7px 0 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:500; color:var(--t2);
  transition:color .15s;
}
.tab.on{color:var(--accent)}

.fab{
  position:fixed;
  right:max(18px, calc(50% - 320px + 18px));
  bottom:calc(72px + env(safe-area-inset-bottom));
  width:54px; height:54px; border-radius:50%;
  background:var(--accent); color:#fff;
  display:grid; place-items:center;
  box-shadow:0 8px 22px rgba(232,137,12,.42);
  z-index:8;
  transition:transform .15s;
}
.fab:active{transform:scale(.92)}

/* ============================================================
   4. 列表
   ============================================================ */
.sec{
  display:flex; align-items:center; gap:6px;
  margin:18px 2px 10px;
  font-size:12px; font-weight:600; color:var(--t2); letter-spacing:.4px;
}
.sec em{font-style:normal; font-weight:500; opacity:.65}
.sec .clear-tag{margin-left:auto; font-size:12px; font-weight:500; color:var(--accent)}

/* 标签筛选条 */
.tagbar{
  display:flex; gap:7px; overflow-x:auto; overflow-y:hidden;
  padding:8px 0 4px;
  margin:0 -16px; padding-left:16px; padding-right:16px;
  scrollbar-width:none;
}
.tagbar::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 11px; border-radius:999px;
  background:var(--surface); color:var(--text);
  font-size:12.5px; font-weight:500;
  box-shadow:var(--shadow);
  white-space:nowrap;
}
.chip.on{background:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(232,137,12,.3)}
.chip .num{opacity:.55; font-size:11px}

.folder-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.folder-card{
  position:relative;
  display:flex; flex-direction:column; gap:9px;
  background:var(--surface);
  border-radius:16px;
  padding:13px 10px 12px 13px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .12s;
}
.folder-card:active{transform:scale(.97)}
.fc-top{display:flex; align-items:center; justify-content:space-between; width:100%}
.fc-icon{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; flex:none}
.fc-name{
  font-size:14px; font-weight:600; line-height:1.35; word-break:break-all;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.fc-sub{font-size:11px; color:var(--t2); line-height:1.3}

.note-list{display:flex; flex-direction:column; gap:8px; position:relative}
.note-card{
  position:relative;
  display:flex; align-items:flex-start; gap:4px;
  background:var(--surface);
  border-radius:16px;
  padding:13px 8px 13px 14px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s;
  will-change:transform;
}.note-card:active{transform:scale(.985)}
/* 长按要用来触发拖拽，所以在这些元素上禁用文本选中和系统长按菜单 */
.note-card, .folder-card, .tree-row, .chip, .tab, .btn-primary, .sheet-item, .iconbtn{
  -webkit-user-select:none; -moz-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
.note-card.pinned{box-shadow:var(--shadow), inset 3px 0 0 var(--accent)}
.note-card.dragging{
  z-index:30;
  box-shadow:0 14px 34px rgba(0,0,0,.22);
  transform:scale(1.02);
  transition:none;
  cursor:grabbing;
}
.nc-main{flex:1; min-width:0}
.nc-main h3{
  font-size:15px; font-weight:600; line-height:1.4;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:5px;
}
.nc-main h3 span{overflow:hidden; text-overflow:ellipsis}
.pin-ico{color:var(--accent); flex:none; display:inline-flex; transform:rotate(35deg)}
.nc-main p{
  margin-top:3px; font-size:13px; color:var(--t2); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.nc-time{margin-top:6px; font-size:11px; color:var(--t2)}
.note-tags{
  display:flex; gap:5px; margin-top:7px; overflow:hidden; max-height:20px;
}
.mini-tag{
  flex:none;
  font-size:11px; line-height:1.6;
  color:var(--accent); background:var(--soft);
  border-radius:6px; padding:0 7px;
  white-space:nowrap;
}
.mini-tag.more-tag{background:var(--surface-2); color:var(--t2)}

.more{
  flex:none; width:30px; height:30px; border-radius:8px;
  display:grid; place-items:center; color:var(--t2);
  transition:background .15s;
}
.more:active{background:var(--surface-2)}

/* 树视图 */
.tree{
  background:var(--surface);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:4px;
  overflow:hidden;
}
.tree-row{
  display:flex; align-items:center; gap:8px;
  padding:11px 10px; border-radius:12px;
  cursor:pointer;
  transition:background .15s;
}
.tree-row + .tree-row{box-shadow:inset 0 .5px 0 var(--line)}
.tree-row:active{background:var(--surface-2)}
.tr-icon{display:flex; flex:none}
.tr-name{flex:1; min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr-count{font-size:12px; color:var(--t2); flex:none}

/* 当前文件夹的目录大纲（文件夹 + 笔记全展开，可点击跳转） */
.outline-head{
  display:flex; align-items:center; gap:8px;
  width:100%; margin-top:10px;
  padding:11px 13px;
  background:var(--surface);
  border-radius:14px;
  box-shadow:var(--shadow);
  color:var(--text);
  font-size:13.5px; font-weight:600;
  text-align:left;
  -webkit-user-select:none; user-select:none;
}
.outline-head:active{background:var(--surface-2)}
.outline-head .oh-sub{
  margin-left:auto; font-weight:400; font-size:11.5px; color:var(--t2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.outline-head .oh-chev{flex:none; display:flex; color:var(--t2); transition:transform .18s}
.outline-head.on .oh-chev{transform:rotate(90deg)}
.outline{
  margin-top:8px; padding:5px;
  background:var(--surface);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.ol-row{
  display:flex; align-items:center; gap:7px;
  padding:8px 10px;
  border-radius:9px;
  font-size:13.5px;
  cursor:pointer;
}
.ol-row:active{background:var(--surface-2)}
.ol-row.folder{font-weight:600}
.ol-row.empty-row{color:var(--t2); cursor:default; font-weight:400; padding-left:12px}
.ol-ico{display:flex; flex:none; width:17px; justify-content:center}
.ol-mark{display:flex; flex:none; width:11px; justify-content:center; align-items:center}
.ol-dot{width:3px; height:3px; border-radius:50%; background:var(--t2); opacity:.6}
.ol-pin{display:flex; color:var(--accent); transform:rotate(35deg)}
.ol-name{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ol-name.untitled{color:var(--t2); font-weight:400}
.ol-num{font-size:11px; color:var(--t2); flex:none}

.empty{padding:64px 24px; text-align:center; color:var(--t2)}
.empty svg{opacity:.3; margin-bottom:14px}
.empty p{font-size:14px; margin-bottom:18px}
.btn-primary{
  background:var(--accent); color:#fff;
  border-radius:12px; padding:11px 22px;
  font-size:15px; font-weight:600;
  box-shadow:0 4px 12px rgba(232,137,12,.3);
}
.btn-primary:active{opacity:.85}

/* ============================================================
   5. 编辑器
   ============================================================ */
#editor{
  position:fixed; inset:0; z-index:40;
  display:flex; flex-direction:column;
  max-width:640px; margin:0 auto;
  background:var(--bg);
  transform:translateX(100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);
}
#editor.open{transform:none}
#editor:not(.open){pointer-events:none}
/* 编辑器顶栏右侧有三个按钮，收窄左列给中间留位置 */
#editor .appbar{grid-template-columns:44px 1fr auto}
.ed-path{
  font-size:12px; color:var(--t2); text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:0 4px;
}
#edTitle{
  flex:none; width:100%; border:0; outline:none; background:transparent;
  font-size:22px; font-weight:700; letter-spacing:.2px;
  padding:16px 20px 4px;
}
#edTitle::placeholder{color:var(--t2); opacity:.55}

/* 标签编辑区 */
#edTags{
  flex:none; display:flex; flex-wrap:wrap; gap:6px;
  padding:6px 20px 10px;
}
.ed-tag{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--soft); color:var(--accent);
  border-radius:8px; padding:3px 8px;
  font-size:12px; font-weight:500;
}
.ed-tag button{color:inherit; opacity:.65; display:flex; padding:0}
.ed-tag button:active{opacity:1}
.tag-add{
  display:inline-flex; align-items:center; gap:3px;
  border-radius:8px; padding:3px 9px;
  font-size:12px; color:var(--t2);
  border:1px dashed var(--line);
}

#edBody{
  flex:1; min-height:0; width:100%;
  border:0; outline:none; background:transparent; resize:none;
  font-size:16px; line-height:1.75;
  padding:4px 20px 24px;
  -webkit-overflow-scrolling:touch;
}
#edBody::placeholder{color:var(--t2); opacity:.55}

/* Markdown 预览 */
#edPreview{
  flex:1; min-height:0; overflow-y:auto;
  padding:4px 20px 24px;
  font-size:15.5px; line-height:1.75;
  display:none;
}
#editor.preview #edBody{display:none}
#editor.preview #edPreview{display:block}
#editor.preview #edTitle{opacity:.9}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{font-weight:700; line-height:1.4; margin:18px 0 8px}
.md-body h1{font-size:24px; margin-top:6px}
.md-body h2{font-size:20px}
.md-body h3{font-size:17px}
.md-body h4{font-size:16px}
.md-body h5,.md-body h6{font-size:15px; font-weight:600; margin:14px 0 6px}
.md-body p{margin:0 0 12px}
.md-body ul,.md-body ol{margin:0 0 12px; padding-left:22px}
.md-body li{margin:3px 0}
.md-body blockquote{
  margin:0 0 12px; padding:2px 0 2px 12px;
  border-left:3px solid var(--accent);
  color:var(--t2);
}
.md-body code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.9em;
  background:var(--surface-2); border-radius:5px; padding:1px 5px;
}
.md-body pre{
  background:var(--surface-2); border-radius:10px;
  padding:12px 14px; overflow-x:auto; margin:0 0 12px;
}
.md-body pre code{background:none; padding:0; font-size:13px; line-height:1.6}
.md-body hr{border:0; border-top:1px solid var(--line); margin:18px 0}
.md-body a{color:var(--accent); text-decoration:none}
.md-body strong{font-weight:700}
.md-body .md-empty{color:var(--t2); font-size:14px}
/* 表格：手机上列多时整块横向滚动，不把正文撑宽 */
.md-body .md-table{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 12px}
.md-body table{border-collapse:collapse; width:100%; font-size:13.5px; line-height:1.55}
.md-body th,.md-body td{
  border:1px solid var(--line); padding:6px 9px;
  text-align:left; vertical-align:top; word-break:break-word;
  /* 给每列一个下限，否则窄屏上短列会被长内容挤成一行一个字 */
  min-width:7.2em;
}
.md-body th{background:var(--surface-2); font-weight:600; white-space:nowrap}
.md-body .ta-c{text-align:center}
.md-body .ta-r{text-align:right}
.md-body .ta-l{text-align:left}
.md-body img{max-width:100%; height:auto; border-radius:8px; vertical-align:middle}
.md-body li.task{list-style:none; margin-left:-17px}
.md-body li.task input{
  -webkit-appearance:none; appearance:none;
  width:15px; height:15px; margin:0 7px 0 0;
  vertical-align:-2px; opacity:1; position:relative;
  border:1.5px solid var(--t2); border-radius:4px; background:transparent;
}
.md-body li.task input:checked{background:var(--accent); border-color:var(--accent)}
.md-body li.task input:checked::after{
  content:''; position:absolute; left:4px; top:0.5px;
  width:4px; height:8px; border:solid #fff;
  border-width:0 2px 2px 0; transform:rotate(45deg);
}
.md-body ul ul,.md-body ul ol,.md-body ol ul,.md-body ol ol{margin:3px 0}

/* 便签内查找 */
#edFind{display:none; align-items:center; gap:4px; padding:0 10px 10px}
#editor.finding #edFind{display:flex}
#edFind input{
  flex:1; min-width:0;
  -webkit-appearance:none; appearance:none;
  border:0; outline:none;
  background:var(--surface-2); color:var(--text);
  border-radius:10px; padding:8px 12px; font-size:15px;
}
#edFind input::-webkit-search-cancel-button{-webkit-appearance:none}
#edFind .cnt{
  flex:none; min-width:40px; text-align:center;
  font-size:12px; color:var(--t2);
  font-variant-numeric:tabular-nums;
}
#edFind .nav{
  width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center; color:var(--text); flex:none;
}
#edFind .nav:disabled{opacity:.28}
#edFind .nav:active:not(:disabled){background:var(--surface-2)}
#edFind .done{flex:none; font-size:15px; color:var(--accent); padding:0 4px}

#edFindView{
  display:none; flex:1; min-height:0; overflow-y:auto;
  padding:4px 20px 24px;
  font-size:16px; line-height:1.75;
  white-space:pre-wrap; word-break:break-word;
  -webkit-overflow-scrolling:touch;
}
#editor.finding #edFindView{display:block}
#editor.finding #edBody,
#editor.finding #edPreview{display:none}
#edFindView mark{
  background:rgba(232,137,12,.25); color:inherit;
  border-radius:3px; padding:1px 0;
}
#edFindView mark.cur{background:var(--accent); color:var(--surface)}
#edFindView .ph{color:var(--t2); font-size:14px}

/* 列表里搜索命中的高亮 */
mark.hl{
  background:rgba(232,137,12,.26); color:inherit;
  border-radius:3px; padding:0 1px; font-weight:inherit;
}
:root[data-theme="dark"] #edFindView mark{background:rgba(255,167,38,.24)}
:root[data-theme="dark"] mark.hl{background:rgba(255,167,38,.26)}

.ed-foot{
  flex:none; display:flex; justify-content:space-between; align-items:center;
  padding:4px 14px calc(4px + env(safe-area-inset-bottom));
  font-size:11px; color:var(--t2);
  border-top:.5px solid var(--line);
}
.ed-undo{display:flex; align-items:center; gap:1px}
.ed-undo #edCount{margin-left:6px}
.ubtn{
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border:0; background:none; padding:0; border-radius:9px;
  color:var(--t2); -webkit-tap-highlight-color:transparent;
}
.ubtn:active:not(:disabled){background:var(--surface-2); color:var(--text)}
.ubtn:disabled{opacity:.25}

/* ============================================================
   6. 菜单 / 对话框 / 提示
   ============================================================ */
#sheetRoot{position:fixed; inset:0; z-index:60; display:none}
#sheetRoot.open{display:block}
.mask{position:absolute; inset:0; background:rgba(0,0,0,.42)}
.sheet{
  position:absolute; left:0; right:0; bottom:0;
  max-width:640px; margin:0 auto;
  max-height:82vh; overflow-y:auto;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  padding:6px 8px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.18);
}
#sheetRoot.open .sheet{animation:sheetUp .26s cubic-bezier(.32,.72,0,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h4{font-size:13px; font-weight:600; color:var(--t2); margin:14px 14px 6px}
.sheet-item{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:14px; border-radius:12px;
  font-size:15px; text-align:left;
  transition:background .12s;
}
.sheet-item:active{background:var(--surface-2)}
.sheet-item.danger{color:var(--danger)}
.sheet-item:disabled{opacity:.32}

/* 历史版本列表 */
.hist-now{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:12px; color:var(--t2);
  padding:6px 2px 10px;
}
.hist-list{display:flex; flex-direction:column; gap:1px; margin:0 -8px}
.hist-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left; font:inherit;
  border:0; background:none; padding:9px 8px; border-radius:12px;
  color:var(--text); -webkit-tap-highlight-color:transparent;
}
.hist-item:active{background:var(--surface-2)}
.hist-item svg{color:var(--t2); flex:none}
.hist-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.hist-time{font-size:13.5px}
.hist-snip{font-size:12px; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hist-len{font-size:11px; color:var(--t2); flex:none}
.sheet-item.on{color:var(--accent)}
.pick-desc{margin-left:auto; color:var(--t2); font-size:12px}
.pick-ok{margin-left:8px; display:flex; color:var(--accent)}

/* 皮肤选择：3 列色卡 */
.skin-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  padding:2px 12px 6px;
}
.skin-cell{
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  padding:13px 6px 11px;
  border-radius:14px;
  border:1.5px solid transparent;
  background:var(--surface-2);
  transition:border-color .15s, background .15s;
}
.skin-cell.on{border-color:var(--accent); background:var(--soft)}
.skin-dot{
  width:34px; height:34px; border-radius:50%;
  box-shadow:inset 0 0 0 1px var(--line), 0 1px 4px rgba(0,0,0,.12);
}
.skin-name{font-size:12px; color:var(--text)}
.skin-ok{position:absolute; top:7px; right:7px; display:none; color:var(--accent)}
.skin-cell.on .skin-ok{display:flex}
.pd-wrap{padding:6px 14px 12px}
.textfield{
  width:100%; border:0; outline:none;
  background:var(--surface-2);
  border-radius:12px; padding:12px 14px; font-size:16px;
}
.pd-actions{display:flex; gap:8px; padding:0 8px 4px}
.pd-btn{
  flex:1; padding:14px; border-radius:12px;
  background:var(--surface-2); font-size:15px; font-weight:600;
  text-align:center;
}
.pd-btn.primary{background:var(--accent); color:#fff}
.pd-msg{padding:4px 16px 14px; font-size:14px; line-height:1.6; color:var(--text)}

#toast{
  position:fixed; left:50%; bottom:118px;
  transform:translate(-50%, 10px);
  background:rgba(28,28,30,.93); color:#fff;
  font-size:13px; padding:9px 18px; border-radius:20px;
  opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s;
  z-index:99; max-width:80vw; text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%,0)}
</style>

<script>
/* ============================================================
   0. 图标
   ============================================================ */
const PATH = {
  more:'<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  folder:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.1c.7 0 1.3.3 1.8.7l1 1H18.5A2.5 2.5 0 0 1 21 9.2v7.3A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/>',
  note:'<path d="M6 3.5h8l5 5v12a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V5a1.5 1.5 0 0 1 1-1.5z"/><path d="M14 3.5V9h5"/>',
  move:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.1c.7 0 1.3.3 1.8.7l1 1h6.1A2.5 2.5 0 0 1 21 9.2v7.3A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M12 11.5v5M9.5 14l2.5 2.5L14.5 14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7"/>',
  down:'<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 20h16"/>',
  pin:'<path d="M12 21v-6"/><path d="M8.5 3h7l-.8 5.2 2.3 3.3V13H7v-1.5l2.3-3.3z"/>',
  tag:'<path d="M3 11.2V5.5A2.5 2.5 0 0 1 5.5 3h5.7c.7 0 1.3.3 1.8.7l7.3 7.3a1.5 1.5 0 0 1 0 2.1l-5.2 5.2a1.5 1.5 0 0 1-2.1 0L3.7 13c-.4-.5-.7-1.1-.7-1.8z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8h.01"/>',
  text:'<path d="M5 5h14M5 9.5h9M5 14h14M5 18.5h9"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5L16.5 16.5"/>',
  code:'<path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/>',
  chev:'<path d="M9 5.5l6.5 6.5L9 18.5"/>',
  sun:'<circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.2M12 19.2v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/>',
  moon:'<path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/>',
  auto:'<circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none"/>',
  check:'<path d="M4.8 12.6l4.8 4.8 9.6-10.4"/>',
  palette:'<path d="M12 3.6c-4.7 0-8.4 3.7-8.4 8.4s3.7 8.4 8.4 8.4c1.3 0 2.2-.9 2.2-2 0-.5-.2-.9-.5-1.2-.3-.3-.4-.7-.4-1.1 0-1 .8-1.7 1.7-1.7h1.7c2.1 0 3.7-1.6 3.7-3.7 0-3.9-3.7-7.1-8.4-7.1z"/><circle cx="8.2" cy="10.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="7.9" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.8" cy="10.2" r="1.15" fill="currentColor" stroke="none"/>'
};
function icon(name, size=22, sw=1.8){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+PATH[name]+'</svg>';
}

/* ============================================================
   1. 数据层
     folder = { id, name, parentId, color, createdAt }
     note   = { id, folderId, title, content, tags[], pinned, order, createdAt, updatedAt }
   ============================================================ */
const STORE_KEY = 'noteapp.v1';

/* 版本号：改这里，build-apk.sh 会拿它和 build.gradle 的 versionName 对账，不一致就拒绝打包 */
const APP_VERSION = '1.4.0';

/* 便签皮肤：目前只有纯色。颜色定义在 CSS 的 [data-skin="…"] 里，
   sw 只用来画选择面板上的色点 */
const SKINS = [
  { id:'default', name:'默认', sw:'linear-gradient(135deg,#ffffff 50%,#1c1c1e 50%)' },
  { id:'cream',   name:'米黄', sw:'#f7efdc' },
  { id:'mint',    name:'薄荷', sw:'#e6f2ea' },
  { id:'rose',    name:'樱粉', sw:'#f9e9ee' },
  { id:'sky',     name:'天青', sw:'#e6eef8' },
  { id:'sand',    name:'沙褐', sw:'#efe8dd' }
];

const COLORS = [
  {c:'#e8890c', rgb:'232,137,12'},
  {c:'#2f9e44', rgb:'47,158,68'},
  {c:'#1c7ed6', rgb:'28,126,214'},
  {c:'#9c36b5', rgb:'156,54,181'},
  {c:'#e8590c', rgb:'232,89,12'},
  {c:'#0ca678', rgb:'12,166,120'}
];
function tint(col){
  const a = isDark() ? 0.26 : 0.13;
  return 'rgba(' + col.rgb + ',' + a + ')';
}

let db = { folders: [], notes: [] };

const THEME_KEY = 'noteapp.theme';
let savedTheme = 'system';
try{ savedTheme = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}

let ui = { view:'notes', folderId:null, searching:false, query:'', editingId:null,
           tagFilter:null, preview:false, suppressClick:false, outlineOn:false,
           theme:savedTheme };

/* 主题：light / dark / system 三种，system 时实时跟随系统 */
function isDark(){
  return document.documentElement.dataset.theme === 'dark';
}
function applyTheme(){
  const t = ui.theme || 'system';
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.getElementById('metaTheme');
  if(m) m.setAttribute('content', dark ? '#000000' : '#f2f2f7');
}
function setTheme(t){
  ui.theme = t;
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  applyTheme();
  render();
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad = n => String(n).padStart(2,'0');

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.folders) && Array.isArray(d.notes)) db = d;
    }
  }catch(e){ console.warn('本地数据读取失败', e); }
  if(!db.folders.length && !db.notes.length) seed();
  normalize();
  save();
}
/* 兼容旧版本数据：补齐 tags / pinned / order */
function normalize(){
  db.folders.forEach(f => { if(typeof f.color !== 'number') f.color = 0; });
  db.notes.forEach((n, i) => {
    if(!Array.isArray(n.tags)) n.tags = [];
    if(typeof n.pinned !== 'boolean') n.pinned = false;
    if(typeof n.order !== 'number') n.order = i;
    // 皮肤是后加的字段，老数据没有；已删除的皮肤 id 也在这里清掉
    if(n.skin && !SKINS.some(s => s.id === n.skin)) n.skin = null;
    // 历史版本：导入的 JSON 可能是脏数据，只留结构正确的项
    if(n.history !== undefined && !Array.isArray(n.history)) n.history = [];
    if(Array.isArray(n.history)){
      n.history = n.history.filter(function(h){
        return h && typeof h === 'object' && typeof h.content === 'string';
      }).map(function(h){
        return { at: Number(h.at) || Date.now(), title: String(h.title || ''), content: String(h.content || '') };
      });
      trimHistory(n.history);
    }
  });
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); return; }
  catch(e){}
  // 存不下多半是历史版本占的地方 —— 正文优先，先清历史再试一次
  let dropped = false;
  db.notes.forEach(function(n){ if(n.history && n.history.length){ n.history = []; dropped = true; } });
  if(dropped){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(db));
      toast('空间不足，已清空历史版本');
      return;
    }catch(e2){}
  }
  toast('存储空间不足，建议导出备份');
}

function seed(){
  const now = Date.now();
  const work = { id:uid(), name:'工作', parentId:null, color:2, createdAt:now };
  const week = { id:uid(), name:'周报', parentId:work.id, color:2, createdAt:now };

/* ---------- 查询 ---------- */
const getFolder = id => db.folders.find(f => f.id === id) || null;
const subFolders = pid =>
  db.folders
    .filter(f => (f.parentId || null) === (pid || null))
    .sort((a,b) => a.name.localeCompare(b.name, 'zh-Hans-CN'));

/* 排序：置顶 → 手动顺序 → 最近更新 */
function sortNotes(list){
  return list.slice().sort((a,b) => {
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if(a.order !== b.order) return a.order - b.order;
    return b.updatedAt - a.updatedAt;
  });
}
const notesIn = fid => sortNotes(db.notes.filter(n => (n.folderId || null) === (fid || null)));

function descendantIds(fid){
  const out = [fid], stack = [fid];
  while(stack.length){
    const cur = stack.pop();
    db.folders.forEach(f => {
      if(f.parentId === cur && !out.includes(f.id)){ out.push(f.id); stack.push(f.id); }
    });
  }
  return out;
}
function countNotesDeep(fid){
  if(!fid) return db.notes.length;
  const ids = descendantIds(fid);
  return db.notes.filter(n => ids.includes(n.folderId)).length;
}
function folderPathText(fid){
  if(!fid) return '未分类';
  const arr = [];
  let cur = getFolder(fid), guard = 0;
  while(cur && guard++ < 50){ arr.unshift(cur.name); cur = cur.parentId ? getFolder(cur.parentId) : null; }
  return arr.join(' / ');
}
/* 全库标签统计 */
function allTags(){
  const m = new Map();
  db.notes.forEach(n => n.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return Array.from(m.entries()).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hans-CN'));
}

/* ---------- 时间 ---------- */
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const same = x => x.getFullYear()===d.getFullYear() && x.getMonth()===d.getMonth() && x.getDate()===d.getDate();
  if(same(now)) return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if(same(y)) return '昨天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if(d.getFullYear() === now.getFullYear()) return (d.getMonth()+1) + '月' + d.getDate() + '日';
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
}
function fmtFull(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function stamp(){
  const d = new Date();
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
}

function render(){

  if(ui.folderId && !cur){ ui.folderId = null; }

  let title = '我的便签';
  if(ui.tagFilter) title = '#' + ui.tagFilter;
  else if(ui.searching) title = '搜索';
  else if(cur) title = cur.name;

  $('#appTitle').textContent = title;
  $('#btnBack').style.visibility = (cur && !ui.searching && !ui.tagFilter) ? 'visible' : 'hidden';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === ui.view));
  $('#btnFab').style.display = (ui.searching || ui.tagFilter) ? 'none' : '';

  const v = $('#view');
  if(ui.searching)        v.innerHTML = viewSearch();
  else if(ui.tagFilter)   v.innerHTML = viewTag();
  else if(ui.view==='tree') v.innerHTML = viewTree();
  else                    v.innerHTML = viewNotes();
}

function tagBar(){
  const tags = allTags();
  if(!tags.length) return '';
  return '<div class="tagbar">' +
    tags.slice(0, 30).map(function(p){
      return '<button class="chip" data-tag="' + esc(p[0]) + '">' +
        icon('tag',13,2) + esc(p[0]) + '<span class="num">' + p[1] + '</span></button>';
    }).join('') + '</div>';
}

function viewNotes(){
  const fid = ui.folderId;
  const fs = subFolders(fid);

  h += outlinePanel(fid);

  if(fs.length){
    h += '<div class="sec">文件夹<em>' + fs.length + '</em></div>';
    h += '<div class="folder-grid">' + fs.map(folderCard).join('') + '</div>';

/* 目录大纲：把当前文件夹下所有层级的文件夹和笔记平铺展开，点哪跳哪 */
function outlinePanel(fid){
  const folderTotal = fid ? descendantIds(fid).length - 1 : db.folders.length;
  const noteTotal = countNotesDeep(fid);
  // 空文件夹不摆一个点了没反应的入口
  if(!folderTotal && !noteTotal) return '';
  const on = !!ui.outlineOn;

  let h = '<button class="outline-head' + (on ? ' on' : '') + '" data-toggle-outline>' +
      icon('text',17,1.9) +
      '<span>目录</span>' +
      '<span class="oh-sub">' + folderTotal + ' 个文件夹 · ' + noteTotal + ' 条便签</span>' +
      '<span class="oh-chev">' + icon('chev',14,2) + '</span>' +
    '</button>';

  if(!on) return h;
  return h + '<div class="outline">' + folderContent(fid, 0) + '</div>';
}

/* 先列这一层的笔记，再展开子文件夹 —— 每条笔记都紧贴它的父文件夹，
   否则"文件夹A的笔记"会漂到"文件夹A的子文件夹"后面，看着像孙子 */
function folderContent(fid, depth){
  // 层级太深时缩进封顶，避免长名字被挤到只剩几个字
  const pad = 10 + Math.min(depth, 8) * 16;
  let h = noteRows(fid, pad);
  subFolders(fid).forEach(function(f){
    const c = COLORS[(f.color || 0) % COLORS.length];
    const n = countNotesDeep(f.id);
    h += '<div class="ol-row folder" data-open-folder="' + f.id + '" style="padding-left:' + pad + 'px">' +
        '<span class="ol-ico" style="color:' + c.c + '">' + icon('folder',16,1.9) + '</span>' +
        '<span class="ol-name">' + esc(f.name) + '</span>' +
        '<span class="ol-num">' + (n ? n + ' 条' : '空') + '</span>' +
      '</div>' +
      folderContent(f.id, depth + 1);
  });
  return h;
}

function noteRows(fid, pad){
  return notesIn(fid).map(function(n){
    return '<div class="ol-row" data-open-note="' + n.id + '" style="padding-left:' + (pad + 24) + 'px">' +
        '<span class="ol-mark">' +
          (n.pinned ? '<span class="ol-pin">' + icon('pin',11,2) + '</span>' : '<span class="ol-dot"></span>') +
        '</span>' +
        '<span class="ol-name' + (n.title ? '' : ' untitled') + '">' + esc(n.title || '无标题') + '</span>' +
      '</div>';
  }).join('');
}

function viewTag(){
  const tag = ui.tagFilter;
  const res = sortNotes(db.notes.filter(n => n.tags.indexOf(tag) > -1));
  let h = '<div class="sec">标签<em>' + res.length + ' 条</em><button class="clear-tag" data-clear-tag>清除筛选</button></div>';
  if(!res.length) return h + '<div class="empty"><p>没有带 #' + esc(tag) + ' 的便签</p></div>';
  h += '<div class="note-list" id="noteList">' + res.map(n => noteCard(n, true)).join('') + '</div>';
  return h;
}

function folderCard(f){
  const c = COLORS[(f.color || 0) % COLORS.length];
  const n = countNotesDeep(f.id);
  const k = subFolders(f.id).length;
  const sub = [ n ? n + ' 条便签' : '', k ? k + ' 个子文件夹' : '' ].filter(Boolean).join(' · ') || '空文件夹';
  return '<div class="folder-card" data-open-folder="' + f.id + '">' +
      '<div class="fc-top">' +
        '<div class="fc-icon" style="background:' + tint(c) + ';color:' + c.c + '">' + icon('folder',20,1.9) + '</div>' +
        '<button class="more" data-more-folder="' + f.id + '">' + icon('more',18) + '</button>' +
      '</div>' +
      '<div class="fc-name">' + esc(f.name) + '</div>' +
      '<div class="fc-sub">' + sub + '</div>' +
    '</div>';
}

/* 把 Markdown 正文压成纯文本摘要（列表里显示用） */
function plainText(md){
  return String(md || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^\s{0,3}#{1,6}\s+/gm, '')
    .replace(/^\s{0,3}>\s?/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/^\s*\d+[.)]\s+/gm, '')
    .replace(/(\*\*|__)(.*?)\1/g, '$2')
    .replace(/~~(.*?)~~/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

/* 把命中的关键词包成 <mark>（先转义再加标签，顺序不能反） */
function hlText(text, q){
  const t = String(text == null ? '' : text);
  const lq = String(q == null ? '' : q).toLowerCase();
  if(!lq) return esc(t);
  const lower = t.toLowerCase();
  let out = '', i = 0;
  while(true){
    const k = lower.indexOf(lq, i);
    if(k < 0){ out += esc(t.slice(i)); break; }
    out += esc(t.slice(i, k)) + '<mark class="hl">' + esc(t.slice(k, k + lq.length)) + '</mark>';
    i = k + lq.length;
  }
  return out;
}

/* 搜索时正文摘要只截命中附近的一段，而不是永远从开头截 */
function snippetAround(text, q, before, after){
  const t = String(text || '');
  if(!t) return t;
  const ql = String(q || '').toLowerCase();
  const k = ql ? t.toLowerCase().indexOf(ql) : -1;
  if(k < 0) return t.length > 90 ? t.slice(0, 90) + '…' : t;
  const b = before || 16, a = after || 46;
  const s = Math.max(0, k - b);
  const e = Math.min(t.length, k + ql.length + a);
  return (s > 0 ? '…' : '') + t.slice(s, e) + (e < t.length ? '…' : '');
}

function noteCard(n, showPath, q){
  const title = n.title || '无标题';
  const body = snippetAround(plainText(n.content), q);
  const meta = fmtTime(n.updatedAt) + (showPath ? ' · ' + folderPathText(n.folderId) : '');
  const tags = n.tags || [];
  const shown = tags.slice(0, 3);
  const rest = tags.length - shown.length;

  let tagsHtml = '';
  if(tags.length){
    tagsHtml = '<div class="note-tags">' +
      shown.map(t => '<span class="mini-tag">#' + esc(t) + '</span>').join('') +
      (rest > 0 ? '<span class="mini-tag more-tag">+' + rest + '</span>' : '') +
      '</div>';
  }
  return '<div class="note-card' + (n.pinned ? ' pinned' : '') + '"' +
      (n.skin ? ' data-skin="' + n.skin + '"' : '') +
      ' data-open-note="' + n.id + '" data-drag-note="' + n.id + '">' +
      '<div class="nc-main">' +
        '<h3>' + (n.pinned ? '<i class="pin-ico">' + icon('pin',13,2) + '</i>' : '') +
          '<span>' + hlText(title, q) + '</span></h3>' +
        (body ? '<p>' + hlText(body, q) + '</p>' : '') +
        tagsHtml +
        '<div class="nc-time">' + esc(meta) + '</div>' +
      '</div>' +
      '<button class="more" data-more-note="' + n.id + '">' + icon('more',18) + '</button>' +
    '</div>';
}

function treeRows(pid, depth){

function viewSearch(){
  const q = ui.query.toLowerCase();
  if(!q) return '<div class="empty"><p>输入关键字，搜索标题、正文或标签</p></div>';
  const res = sortNotes(db.notes.filter(n =>
    ((n.title || '') + ' ' + (n.content || '') + ' ' + n.tags.join(' ')).toLowerCase().includes(q)
  ));
  if(!res.length) return '<div class="empty"><p>没有找到相关便签</p></div>';
  return '<div class="sec">搜索结果<em>' + res.length + '</em></div>' +
         '<div class="note-list">' + res.map(n => noteCard(n, true, ui.query)).join('') + '</div>';
}

/* ============================================================
   3. Markdown 渲染（轻量，自写，无依赖）
   ============================================================ */
/* Markdown 渲染
   支持：ATX / setext 标题、段落与硬换行、粗体 / 斜体 / 删除线、行内代码、
   围栏代码块、引用（内部可再放列表或表格）、有序 / 无序 / 任务列表（多级）、
   GFM 表格（含 :--: 对齐）、链接、图片、自动链接、分割线、反斜杠转义。
   所有文本先 esc()，链接与图片只放行 http(s)/mailto，避免 XSS。 */
function mdToHtml(src){
  if(!src || !src.trim()) return '<p class="md-empty">还没有内容</p>';

  /* 已生成的 HTML 片段先存起来换成占位符，
     否则后面的强调 / 链接规则会把标签本身再处理一遍 */
  const hold = [];
  function stash(html){ hold.push(html); return '\u0000' + (hold.length - 1) + '\u0000'; }

  function inline(text){
    let s = String(text);
    const escs = [];

    // 反斜杠转义先抽走，免得 \* 被当成强调
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!|~>])/g, function(_, c){
      escs.push(c); return '\u0001' + (escs.length - 1) + '\u0001';
    });

    s = esc(s);

    // 行内代码
    s = s.replace(/`([^`]+)`/g, function(_, c){
      return stash('<code>' + c + '</code>');
    });
    // 图片必须排在链接前面，否则 ![alt](url) 会被链接规则抢先吃掉
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, function(_, alt, url){
      return stash('<img src="' + url + '" alt="' + alt + '" loading="lazy" />');
    });
    // 链接
    s = s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, function(_, txt, url){
      return stash('<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>');
    });
    // <https://…> 自动链接（此时尖括号已被 esc 成 &lt; &gt;）
    s = s.replace(/&lt;((?:https?:\/\/|mailto:)[^\s&]+)&gt;/g, function(_, url){
      return stash('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
    });
    // 裸链接：要求前面是行首、空白或标点，避免命中已生成的 href="…"
    s = s.replace(/(^|[\s(（\[【「：:，,、])(https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+)/g,
      function(_, pre, url){
        return pre + stash('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
      });

    // 强调
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(（])_([^_\n]+)_(?=$|[\s)）.。,，!！?？:：;；])/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

    s = s.replace(/\u0000(\d+)\u0000/g, function(_, i){ return hold[+i]; });
    s = s.replace(/\u0001(\d+)\u0001/g, function(_, i){ return escs[+i]; });
    return s;
  }

  // 段落内换行：行尾两个空格或反斜杠 = 硬换行，先用 \u0002 占位
  function joinPara(arr){
    let s = '', hardPrev = false;
    for(let k = 0; k < arr.length; k++){
      const raw = arr[k];
      const hard = /( {2,}|\\)$/.test(raw);
      const clean = hard ? raw.replace(/( {2,}|\\)$/, '') : raw;
      if(k) s += hardPrev ? '\u0002' : ' ';
      s += clean;
      hardPrev = hard;
    }
    return s;
  }

  // 表格分隔行：|---|---| 或 |:--|--:|:-:|（也支持只有一列的 |---|）
  function isTableSep(line){
    if(line.indexOf('|') === -1) return false;
    return /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(line);
  }

  // 拆一行表格；行内代码里的 | 不算分隔
  function splitRow(line){
    let s = String(line).trim();
    if(s.charAt(0) === '|') s = s.slice(1);
    if(s.charAt(s.length - 1) === '|' && s.charAt(s.length - 2) !== '\\') s = s.slice(0, -1);
    const cells = [];
    let cur = '', inCode = false;
    for(let k = 0; k < s.length; k++){
      const ch = s.charAt(k);
      if(ch === '\\' && s.charAt(k + 1) === '|'){ cur += '|'; k++; continue; }
      if(ch === '`'){ inCode = !inCode; cur += ch; continue; }
      if(ch === '|' && !inCode){ cells.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  }

  function alignOf(sep){
    return splitRow(sep).map(function(c){
      const l = c.charAt(0) === ':';
      const r = c.charAt(c.length - 1) === ':';
      if(l && r) return 'c';
      if(r) return 'r';
      if(l) return 'l';
      return '';
    });
  }

  function tableHtml(head, aligns, rows){
    const cols = Math.max(head.length, aligns.length);
    function cell(tag, k, text){
      const al = aligns[k] ? ' class="ta-' + aligns[k] + '"' : '';
      return '<' + tag + al + '>' + inline(text || '') + '</' + tag + '>';
    }
    let h = '<div class="md-table"><table><thead><tr>';
    for(let k = 0; k < cols; k++) h += cell('th', k, head[k]);
    h += '</tr></thead><tbody>';
    rows.forEach(function(r){
      h += '<tr>';
      for(let k = 0; k < cols; k++) h += cell('td', k, r[k]);
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  // 列表项：缩进 + 是否有序 + 序号 + 文本
  function listItem(line){
    const m = line.match(/^(\s*)(?:([-*+])|(\d+)[.)])\s+(.*)$/);
    if(!m) return null;
    return {
      indent: m[1].replace(/\t/g, '    ').length,
      ordered: !!m[3],
      num: m[3] ? parseInt(m[3], 10) : 0,
      text: m[4]
    };
  }

  /* 多级列表：靠缩进递归。更深的项塞进上一个 <li> 里，
     这样项目符号层级才不会全挤成一层 */
  function listHtml(items){
    let idx = 0;
    function walk(indent){
      let html = '', tag = null, start = 1;
      while(idx < items.length){
        const it = items[idx];
        if(it.indent < indent) break;
        if(it.indent > indent){
          const sub = walk(it.indent);
          if(sub) html = html.replace(/<\/li>$/, sub + '</li>');
          continue;
        }
        const t = it.ordered ? 'ol' : 'ul';
        if(tag && t !== tag) break;
        if(!tag){ tag = t; start = it.ordered ? it.num : 1; }
        idx++;
        let body = it.text, task = null;
        const tm = body.match(/^\[([ xX])\]\s+(.*)$/);
        if(tm){ task = tm[1].toLowerCase() === 'x'; body = tm[2]; }
        html += '<li' + (task === null ? '' : ' class="task"') + '>' +
                (task === null ? '' :
                  '<input type="checkbox" disabled' + (task ? ' checked' : '') + ' /> ') +
                inline(body) + '</li>';
      }
      if(!tag) return html;
      return '<' + tag + (tag === 'ol' && start > 1 ? ' start="' + start + '"' : '') + '>' +
             html + '</' + tag + '>';
    }
    // 顶层可能有多个并列列表（无序接有序），逐个消费完
    let html = '';
    while(idx < items.length){
      const before = idx;
      html += walk(items[before].indent);
      if(idx === before) idx++;
    }
    return html;
  }

  function parseBlocks(lines){
    const out = [];
    let i = 0, para = [];

    function flushPara(){
      if(!para.length) return;
      // 段落里的换行拼成一行，硬换行处留 \u0002 占位
      out.push('<p>' + inline(joinPara(para)).replace(/\u0002/g, '<br />') + '</p>');
      para = [];
    }

    while(i < lines.length){
      const line = lines[i];

      // 围栏代码块（``` 或 ~~~）
      const fence = line.match(/^\s*(```|~~~)/);
      if(fence){
        flushPara();
        const mark = fence[1];
        const buf = [];
        i++;
        while(i < lines.length && lines[i].indexOf(mark) !== 0 && !/^\s*(```|~~~)\s*$/.test(lines[i])){
          buf.push(lines[i]); i++;
        }
        i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      // 表格：当前行含 |，下一行是分隔行
      if(line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])){
        flushPara();
        const head = splitRow(line);
        const aligns = alignOf(lines[i + 1]);
        i += 2;
        const rows = [];
        while(i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1){
          rows.push(splitRow(lines[i])); i++;
        }
        out.push(tableHtml(head, aligns, rows));
        continue;
      }

      // ATX 标题
      let m = line.match(/^(#{1,6})\s+(.*)$/);
      if(m){
        flushPara();
        const lv = m[1].length;
        out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>');
        i++; continue;
      }

      // 分割线
      if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)){
        flushPara(); out.push('<hr />'); i++; continue;
      }

      // setext 标题：下一行全是 = 或 -
      if(line.trim() && i + 1 < lines.length && /^\s*(=+|-+)\s*$/.test(lines[i + 1])){
        flushPara();
        const lv = lines[i + 1].indexOf('=') !== -1 ? 1 : 2;
        out.push('<h' + lv + '>' + inline(line.trim()) + '</h' + lv + '>');
        i += 2; continue;
      }

      // 引用：内部递归解析，所以引用里也能放列表和表格
      if(/^\s*>/.test(line)){
        flushPara();
        const buf = [];
        while(i < lines.length && /^\s*>/.test(lines[i])){
          buf.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push('<blockquote>' + parseBlocks(buf).join('\n') + '</blockquote>');
        continue;
      }

      // 列表（连续收集，再按缩进递归）
      if(listItem(line)){
        flushPara();
        const items = [];
        while(i < lines.length){
          const it = listItem(lines[i]);
          if(it){
            // 同级但有序/无序不同 = 另一个列表，让外层重新开始，别把后半个吞掉
            if(items.length && it.indent === items[0].indent && it.ordered !== items[0].ordered) break;
            items.push(it); i++; continue;
          }
          // 列表项之间允许一个空行，后面还是列表就继续
          if(!lines[i].trim() && i + 1 < lines.length && listItem(lines[i + 1])){ i++; continue; }
          break;
        }
        out.push(listHtml(items));
        continue;
      }

      // 空行
      if(!line.trim()){ flushPara(); i++; continue; }

      // 普通段落行：保留行尾空格（硬换行要用）
      para.push(line.replace(/^\s+/, ''));
      i++;
    }
    flushPara();
    return out;
  }

  return parseBlocks(src.replace(/\r\n?/g, '\n').split('\n')).join('\n');
}

/* ============================================================
   4. 编辑器
   ============================================================ */
let saveTimer = null;

function setSaved(text){ $('#edSaved').textContent = text; }
function updateCount(){
  const len = $('#edBody').value.replace(/\s/g, '').length;
  $('#edCount').textContent = len + ' 字';
}

/* 皮肤只靠 data-skin 覆盖 CSS 变量，所以这里改属性就够了，
   编辑器里的标题、正文、顶栏、标签全都会跟着换色 */
function applyEditorSkin(n){
  const ed = $('#editor');
  if(n && n.skin) ed.setAttribute('data-skin', n.skin);
  else ed.removeAttribute('data-skin');
}

function openEditor(id){
  const n = db.notes.find(x => x.id === id);
  if(!n) return;
  ui.editingId = id;
  ui.preview = false;
  // 记住打开时的样子：关闭时补进历史，短时间的编辑也不会漏
  ui.edOpenSnap = { title: n.title || '', content: n.content || '' };
  applyEditorSkin(n);
  $('#editor').classList.remove('preview');
  resetFind();
  $('#edTitle').value = n.title || '';
  $('#edBody').value = n.content || '';
  $('#edPath').textContent = folderPathText(n.folderId);
  setSaved('');
  updateCount();
  renderTags();
  undoReset();
  $('#editor').classList.add('open');
  setTimeout(function(){ if(!n.title) $('#edTitle').focus(); }, 260);
}

function renderTags(){
  const n = db.notes.find(x => x.id === ui.editingId);
  const tags = n ? n.tags : [];
  $('#edTags').innerHTML =
    tags.map(t =>
      '<span class="ed-tag">#' + esc(t) +
      '<button data-del-tag="' + esc(t) + '" aria-label="删除标签">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button></span>'
    ).join('') +
    '<button class="tag-add" id="edAddTag">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>标签</button>';
}

function commitEdits(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  const t = $('#edTitle').value.trim();
  const c = $('#edBody').value;
  if(n.title === t && n.content === c) return;
  recordHistory(n, n.title, n.content);   // 改之前先把旧值记进历史
  n.title = t;
  n.content = c;
  n.updatedAt = Date.now();
  save();
  setSaved('已保存');
}

/* ---------- 撤回 / 重做 ----------
   栈里存整份 {title, content}。按时间节流记快照，而不是每次按键都记：
   否则打 200 个字就 200 层，撤回一次只退一个字符，等于没用。 */
const UNDO_MAX = 300;
let undoStack = [], redoStack = [], undoApplying = false, undoLastPush = 0;

function editorState(){
  return { title: $('#edTitle').value, content: $('#edBody').value };
}

function updateUndoBtns(){
  $('#edUndo').disabled = undoStack.length < 2;
  $('#edRedo').disabled = !redoStack.length;
}

function undoReset(){
  undoStack = [editorState()];
  redoStack = [];
  undoLastPush = 0;
  updateUndoBtns();
}

function undoSnapshot(){
  const s = editorState();
  const top = undoStack[undoStack.length - 1];
  if(top && top.title === s.title && top.content === s.content) return;
  undoStack.push(s);
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack = [];          // 有新输入，原来的重做链就断了
  updateUndoBtns();
}

// 输入时调用：700ms 内的连续按键合并成一版
function maybeUndoSnapshot(){
  if(undoApplying) return;
  const now = Date.now();
  if(now - undoLastPush < 700) return;
  undoLastPush = now;
  undoSnapshot();
}

function applyEditorState(s){
  undoApplying = true;
  $('#edTitle').value = s.title;
  $('#edBody').value = s.content;
  updateCount();
  if(ui.preview) renderPreview();
  undoApplying = false;
  updateUndoBtns();
}

function doUndo(){
  if(undoApplying) return;
  const cur = editorState();
  const top = undoStack[undoStack.length - 1];
  // 当前状态可能还没进栈（刚敲完就按撤回），先补进去，
  // 这样撤回回到的是「上一版」，而不是原地不动
  if(!top || top.title !== cur.title || top.content !== cur.content) undoStack.push(cur);
  if(undoStack.length < 2){ toast('没有可撤回的修改'); return; }
  redoStack.push(undoStack.pop());
  applyEditorState(undoStack[undoStack.length - 1]);
  undoLastPush = 0;
  commitEdits();
  toast('已撤回');
}

function doRedo(){
  if(undoApplying || !redoStack.length){ toast('没有可重做的修改'); return; }
  const s = redoStack.pop();
  undoStack.push(s);
  applyEditorState(s);
  undoLastPush = 0;
  commitEdits();
  toast('已重做');
}

/* ---------- 历史版本 ----------
   只留「过去的版本」，当前内容不进 history。
   60 秒内的连续提交合并成一条，否则一次编辑会攒出几十个碎片。
   关闭便签时再强制补一条本次打开时的样子，短编辑也不会漏。 */
const HIST_MAX = 30;
const HIST_GAP = 60 * 1000;
const HIST_BUDGET = 120000;   // 单条便签历史字符总量上限，防止把 localStorage 撑爆

function trimHistory(hist){
  while(hist.length > HIST_MAX) hist.shift();
  let total = 0;
  hist.forEach(function(h){ total += (h.title || '').length + (h.content || '').length; });
  while(hist.length > 1 && total > HIST_BUDGET){
    const g = hist.shift();
    total -= (g.title || '').length + (g.content || '').length;
  }
}

function recordHistory(n, oldTitle, oldContent, force){
  if(!n) return;
  if(!oldTitle && !oldContent) return;
  if(!n.history) n.history = [];
  const hist = n.history;
  const last = hist[hist.length - 1];
  if(last && last.title === oldTitle && last.content === oldContent) return;
  if(!force && last && Date.now() - last.at < HIST_GAP) return;
  hist.push({ at: Date.now(), title: oldTitle, content: oldContent });
  trimHistory(hist);
}

function fmtHistTime(ts){
  const d = new Date(ts), now = new Date();
  const pad = function(x){ return x < 10 ? '0' + x : '' + x; };
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if(d.toDateString() === now.toDateString()) return '今天 ' + hm;
  const yd = new Date(now.getTime() - 86400000);
  if(d.toDateString() === yd.toDateString()) return '昨天 ' + hm;
  if(d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + hm;
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}

function histSnippet(v){
  let c = String(v.content || '')
    .replace(/^#{1,6}\s+/, '')      // 开头的 # 标题标记
    .replace(/\s+/g, ' ')
    .trim();
  // 正文第一行常常就是标题本身，摘要里没必要再重复一遍
  if(v.title && c.indexOf(v.title) === 0){
    c = c.slice(v.title.length).replace(/^[\s·:：,，.。\-—]+/, '');
  }
  const t = c || v.title || '';
  if(!t) return '（空）';
  return t.length > 44 ? t.slice(0, 44) + '…' : t;
}

function charCount(s){ return String(s || '').replace(/\s/g, '').length; }

function openHistory(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  commitEdits();
  const hist = (n.history || []).slice().reverse();   // 新的在上面

  let h = '<h4>历史版本</h4>';
  if(!hist.length){
    h += '<div class="pd-msg">还没有历史版本。<br><br>' +
         '编辑停下来一会儿、或关掉这条便签时，会记一个版本，最多保留 30 个。</div>' +
         '<div class="pd-actions"><button class="pd-btn primary" id="hsOk">知道了</button></div>';
    openSheet(h);
    $('#hsOk').onclick = function(){ closeSheet(); };
    return;
  }

  h += '<div class="hist-now"><span>当前版本</span><span>' + charCount(n.content) + ' 字</span></div>';
  h += '<div class="hist-list">';
  hist.forEach(function(v, i){
    h += '<button class="hist-item" data-hi="' + i + '">' +
           icon('clock', 17, 1.9) +
           '<span class="hist-main">' +
             '<span class="hist-time">' + esc(fmtHistTime(v.at)) + '</span>' +
             '<span class="hist-snip">' + esc(histSnippet(v)) + '</span>' +
           '</span>' +
           '<span class="hist-len">' + charCount(v.content) + ' 字</span>' +
         '</button>';
  });
  h += '</div>';
  openSheet(h);

  $('#sheetRoot').querySelectorAll('[data-hi]').forEach(function(b){
    b.onclick = function(){ restoreHistory(n, hist[+b.dataset.hi]); };
  });
}

function restoreHistory(n, v){
  confirmDialog('恢复到 ' + fmtHistTime(v.at) + ' 的版本？当前内容会先存进历史，之后还能切回来。').then(function(ok){
    if(!ok) return;
    recordHistory(n, n.title, n.content, true);
    n.title = v.title || '';
    n.content = v.content || '';
    n.updatedAt = Date.now();
    save();
    if(ui.editingId === n.id){
      applyEditorState({ title: n.title, content: n.content });
      undoReset();
      renderTags();
      setSaved('已恢复');
    }
    render();
    toast('已恢复');
  });
}

function scheduleSave(){
  clearTimeout(saveTimer);
  if($('#edSaved').textContent !== '未保存…') setSaved('未保存…');
  saveTimer = setTimeout(commitEdits, 500);
}

function closeEditor(){
  const n = db.notes.find(x => x.id === ui.editingId);
  commitEdits();
  if(n && ui.edOpenSnap){
    // 只有真的改过才补记；点开看一眼就关掉不该攒历史
    if(ui.edOpenSnap.title !== n.title || ui.edOpenSnap.content !== n.content){
      recordHistory(n, ui.edOpenSnap.title, ui.edOpenSnap.content, true);
    }
    ui.edOpenSnap = null;
  }
  if(n && !n.title && !(n.content || '').trim()){
    db.notes = db.notes.filter(x => x.id !== n.id);
    save();
  }
  ui.editingId = null;
  ui.preview = false;
  resetFind();
  $('#editor').classList.remove('open', 'preview');
  render();
}

function newNote(){
  const now = Date.now();
  const minOrder = db.notes.length ? Math.min.apply(null, db.notes.map(n => n.order)) : 0;
  const n = { id:uid(), folderId:ui.folderId, title:'', content:'', tags:[],
              pinned:false, order:minOrder - 1, createdAt:now, updatedAt:now };
  db.notes.push(n);
  save();
  openEditor(n.id);
}

/* ---------- 标签操作 ---------- */
async function addTags(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  const raw = await promptDialog('添加标签', '多个标签用逗号分隔', '');
  if(!raw) return;
  const items = raw.split(/[,，;；\s]+/).map(s => s.replace(/^#/, '').trim()).filter(Boolean);
  items.forEach(t => { if(n.tags.indexOf(t) === -1) n.tags.push(t); });
  n.updatedAt = Date.now();
  save();
  renderTags();
  setSaved('已保存');
  toast('已添加 ' + items.length + ' 个标签');
}

/* ---------- 便签内查找 ---------- */
/* textarea 没法做局部高亮，所以查找时换成一层只读的高亮视图，
   字体/行高/内边距和 textarea 完全对齐，切换时看不出跳动 */
const find = { on:false, q:'', idx:0, total:0, hits:[] };

function resetFind(){
  find.on = false; find.q = ''; find.hits = []; find.total = 0; find.idx = 0;
  $('#editor').classList.remove('finding');
  $('#edFindBtn').classList.remove('on');
  $('#edFindView').innerHTML = '';
  $('#edFindInput').value = '';
  $('#edFindCount').textContent = '';
}

function openFind(q){
  find.on = true;
  ui.preview = false;
  $('#editor').classList.remove('preview');
  $('#edPreviewBtn').classList.remove('on');
  $('#editor').classList.add('finding');
  $('#edFindBtn').classList.add('on');
  $('#edFindInput').value = q == null ? '' : q;
  renderFind(true);
  setTimeout(function(){ $('#edFindInput').focus(); $('#edFindInput').select(); }, 40);
}

function closeFind(){
  const hits = find.hits.slice(), q = find.q, idx = find.idx;
  resetFind();
  // 退出后把光标停在刚才那个命中上，方便接着改
  if(hits.length && q){
    const ta = $('#edBody');
    const pos = hits[Math.min(idx, hits.length - 1)];
    ta.focus();
    try{ ta.setSelectionRange(pos, pos + q.length); }catch(e){}
  }
}

function renderFind(reset){
  const q = $('#edFindInput').value;
  const text = $('#edBody').value;
  const box = $('#edFindView');
  find.q = q;

  if(!q){
    find.hits = []; find.total = 0; find.idx = 0;
    box.innerHTML = '<span class="ph">输入关键词，在本便签里查找</span>';
    updateFindCount();
    return;
  }
  if(!text){
    find.hits = []; find.total = 0; find.idx = 0;
    box.innerHTML = '<span class="ph">这条便签还没有正文</span>';
    updateFindCount();
    return;
  }

  const lower = text.toLowerCase(), lq = q.toLowerCase();
  find.hits = [];
  let i = 0;
  while(find.hits.length < 400){        // 上限只是防止极端长文卡住
    const k = lower.indexOf(lq, i);
    if(k < 0) break;
    find.hits.push(k);
    i = k + lq.length;
  }
  find.total = find.hits.length;
  if(reset || find.idx >= find.total) find.idx = 0;

  let html = '', pos = 0;
  find.hits.forEach(function(k, n){
    html += esc(text.slice(pos, k)) +
      '<mark data-fi="' + n + '"' + (n === find.idx ? ' class="cur"' : '') + '>' +
      esc(text.slice(k, k + q.length)) + '</mark>';
    pos = k + q.length;
  });
  html += esc(text.slice(pos));
  box.innerHTML = html;
  updateFindCount();
  scrollFindTo();
}

function updateFindCount(){
  $('#edFindCount').textContent = !find.q ? '' : (find.total ? (find.idx + 1) + '/' + find.total : '无');
  $('#edFindPrev').disabled = !find.total;
  $('#edFindNext').disabled = !find.total;
}

function scrollFindTo(){
  const box = $('#edFindView');
  const cur = box.querySelector('mark.cur');
  if(!cur) return;
  box.scrollTop = Math.max(0, cur.offsetTop - box.offsetTop - box.clientHeight / 2 + cur.offsetHeight / 2);
}

function markFindCur(){
  $('#edFindView').querySelectorAll('mark[data-fi]').forEach(function(m){
    m.classList.toggle('cur', Number(m.dataset.fi) === find.idx);
  });
}

function gotoFind(delta){
  if(!find.total) return;
  find.idx = (find.idx + delta + find.total) % find.total;
  markFindCur();
  updateFindCount();
  scrollFindTo();
}

/* ============================================================
   5. 菜单 / 对话框 / 提示
   ============================================================ */
let sheetOnClose = null;

function openSheet(html){
  const root = $('#sheetRoot');
  root.innerHTML = '<div class="mask"></div><div class="sheet">' + html + '</div>';
  root.classList.add('open');
  root.querySelector('.mask').onclick = function(){ closeSheet(); };
}
function closeSheet(){
  $('#sheetRoot').classList.remove('open');
  if(sheetOnClose){ const f = sheetOnClose; sheetOnClose = null; f(); }
}

function menuItems(title, items){
  let h = '<h4>' + esc(title) + '</h4>';
  items.forEach(function(it, i){
    h += '<button class="sheet-item ' + (it.danger ? 'danger' : '') + '" data-mi="' + i + '">' +
         icon(it.icon || 'info', 20) + '<span>' + esc(it.label) + '</span></button>';
  });
  h += '<button class="sheet-item" data-cancel style="justify-content:center;color:var(--t2);margin-top:2px">取消</button>';
  openSheet(h);
  const root = $('#sheetRoot');
  root.querySelectorAll('[data-mi]').forEach(function(b){
    b.onclick = function(){ const fn = items[+b.dataset.mi].onClick; closeSheet(); fn(); };
  });
  root.querySelector('[data-cancel]').onclick = function(){ closeSheet(); };
}

function promptDialog(title, placeholder, value){
  return new Promise(function(resolve){
    openSheet(

function confirmDialog(msg){
  return new Promise(function(resolve){
    openSheet(
      '<h4>请确认</h4>' +
      '<div class="pd-msg">' + esc(msg) + '</div>' +
      '<div class="pd-actions"><button class="pd-btn" id="cfNo">取消</button><button class="pd-btn primary" id="cfYes">确定</button></div>'
    );

    sheetOnClose = function(){ resolve(false); };

    $('#cfYes').onclick = function(){ done(true); };
  });

/* ============================================================
   7. 长按拖拽排序
   ============================================================ */
const drag = {
  active:false, el:null, id:null, listEl:null,
  startX:0, startY:0, h:0, from:0, to:0,
  others:[], rects:[], timer:null, moved:false
};

function dragStart(e){
  const card = e.target.closest('[data-drag-note]');
  if(!card || !card.closest('#noteList')) return false;
  if(e.target.closest('.more')) return false;
  if(e.pointerType === 'mouse' && e.button !== 0) return false;

  drag.active = false;
  drag.id = card.dataset.dragNote;
  drag.el = card;
  drag.startX = e.clientX;
  drag.startY = e.clientY;
  drag.moved = false;
  drag.listEl = card.closest('#noteList');

  clearTimeout(drag.timer);
  drag.timer = setTimeout(function(){ beginDrag(); }, 380);
  return true;
}

function beginDrag(){
  const el = drag.el;
  if(!el) return;
  const rect = el.getBoundingClientRect();
  drag.active = true;
  drag.h = rect.height + 8;   // 8 = gap
  drag.from = Array.prototype.indexOf.call(drag.listEl.children, el);
  drag.to = drag.from;
  drag.others = Array.prototype.filter.call(drag.listEl.children, c => c !== el);
  drag.rects = drag.others.map(c => c.getBoundingClientRect());

  el.classList.add('dragging');
  el.style.width = rect.width + 'px';
  el.style.left = rect.width ? '' : ''; // 占位：靠 transform 移动，不改文档流

  if(navigator.vibrate) navigator.vibrate(12);
  ui.suppressClick = true;
}

function dragMove(e){
  if(!drag.active || !drag.el) return;
  const dy = e.clientY - drag.startY;
  drag.el.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
  drag.moved = true;

  // 判断插入位置
  const y = e.clientY;
  let k = drag.others.length;
  for(let i = 0; i < drag.rects.length; i++){
    const r = drag.rects[i];
    if(y < r.top + r.height / 2){ k = i; break; }
  }
  drag.to = k;

  // 让位动画：others 内部索引 i 对应原位置 i<from? i : i+1
  const fromVirtual = drag.from;
  drag.others.forEach(function(node, i){
    let shift = 0;
    if(k > fromVirtual && i >= fromVirtual && i < k) shift = -drag.h;
    else if(k < fromVirtual && i >= k && i < fromVirtual) shift = drag.h;
    node.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
  });
}

function dragEnd(){
  clearTimeout(drag.timer);
  if(!drag.active){ drag.el = null; return; }
  const el = drag.el, listEl = drag.listEl, k = drag.to;
  const others = drag.others.slice();

  // 复位视觉
  el.classList.remove('dragging');
  el.style.transform = '';
  el.style.width = '';
  others.forEach(function(n){ n.style.transform = ''; });

  // 真正重排 DOM
  const finalOrder = others.slice(0, k).concat([el], others.slice(k));
  finalOrder.forEach(function(n){ listEl.appendChild(n); });

  // 写回 order
  const ids = Array.prototype.map.call(listEl.children, c => c.dataset.dragNote);
  ids.forEach(function(id, i){
    const n = db.notes.find(x => x.id === id);
    if(n) n.order = i;
  });
  save();

  drag.active = false;
  drag.el = null;

  render();
  toast('顺序已保存');
}

function dragCancel(){
  clearTimeout(drag.timer);
  if(drag.active && drag.el){
    drag.el.classList.remove('dragging');
    drag.el.style.transform = '';
    drag.el.style.width = '';
    (drag.others || []).forEach(function(n){ n.style.transform = ''; });
  }
  drag.active = false;
  drag.el = null;
}

/* 交给系统落地一个 Blob：优先系统分享面板，其次下载 */
async function saveBlob(filename, blob){
  const file = new File([blob], filename, { type:blob.type || 'application/octet-stream' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file], title:filename });
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast('已导出：' + filename);
}

async function saveFile(filename, text, mime){
  // 安卓壳：交给原生写入「下载」目录
  if(window.AndroidBridge && window.AndroidBridge.saveFile){
    try{
      const ok = window.AndroidBridge.saveFile(filename, text, mime || 'text/plain');
      toast(ok ? '已保存到「下载」：' + filename : '保存失败');
      return;
    }catch(e){ /* 落回 web 逻辑 */ }
  }
  await saveBlob(filename, new Blob([text], { type:mime }));
}

/* ---------- Markdown ---------- */
const hash = n => '#'.repeat(Math.min(n, 6));

function buildMarkdown(fid){
  const out = [];
  const scope = fid ? getFolder(fid) : null;
  out.push('# 便签导出' + (scope ? ' · ' + scope.name : ''));
  out.push('');
  out.push('> 导出时间：' + fmtFull(Date.now()));
  out.push('> 文件夹 ' + db.folders.length + ' 个，便签 ' + countNotesDeep(fid) + ' 条');
  out.push('');
  if(scope){ out.push('分类路径：' + folderPathText(fid)); out.push(''); }

  if(fid){
    mdFolder(fid, 2, out);
  }else{
    if(notesIn(null).length){
      out.push('## 未分类');
      out.push('');
      mdNotes(null, 3, out);
    }
    subFolders(null).forEach(function(f){ mdFolder(f.id, 2, out); });
  }
  return out.join('\n');
}
function mdFolder(fid, level, out){
  out.push(hash(level) + ' ' + getFolder(fid).name);
  out.push('');
  if(!notesIn(fid).length && !subFolders(fid).length){
    out.push('*（空文件夹）*');
    out.push('');
    return;
  }
  mdNotes(fid, level + 1, out);
  subFolders(fid).forEach(function(f){ mdFolder(f.id, level + 1, out); });
}
function mdNotes(fid, level, out){
  notesIn(fid).forEach(function(n){
    out.push(hash(level) + ' ' + (n.title || '无标题'));
    out.push('');
    if(n.tags.length) out.push('`' + n.tags.map(t => '#' + t).join(' ') + '`');
    out.push('*更新于 ' + fmtFull(n.updatedAt) + (n.pinned ? ' · 置顶' : '') + '*');
    out.push('');
    if(n.content){ out.push(n.content); out.push(''); }
  });
}

/* ---------- 纯文本 ---------- */
/* 把 Markdown 转成适合纯文本阅读的排版（去掉符号，保留结构） */
function stripInline(s){
  return s
    .replace(/`([^`]*)`/g, '$1')
    .replace(/(\*\*|__)(.*?)\1/g, '$2')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2')
    .replace(/~~(.*?)~~/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
}
function mdToPlain(md){
  const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let inCode = false;
  lines.forEach(function(line){
    if(/^\s*```/.test(line)){ inCode = !inCode; out.push('    ┈┈┈'); return; }
    if(inCode){ out.push('    ' + line); return; }

    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const t = stripInline(m[2]);
      out.push(t);
      out.push('─'.repeat(Math.min(t.length * 2 + 4, 40)));
      return;
    }
    m = line.match(/^\s*[-*+]\s+(.*)$/);
    if(m){ out.push('• ' + stripInline(m[1])); return; }
    m = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if(m){ out.push(m[1] + '. ' + stripInline(m[2])); return; }
    m = line.match(/^\s*>\s?(.*)$/);
    if(m){ out.push('│ ' + stripInline(m[1])); return; }
    if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)){ out.push('─'.repeat(30)); return; }
    out.push(stripInline(line));
  });
  // 压缩连续空行
  return out.join('\n').replace(/\n{3,}/g, '\n\n');
}

function buildText(fid){
  const L = [];
  const scope = fid ? getFolder(fid) : null;
  L.push('便签导出' + (scope ? ' · ' + scope.name : ''));
  L.push('导出时间：' + fmtFull(Date.now()));
  L.push('文件夹 ' + db.folders.length + ' 个，便签 ' + countNotesDeep(fid) + ' 条');
  L.push('='.repeat(48));
  L.push('');

  if(fid){
    textFolder(fid, 0, L);
  }else{
    if(notesIn(null).length){
      L.push('【未分类】');
      L.push('');
      textNotes(null, 1, L);
    }
    subFolders(null).forEach(function(f){ textFolder(f.id, 0, L); });
  }
  return L.join('\n');
}
function textFolder(fid, depth, L){
  const pad = '  '.repeat(depth);
  L.push(pad + '【' + folderPathText(fid) + '】');
  L.push('');
  if(!notesIn(fid).length && !subFolders(fid).length){
    L.push(pad + '  （空文件夹）');
    L.push('');
  }else{
    textNotes(fid, depth + 1, L);
  }
  subFolders(fid).forEach(function(f){ textFolder(f.id, depth + 1, L); });
}
function textNotes(fid, depth, L){
  const pad = '  '.repeat(depth);
  notesIn(fid).forEach(function(n){
    L.push(pad + (n.pinned ? '★ ' : '· ') + (n.title || '无标题'));
    if(n.tags.length) L.push(pad + '  标签：' + n.tags.map(t => '#' + t).join(' '));
    L.push(pad + '  更新：' + fmtFull(n.updatedAt));
    L.push('');
    if(n.content){
      mdToPlain(n.content).split('\n').forEach(function(line){ L.push(pad + '  ' + line); });
      L.push('');
    }
    L.push('');
  });
}
