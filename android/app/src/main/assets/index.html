  }),
  css: hlDef({
    block: [['/*', '*/']], quotes: '\'"', multiline: ['"'],
    kw: 'important media supports keyframes import font-face root not and or',
    prop: true
  }),
  html: hlDef({
    block: [['<!--', '-->']], quotes: '\'"', multiline: ['"', "'"],
    tag: true, prop: true
  }),
  yaml: hlDef({
    line: ['#'], quotes: '\'"', multiline: ['"', "'"],
    lit: 'true false null yes no on off',
    prop: true
  }),
  md: hlDef({
    quotes: '`', multiline: ['`'],
    lit: 'true false'
  })
};

/* 语言别名：写 ```js 和 ```javascript 都得认，写错的就退化成纯文本 */
const HL_ALIAS = {
  js:'js', javascript:'js', mjs:'js', cjs:'js', jsx:'js', ts:'js', typescript:'js', tsx:'js', node:'js',
  java:'java', kt:'java', kotlin:'java', scala:'java', groovy:'java',
  c:'c', h:'c', cpp:'c', 'c++':'c', cc:'c', hpp:'c', cs:'c', csharp:'c', objc:'c',
  go:'c', golang:'c', rust:'c', rs:'c', swift:'c', php:'c', dart:'c',
  py:'py', python:'py', py3:'py', python3:'py', rb:'py', ruby:'py',
  json:'json', jsonc:'json', json5:'json',
  sh:'sh', bash:'sh', shell:'sh', zsh:'sh', console:'sh', terminal:'sh',
  sql:'sql', mysql:'sql', pgsql:'sql', sqlite:'sql',
  css:'css', scss:'css', less:'css', stylus:'css',
  html:'html', htm:'html', xml:'html', svg:'html', vue:'html', xhtml:'html',
  yml:'yaml', yaml:'yaml', toml:'yaml', ini:'yaml', conf:'yaml',
  md:'md', markdown:'md'
};

const HL_IDENT = /[A-Za-z_$\u00c0-\uffff][\w$\u00c0-\uffff]*/y;
const HL_NUM = /(?:0[xXbBoO][0-9a-fA-F_]+|[0-9][0-9_]*(?:\.[0-9_]+)?(?:[eE][+-]?[0-9]+)?n?)/y;

function hlSpan(cls, text){
  if(!text) return '';
  return '<span class="hl-' + cls + '">' + esc(text) + '</span>';
}

function highlightCode(src, lang){
  src = String(src == null ? '' : src);
  const c = HL_CONF[HL_ALIAS[String(lang || '').toLowerCase()] || ''];
  if(!c || !src) return esc(src);

  const n = src.length;
  let out = '', i = 0;
  const chAt = function(k){ return (k >= 0 && k < n) ? src.charAt(k) : ''; };

  while(i < n){
    const ch = chAt(i);

    // 块注释优先：/* */ 和 <!-- --> 必须先吃掉，否则里面的引号会被当字符串
    if(c.block.length){
      let hit = null;
      for(let k = 0; k < c.block.length; k++){
        const pr = c.block[k];
        if(src.substr(i, pr[0].length) === pr[0]){ hit = pr; break; }
      }
      if(hit){
        const close = src.indexOf(hit[1], i + hit[0].length);
        const end = close < 0 ? n : close + hit[1].length;
        out += hlSpan('c', src.slice(i, end)); i = end; continue;
      }
    }

    // 行注释
    if(c.line.length){
      let hit = '';
      for(let k = 0; k < c.line.length; k++){
        if(src.substr(i, c.line[k].length) === c.line[k]){ hit = c.line[k]; break; }
      }
      if(hit){
        let end = src.indexOf('\n', i);
        if(end < 0) end = n;
        out += hlSpan('c', src.slice(i, end)); i = end; continue;
      }
    }

    // 字符串 / 模板字符串 / 三引号
    if(c.quotes.indexOf(ch) > -1){
      let q = ch;
      if(c.triple.length){
        const t3 = src.substr(i, 3);
        if(c.triple.indexOf(t3) > -1) q = t3;
      }
      let j = i + q.length;
      while(j < n){
        if(src.charAt(j) === '\\'){ j += 2; continue; }
        if(src.substr(j, q.length) === q){ j += q.length; break; }
        // 单引号 / 双引号字符串不跨行；模板字符串和三引号才行
        if(q.length === 1 && src.charAt(j) === '\n' && c.multiline.indexOf(q) === -1) break;
        j++;
      }
      // 后面紧跟冒号的字符串是键名（JSON / YAML），跟字符串值分开着色
      let scls = 's';
      if(c.prop && q.length === 1){
        let k2 = j;
        while(k2 < n && (src.charAt(k2) === ' ' || src.charAt(k2) === '\t')) k2++;
        if(src.charAt(k2) === ':') scls = 'p';
      }
      out += hlSpan(scls, src.slice(i, j)); i = j; continue;
    }

    // 数字：前面紧跟字母的不算（x2 里的 2 属于标识符）
    if(ch >= '0' && ch <= '9' && !/[A-Za-z_$]/.test(chAt(i - 1))){
      HL_NUM.lastIndex = i;
      const m = HL_NUM.exec(src);
      if(m && m.index === i){
        out += hlSpan('n', m[0]); i += m[0].length; continue;
      }
    }

    // 标识符 → 关键字 / 类型 / 字面量 / 函数 / 属性
    if(/[A-Za-z_$\u00c0-\uffff]/.test(ch)){
      HL_IDENT.lastIndex = i;
      const m = HL_IDENT.exec(src);
      if(m && m.index === i){
        const w = m[0];
        const key = c.ci ? w.toLowerCase() : w;
        let cls = '';
        if(c.kw[key]) cls = 'k';
        else if(c.types[key]) cls = 't';
        else if(c.lit[key]) cls = 'l';
        else{
          let k = i + w.length;
          while(k < n && (src.charAt(k) === ' ' || src.charAt(k) === '\t')) k++;
          const nx = src.charAt(k);
          if(nx === '(') cls = 'f';                                  // 函数调用
          else if(c.tag && /[<\/]/.test(chAt(i - 1))) cls = 't';      // HTML 标签名
          else if(c.prop && (nx === ':' || nx === '=')) cls = 'p';    // 属性 / 键名
        }
        out += cls ? hlSpan(cls, w) : esc(w);
        i += w.length; continue;
      }
    }

    out += esc(ch); i++;
  }
  return out;
}

function mdToHtml(src, map){
  if(!src || !src.trim()) return '<p class="md-empty">还没有内容</p>';

  /* map 为真时给每个顶层块打上「源码行范围」data-bs / data-be，
     预览态点一下就知道该改哪几行。导出 HTML 和单元测试不带这两个属性 */
  function stamp(html, s, e){
    if(!map) return html;
    return html.replace(/^<([a-zA-Z0-9]+)/, '<$1 data-bs="' + s + '" data-be="' + e + '"');
  }

  /* 已生成的 HTML 片段先存起来换成占位符，
     否则后面的强调 / 链接规则会把标签本身再处理一遍 */
  const hold = [];
  function stash(html){ hold.push(html); return '\u0000' + (hold.length - 1) + '\u0000'; }

  function inline(text){
    let s = String(text);
    const escs = [];

    // 反斜杠转义先抽走，免得 \* 被当成强调
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!|~>=])/g, function(_, c){
      escs.push(c); return '\u0001' + (escs.length - 1) + '\u0001';
    });

    s = esc(s);

    // 行内代码
    s = s.replace(/`([^`]+)`/g, function(_, c){
      return stash('<code>' + c + '</code>');
    });
    // 图片必须排在链接前面，否则 ![alt](url) 会被链接规则抢先吃掉
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, function(_, alt, url){
      return stash('<img src="' + url + '" alt="' + alt + '" loading="lazy" />');
    });
    // 链接
    s = s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g, function(_, txt, url){
      return stash('<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>');
    });
    // <https://…> 自动链接（此时尖括号已被 esc 成 &lt; &gt;）
    s = s.replace(/&lt;((?:https?:\/\/|mailto:)[^\s&]+)&gt;/g, function(_, url){
      return stash('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
    });
    // 裸链接：要求前面是行首、空白或标点，避免命中已生成的 href="…"
    s = s.replace(/(^|[\s(（\[【「：:，,、])(https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+)/g,
      function(_, pre, url){
        return pre + stash('<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
      });

    // 强调
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(（])_([^_\n]+)_(?=$|[\s)）.。,，!！?？:：;；])/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

    // 下划线 / 高亮的短语法：工具栏插的就是这两个，手写也认
    s = s.replace(/\+\+([^+\n]+)\+\+/g, '<u>$1</u>');
    s = s.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');

    /* 受限内联 HTML。
       便签正文可能来自导入的 md，不能把任意 HTML 原样放出来 ——
       这里只认下面几个标签，且 style 只接受 color / background 的十六进制色值，
       其余尖括号到这一步仍然是转义状态 */
    s = s.replace(/&lt;mark\s+style=&quot;background:\s*(#[0-9a-fA-F]{3,8})&quot;\s*&gt;/gi,
      function(_, c){ return '<mark style="background:' + c + '">'; });
    /* span 单独处理：只有带 color 的开标签才放行，闭合标签按配平还原。
       否则原文里孤零零一个 </span> 也会被还原，虽然无害，但标签就不平衡了 */
    let spanOpen = 0;
    s = s.replace(/&lt;(\/?)span(?:\s+style=&quot;color:\s*(#[0-9a-fA-F]{3,8})&quot;)?\s*&gt;/gi,
      function(all, close, col){
        if(close){
          if(!spanOpen) return all;
          spanOpen--;
          return '</span>';
        }
        if(!col) return all;
        spanOpen++;
        return '<span style="color:' + col + '">';
      });
    s = s.replace(/&lt;(\/?)(u|mark|sup|sub)(\s*\/?)&gt;/gi, function(_, close, name){
      const n = String(name).toLowerCase();
      return close ? '</' + n + '>' : '<' + n + '>';
    });
    s = s.replace(/&lt;br\s*\/?&gt;/gi, '<br />');

    s = s.replace(/\u0000(\d+)\u0000/g, function(_, i){ return hold[+i]; });
    s = s.replace(/\u0001(\d+)\u0001/g, function(_, i){ return escs[+i]; });
    return s;
  }

  // 段落内换行：行尾两个空格或反斜杠 = 硬换行，先用 \u0002 占位
  function joinPara(arr){
    let s = '', hardPrev = false;
    for(let k = 0; k < arr.length; k++){
      const raw = arr[k];
      const hard = /( {2,}|\\)$/.test(raw);
      const clean = hard ? raw.replace(/( {2,}|\\)$/, '') : raw;
      if(k) s += hardPrev ? '\u0002' : ' ';
      s += clean;
      hardPrev = hard;
    }
    return s;
  }

  // 表格分隔行：|---|---| 或 |:--|--:|:-:|（也支持只有一列的 |---|）
  function isTableSep(line){
    if(line.indexOf('|') === -1) return false;
    return /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(line);
  }

  // 拆一行表格；行内代码里的 | 不算分隔
  function splitRow(line){
    let s = String(line).trim();
    if(s.charAt(0) === '|') s = s.slice(1);
    if(s.charAt(s.length - 1) === '|' && s.charAt(s.length - 2) !== '\\') s = s.slice(0, -1);
    const cells = [];
    let cur = '', inCode = false;
    for(let k = 0; k < s.length; k++){
      const ch = s.charAt(k);
      if(ch === '\\' && s.charAt(k + 1) === '|'){ cur += '|'; k++; continue; }
      if(ch === '`'){ inCode = !inCode; cur += ch; continue; }
      if(ch === '|' && !inCode){ cells.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  }

  function alignOf(sep){
    return splitRow(sep).map(function(c){
      const l = c.charAt(0) === ':';
      const r = c.charAt(c.length - 1) === ':';
      if(l && r) return 'c';
      if(r) return 'r';
      if(l) return 'l';
      return '';
    });
  }

  function tableHtml(head, aligns, rows){
    const cols = Math.max(head.length, aligns.length);
    function cell(tag, k, text){
      const al = aligns[k] ? ' class="ta-' + aligns[k] + '"' : '';
      return '<' + tag + al + '>' + inline(text || '') + '</' + tag + '>';
    }
    let h = '<div class="md-table"><table><thead><tr>';
    for(let k = 0; k < cols; k++) h += cell('th', k, head[k]);
    h += '</tr></thead><tbody>';
    rows.forEach(function(r){
      h += '<tr>';
      for(let k = 0; k < cols; k++) h += cell('td', k, r[k]);
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  // 列表项：缩进 + 是否有序 + 序号 + 文本
  function listItem(line){
    const m = line.match(/^(\s*)(?:([-*+])|(\d+)[.)])\s+(.*)$/);
    if(!m) return null;
    return {
      indent: m[1].replace(/\t/g, '    ').length,
      ordered: !!m[3],
      num: m[3] ? parseInt(m[3], 10) : 0,
      text: m[4]
    };
  }

  /* 多级列表：靠缩进递归。更深的项塞进上一个 <li> 里，
     这样项目符号层级才不会全挤成一层 */
  function listHtml(items){
    let idx = 0;
    function walk(indent){
      let html = '', tag = null, start = 1;
      while(idx < items.length){
        const it = items[idx];
        if(it.indent < indent) break;
        if(it.indent > indent){
          const sub = walk(it.indent);
          if(sub) html = html.replace(/<\/li>$/, sub + '</li>');
          continue;
        }
        const t = it.ordered ? 'ol' : 'ul';
        if(tag && t !== tag) break;
        if(!tag){ tag = t; start = it.ordered ? it.num : 1; }
        idx++;
        let body = it.text, task = null;
        const tm = body.match(/^\[([ xX])\]\s+(.*)$/);
        if(tm){ task = tm[1].toLowerCase() === 'x'; body = tm[2]; }
        html += '<li' + (task === null ? '' : ' class="task"') + '>' +
                (task === null ? '' :
                  '<input type="checkbox"' + (map ? '' : ' disabled') + (task ? ' checked' : '') + ' /> ') +
                inline(body) + '</li>';
      }
      if(!tag) return html;
      return '<' + tag + (tag === 'ol' && start > 1 ? ' start="' + start + '"' : '') + '>' +
             html + '</' + tag + '>';
    }
    // 顶层可能有多个并列列表（无序接有序），逐个消费完
    let html = '';
    while(idx < items.length){
      const before = idx;
      html += walk(items[before].indent);
      if(idx === before) idx++;
    }
    return html;
  }

  function parseBlocks(lines, top){
    const out = [];
    let i = 0, para = [], paraS = 0;

    function emit(html, s2, e){
      out.push(top ? stamp(html, s2, e) : html);
    }

    function flushPara(){
      if(!para.length) return;
      // 段落里的换行拼成一行，硬换行处留 \u0002 占位
      emit('<p>' + inline(joinPara(para)).replace(/\u0002/g, '<br />') + '</p>', paraS, i);
      para = [];
    }

    while(i < lines.length){
      const line = lines[i];
      const start = i;

      // 围栏代码块（``` 或 ~~~），后面跟的语言名决定怎么着色
      const fence = line.match(/^\s*(```|~~~)\s*([\w+#.\-]*)/);
      if(fence){
        flushPara();
        const mark = fence[1];
        const lang = (fence[2] || '').toLowerCase();
        const buf = [];
        i++;
        while(i < lines.length && lines[i].indexOf(mark) !== 0 && !/^\s*(```|~~~)\s*$/.test(lines[i])){
          buf.push(lines[i]); i++;
        }
        i++;
        emit('<pre><code' + (lang ? ' class="lang-' + esc(lang) + '"' : '') + '>' +
             highlightCode(buf.join('\n'), lang) + '</code></pre>', start, i);
        continue;
      }

      // 表格：当前行含 |，下一行是分隔行
      if(line.indexOf('|') !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])){
        flushPara();
        const head = splitRow(line);
        const aligns = alignOf(lines[i + 1]);
        i += 2;
        const rows = [];
        while(i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1){
          rows.push(splitRow(lines[i])); i++;
        }
        emit(tableHtml(head, aligns, rows), start, i);
        continue;
      }

      // ATX 标题
      let m = line.match(/^(#{1,6})\s+(.*)$/);
      if(m){
        flushPara();
        const lv = m[1].length;
        i++;
        emit('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>', start, i);
        continue;
      }

      /* 居中：整行 -> 文字 <- 或 <center>文字</center>。
         -> 不会被列表规则抢走 —— 列表要求 - 后面跟空格，这里紧跟的是 > */
      const cen = line.match(/^\s*(?:->\s?([\s\S]*?)\s?<-|<center>([\s\S]*?)<\/center>)\s*$/);
      if(cen){
        flushPara();
        i++;
        emit('<p class="ta-c">' + inline(cen[1] != null ? cen[1] : cen[2]) + '</p>', start, i);
        continue;
      }

      // 分割线
      if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)){
        flushPara(); i++; emit('<hr />', start, i); continue;
      }

      // setext 标题：下一行全是 = 或 -
      if(line.trim() && i + 1 < lines.length && /^\s*(=+|-+)\s*$/.test(lines[i + 1])){
        flushPara();
        const lv = lines[i + 1].indexOf('=') !== -1 ? 1 : 2;
        i += 2;
        emit('<h' + lv + '>' + inline(line.trim()) + '</h' + lv + '>', start, i);
        continue;
      }

      // 引用：内部递归解析，所以引用里也能放列表和表格
      if(/^\s*>/.test(line)){
        flushPara();
        const buf = [];
        while(i < lines.length && /^\s*>/.test(lines[i])){
          buf.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        emit('<blockquote>' + parseBlocks(buf, false).join('\n') + '</blockquote>', start, i);
        continue;
      }

      // 列表（连续收集，再按缩进递归）
      if(listItem(line)){
        flushPara();
        const items = [];
        while(i < lines.length){
          const it = listItem(lines[i]);
          if(it){
            // 同级但有序/无序不同 = 另一个列表，让外层重新开始，别把后半个吞掉
            if(items.length && it.indent === items[0].indent && it.ordered !== items[0].ordered) break;
            items.push(it); i++; continue;
          }
          // 列表项之间允许一个空行，后面还是列表就继续
          if(!lines[i].trim() && i + 1 < lines.length && listItem(lines[i + 1])){ i++; continue; }
          break;
        }
        emit(listHtml(items), start, i);
        continue;
      }

      // 空行
      if(!line.trim()){ flushPara(); i++; continue; }

      // 普通段落行：保留行尾空格（硬换行要用）
      if(!para.length) paraS = i;
      para.push(line.replace(/^\s+/, ''));
      i++;
    }
    flushPara();
    return out;
  }

  return parseBlocks(src.replace(/\r\n?/g, '\n').split('\n'), true).join('\n');
}

/* ============================================================
   4. 编辑器
   ============================================================ */
let saveTimer = null;

function setSaved(text){ $('#edSaved').textContent = text; }
function updateCount(){
  const len = $('#edBody').value.replace(/\s/g, '').length;
  $('#edCount').textContent = len + ' 字';
}

/* 皮肤只靠 data-skin 覆盖 CSS 变量，所以这里改属性就够了，
   编辑器里的标题、正文、顶栏、标签全都会跟着换色 */
function applyEditorSkin(n){
  const ed = $('#editor');
  if(n && n.skin) ed.setAttribute('data-skin', n.skin);
  else ed.removeAttribute('data-skin');
}

function openEditor(id, asEdit){
  const n = db.notes.find(x => x.id === id);
  if(!n) return;
  ui.editingId = id;
  // 记住打开时的样子：关闭时补进历史，短时间的编辑也不会漏
  ui.edOpenSnap = { title: n.title || '', content: n.content || '' };
  applyEditorSkin(n);
  resetFind();
  $('#edTitle').value = n.title || '';
  $('#edBody').value = n.content || '';
  $('#edPath').textContent = folderPathText(n.folderId);
  setSaved('');
  updateCount();
  renderTags();
  undoReset();
  // 有正文的便签直接进预览——回来看的时候多半是「读」而不是「改」；
  // 空白便签（新建或只写了标题）仍然从编辑开始，否则打开就没处下笔。
  // asEdit 是从「编辑」菜单或搜索命中进来的，本来就奔着改，不必先绕一趟预览
  $('#editor').classList.add('open');
  setPreview(!asEdit && !!(n.content || '').trim());
  // 换了另一条便签，滚动从头开始，别停在上一条的位置
  $('#edPreview').scrollTop = 0;
  $('#edBody').scrollTop = 0;
  setTimeout(function(){ if(!n.title && !ui.preview) $('#edTitle').focus(); }, 260);
}

function renderTags(){
  const n = db.notes.find(x => x.id === ui.editingId);
  const tags = n ? n.tags : [];
  $('#edTags').innerHTML =
    tags.map(t =>
      '<span class="ed-tag">#' + esc(t) +
      '<button data-del-tag="' + esc(t) + '" aria-label="删除标签">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button></span>'
    ).join('') +
    '<button class="tag-add" id="edAddTag">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>标签</button>';
}

function commitEdits(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  const t = $('#edTitle').value.trim();
  const c = $('#edBody').value;
  if(n.title === t && n.content === c) return;
  recordHistory(n, n.title, n.content);   // 改之前先把旧值记进历史
  n.title = t;
  n.content = c;
  n.updatedAt = Date.now();
  save();
  setSaved('已保存');
}

/* ---------- 撤回 / 重做 ----------
   栈里存整份 {title, content}。按时间节流记快照，而不是每次按键都记：
   否则打 200 个字就 200 层，撤回一次只退一个字符，等于没用。 */
const UNDO_MAX = 300;
let undoStack = [], redoStack = [], undoApplying = false, undoLastPush = 0;

function editorState(){
  return { title: $('#edTitle').value, content: $('#edBody').value };
}

function updateUndoBtns(){
  // 预览态没有输入可以退，置灰即可，别让人点了没反应
  $('#edUndo').disabled = !!ui.preview || undoStack.length < 2;
  $('#edRedo').disabled = !!ui.preview || !redoStack.length;
}

function undoReset(){
  undoStack = [editorState()];
  redoStack = [];
  undoLastPush = 0;
  updateUndoBtns();
}

function undoSnapshot(){
  const s = editorState();
  const top = undoStack[undoStack.length - 1];
  if(top && top.title === s.title && top.content === s.content) return;
  undoStack.push(s);
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack = [];          // 有新输入，原来的重做链就断了
  updateUndoBtns();
}

// 输入时调用：700ms 内的连续按键合并成一版
function maybeUndoSnapshot(){
  if(undoApplying) return;
  const now = Date.now();
  if(now - undoLastPush < 700) return;
  undoLastPush = now;
  undoSnapshot();
}

function applyEditorState(s){
  undoApplying = true;
  $('#edTitle').value = s.title;
  $('#edBody').value = s.content;
  updateCount();
  if(ui.preview) renderPreview();
  undoApplying = false;
  updateUndoBtns();
}

function doUndo(){
  if(undoApplying) return;
  const cur = editorState();
  const top = undoStack[undoStack.length - 1];
  // 当前状态可能还没进栈（刚敲完就按撤回），先补进去，
  // 这样撤回回到的是「上一版」，而不是原地不动
  if(!top || top.title !== cur.title || top.content !== cur.content) undoStack.push(cur);
  if(undoStack.length < 2){ toast('没有可撤回的修改'); return; }
  redoStack.push(undoStack.pop());
  applyEditorState(undoStack[undoStack.length - 1]);
  undoLastPush = 0;
  commitEdits();
  toast('已撤回');
}

function doRedo(){
  if(undoApplying || !redoStack.length){ toast('没有可重做的修改'); return; }
  const s = redoStack.pop();
  undoStack.push(s);
  applyEditorState(s);
  undoLastPush = 0;
  commitEdits();
  toast('已重做');
}

/* ---------- 历史版本 ----------
   只留「过去的版本」，当前内容不进 history。
   60 秒内的连续提交合并成一条，否则一次编辑会攒出几十个碎片。
   关闭便签时再强制补一条本次打开时的样子，短编辑也不会漏。 */
const HIST_MAX = 30;
const HIST_GAP = 60 * 1000;
const HIST_BUDGET = 120000;   // 单条便签历史字符总量上限，防止把 localStorage 撑爆

function trimHistory(hist){
  while(hist.length > HIST_MAX) hist.shift();
  let total = 0;
  hist.forEach(function(h){ total += (h.title || '').length + (h.content || '').length; });
  while(hist.length > 1 && total > HIST_BUDGET){
    const g = hist.shift();
    total -= (g.title || '').length + (g.content || '').length;
  }
}

function recordHistory(n, oldTitle, oldContent, force){
  if(!n) return;
  if(!oldTitle && !oldContent) return;
  if(!n.history) n.history = [];
  const hist = n.history;
  const last = hist[hist.length - 1];
  if(last && last.title === oldTitle && last.content === oldContent) return;
  if(!force && last && Date.now() - last.at < HIST_GAP) return;
  hist.push({ at: Date.now(), title: oldTitle, content: oldContent });
  trimHistory(hist);
}

function fmtHistTime(ts){
  const d = new Date(ts), now = new Date();
  const pad = function(x){ return x < 10 ? '0' + x : '' + x; };
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if(d.toDateString() === now.toDateString()) return '今天 ' + hm;
  const yd = new Date(now.getTime() - 86400000);
  if(d.toDateString() === yd.toDateString()) return '昨天 ' + hm;
  if(d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + hm;
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}

function histSnippet(v){
  let c = String(v.content || '')
    .replace(/^#{1,6}\s+/, '')      // 开头的 # 标题标记
    .replace(/\s+/g, ' ')
    .trim();
  // 正文第一行常常就是标题本身，摘要里没必要再重复一遍
  if(v.title && c.indexOf(v.title) === 0){
    c = c.slice(v.title.length).replace(/^[\s·:：,，.。\-—]+/, '');
  }
  const t = c || v.title || '';
  if(!t) return '（空）';
  return t.length > 44 ? t.slice(0, 44) + '…' : t;
}

function charCount(s){ return String(s || '').replace(/\s/g, '').length; }

function openHistory(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  commitEdits();
  const hist = (n.history || []).slice().reverse();   // 新的在上面

  let h = '<h4>历史版本</h4>';
  if(!hist.length){
    h += '<div class="pd-msg">还没有历史版本。<br><br>' +
         '编辑停下来一会儿、或关掉这条便签时，会记一个版本，最多保留 30 个。</div>' +
         '<div class="pd-actions"><button class="pd-btn primary" id="hsOk">知道了</button></div>';
    openSheet(h);
    $('#hsOk').onclick = function(){ closeSheet(); };
    return;
  }

  h += '<div class="hist-now"><span>当前版本</span><span>' + charCount(n.content) + ' 字</span></div>';
  h += '<div class="hist-list">';
  hist.forEach(function(v, i){
    h += '<button class="hist-item" data-hi="' + i + '">' +
           icon('clock', 17, 1.9) +
           '<span class="hist-main">' +
             '<span class="hist-time">' + esc(fmtHistTime(v.at)) + '</span>' +
             '<span class="hist-snip">' + esc(histSnippet(v)) + '</span>' +
           '</span>' +
           '<span class="hist-len">' + charCount(v.content) + ' 字</span>' +
         '</button>';
  });
  h += '</div>';
  openSheet(h);

  $('#sheetRoot').querySelectorAll('[data-hi]').forEach(function(b){
    b.onclick = function(){ restoreHistory(n, hist[+b.dataset.hi]); };
  });
}

function restoreHistory(n, v){
  confirmDialog('恢复到 ' + fmtHistTime(v.at) + ' 的版本？当前内容会先存进历史，之后还能切回来。').then(function(ok){
    if(!ok) return;
    recordHistory(n, n.title, n.content, true);
    n.title = v.title || '';
    n.content = v.content || '';
    n.updatedAt = Date.now();
    save();
    if(ui.editingId === n.id){
      applyEditorState({ title: n.title, content: n.content });
      undoReset();
      renderTags();
      setSaved('已恢复');
    }
    render();
    toast('已恢复');
  });
}

function scheduleSave(){
  clearTimeout(saveTimer);
  if($('#edSaved').textContent !== '未保存…') setSaved('未保存…');
  saveTimer = setTimeout(commitEdits, 500);
}

function closeEditor(){
  const n = db.notes.find(x => x.id === ui.editingId);
  // 预览里正改着一块就直接退出：先把那块落盘，不然改动只留在 DOM 里
  if(blockEdit) commitBlockEdit();
  commitEdits();
  if(n && ui.edOpenSnap){
    // 只有真的改过才补记；点开看一眼就关掉不该攒历史
    if(ui.edOpenSnap.title !== n.title || ui.edOpenSnap.content !== n.content){
      recordHistory(n, ui.edOpenSnap.title, ui.edOpenSnap.content, true);
    }
    ui.edOpenSnap = null;
  }
  if(n && !n.title && !(n.content || '').trim()){
    db.notes = db.notes.filter(x => x.id !== n.id);
    save();
  }
  ui.editingId = null;
  ui.preview = false;
  resetFind();
  $('#editor').classList.remove('open', 'preview');
  render();
}

function newNote(){
  const now = Date.now();
  const minOrder = db.notes.length ? Math.min.apply(null, db.notes.map(n => n.order)) : 0;
  // 新便签直接套上「默认皮肤」，省得每次手动选
  const n = { id:uid(), folderId:ui.folderId, title:'', content:'', tags:[],
              skin:(look.skin && look.skin !== 'default') ? look.skin : null,
              pinned:false, order:minOrder - 1, createdAt:now, updatedAt:now };
  db.notes.push(n);
  save();
  openEditor(n.id);
}

/* ---------- 标签操作 ---------- */
async function addTags(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  const raw = await promptDialog('添加标签', '多个标签用逗号分隔', '');
  if(!raw) return;
  const items = raw.split(/[,，;；\s]+/).map(s => s.replace(/^#/, '').trim()).filter(Boolean);
  items.forEach(t => { if(n.tags.indexOf(t) === -1) n.tags.push(t); });
  n.updatedAt = Date.now();
  save();
  renderTags();
  setSaved('已保存');
  toast('已添加 ' + items.length + ' 个标签');
}

/* ---------- 便签内查找 ---------- */
/* textarea 没法做局部高亮，所以查找时换成一层只读的高亮视图，
   字体/行高/内边距和 textarea 完全对齐，切换时看不出跳动 */
const find = { on:false, q:'', idx:0, total:0, hits:[] };

function resetFind(){
  find.on = false; find.q = ''; find.hits = []; find.total = 0; find.idx = 0;
  $('#editor').classList.remove('finding');
  $('#edFindBtn').classList.remove('on');
  $('#edFindView').innerHTML = '';
  $('#edFindInput').value = '';
  $('#edFindCount').textContent = '';
}

function openFind(q){
  find.on = true;
  setPreview(false);
  $('#editor').classList.add('finding');
  $('#edFindBtn').classList.add('on');
  $('#edFindInput').value = q == null ? '' : q;
  renderFind(true);
  setTimeout(function(){ $('#edFindInput').focus(); $('#edFindInput').select(); }, 40);
}

function closeFind(){
  const hits = find.hits.slice(), q = find.q, idx = find.idx;
  resetFind();
  // 退出后把光标停在刚才那个命中上，方便接着改
  if(hits.length && q){
    const ta = $('#edBody');
    const pos = hits[Math.min(idx, hits.length - 1)];
    ta.focus();
    try{ ta.setSelectionRange(pos, pos + q.length); }catch(e){}
  }
}

function renderFind(reset){
  const q = $('#edFindInput').value;
  const text = $('#edBody').value;
  const box = $('#edFindView');
  find.q = q;

  if(!q){
    find.hits = []; find.total = 0; find.idx = 0;
    box.innerHTML = '<span class="ph">输入关键词，在本便签里查找</span>';
    updateFindCount();
    return;
  }
  if(!text){
    find.hits = []; find.total = 0; find.idx = 0;
    box.innerHTML = '<span class="ph">这条便签还没有正文</span>';
    updateFindCount();
    return;
  }

  const lower = text.toLowerCase(), lq = q.toLowerCase();
  find.hits = [];
  let i = 0;
  while(find.hits.length < 400){        // 上限只是防止极端长文卡住
    const k = lower.indexOf(lq, i);
    if(k < 0) break;
    find.hits.push(k);
    i = k + lq.length;
  }
  find.total = find.hits.length;
  if(reset || find.idx >= find.total) find.idx = 0;

  let html = '', pos = 0;
  find.hits.forEach(function(k, n){
    html += esc(text.slice(pos, k)) +
      '<mark data-fi="' + n + '"' + (n === find.idx ? ' class="cur"' : '') + '>' +
      esc(text.slice(k, k + q.length)) + '</mark>';
    pos = k + q.length;
  });
  html += esc(text.slice(pos));
  box.innerHTML = html;
  updateFindCount();
  scrollFindTo();
}

function updateFindCount(){
  $('#edFindCount').textContent = !find.q ? '' : (find.total ? (find.idx + 1) + '/' + find.total : '无');
  $('#edFindPrev').disabled = !find.total;
  $('#edFindNext').disabled = !find.total;
  // 一处都没命中时「替换」点了也没意义，直接置灰
  const one = $('#edRepOne'), all = $('#edRepAll');
  if(one) one.disabled = !find.total;
  if(all) all.disabled = !find.total;
}

function scrollFindTo(){
  const box = $('#edFindView');
  const cur = box.querySelector('mark.cur');
  if(!cur) return;
  box.scrollTop = Math.max(0, cur.offsetTop - box.offsetTop - box.clientHeight / 2 + cur.offsetHeight / 2);
}

function markFindCur(){
  $('#edFindView').querySelectorAll('mark[data-fi]').forEach(function(m){
    m.classList.toggle('cur', Number(m.dataset.fi) === find.idx);
  });
}

function gotoFind(delta){
  if(!find.total) return;
  find.idx = (find.idx + delta + find.total) % find.total;
  markFindCur();
  updateFindCount();
  scrollFindTo();
}

/* ---------- 查找替换 ---------- */
function repValue(){ return $('#edRepInput').value; }

/* 替换当前这一处。位置来自 find.hits —— 它是按小写比对出来的，
   所以这里用长度截取而不是字符串替换，大小写不同的命中也能正确落刀 */
function replaceOne(){
  if(!find.q || !find.total) return;
  const pos = find.hits[Math.min(find.idx, find.total - 1)];
  if(pos == null) return;
  const ta = $('#edBody');
  const v = ta.value, r = repValue();
  maybeUndoSnapshot();
  ta.value = v.slice(0, pos) + r + v.slice(pos + find.q.length);
  updateCount();
  scheduleSave();
  // 重算命中后 idx 停在原位 = 自动指向下一处，连着点就是一路替下去
  renderFind(false);
  ta.focus();
}

/* 全部替换：从后往前按位置改，前面的下标才不会被打乱。
   不用 split/join —— 那样会把大小写不同的命中漏掉 */
function replaceAllHits(){
  if(!find.q || !find.total) return;
  const ta = $('#edBody');
  const hits = find.hits.slice(), r = repValue(), q = find.q;
  let v = ta.value;
  maybeUndoSnapshot();
  for(let k = hits.length - 1; k >= 0; k--){
    const p = hits[k];
    v = v.slice(0, p) + r + v.slice(p + q.length);
  }
  ta.value = v;
  updateCount();
  scheduleSave();
  renderFind(true);
  toast('替换了 ' + hits.length + ' 处');
  ta.focus();
}

/* ---------- 格式工具栏 ----------
   全部作用于源码 textarea 的选区：包一层标记，再把选区放回去。
   没选中文字时插入一对空标记，光标落在中间，接着打就行。
   已经包着同样标记再点一次 = 拆掉，不然连点两下会变成 ****文字**** */
let fmtSel = null;                       // 打开颜色面板前的选区，防止失焦丢失

const FMT_PAIRS = {
  bold:   ['**',  '**',  '粗体'],
  italic: ['*',   '*',   '斜体'],
  strike: ['~~',  '~~',  '删除线'],
  under:  ['<u>', '</u>', '下划线'],
  mark:   ['==',  '==',  '高亮']
};

function taRange(){
  const ta = $('#edBody');
  if(fmtSel && fmtSel.ta === ta) return fmtSel;
  return { ta: ta, a: ta.selectionStart, b: ta.selectionEnd };
}

function afterFmt(a, b){
  updateCount();
  scheduleSave();
  $('#edBody').focus();
  if(a != null){
    try{ $('#edBody').setSelectionRange(a, b == null ? a : b); }catch(e){}
  }
}

function wrapSelection(open, close, ph){
  const r = taRange();
  const ta = r.ta, a = r.a, b = r.b, v = ta.value;
  const sel = v.slice(a, b) || ph || '';
  // 记的是「改之前」的状态，否则第一次用工具栏就撤不回去
  maybeUndoSnapshot();

  // 选区两边已经是这对标记 → 拆掉
  if(a >= open.length && v.slice(a - open.length, a) === open && v.slice(b, b + close.length) === close){
    ta.value = v.slice(0, a - open.length) + v.slice(a, b) + v.slice(b + close.length);
    afterFmt(a - open.length, b - open.length);
    return;
  }
  ta.value = v.slice(0, a) + open + sel + close + v.slice(b);
  afterFmt(a + open.length, a + open.length + sel.length);
  fmtSel = null;
}

/* 居中：作用在选区覆盖的每一整行上 */
function toggleCenter(){
  const r = taRange();
  const ta = r.ta, v = ta.value;
  maybeUndoSnapshot();
  let ls = v.lastIndexOf('\n', r.a - 1) + 1;
  let le = v.indexOf('\n', r.b);
  if(le < 0) le = v.length;

  const lines = v.slice(ls, le).split('\n');
  const done = lines.map(function(l){
    const m = l.match(/^\s*->\s?([\s\S]*?)\s?<-\s*$/);
    if(m) return m[1];                                  // 已经是居中 → 取消
    const t = l.trim();
    return t ? '-> ' + t + ' <-' : l;
  }).join('\n');

  ta.value = v.slice(0, ls) + done + v.slice(le);
  afterFmt(ls + done.length);
}

/* 清除格式：把选区里成对的标记剥掉 */
function stripFmt(t){
  return String(t)
    .replace(/\*\*([^*\n]+)\*\*/g, '$1')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2')
    .replace(/~~([^~\n]+)~~/g, '$1')
    .replace(/==([^=\n]+)==/g, '$1')
    .replace(/\+\+([^+\n]+)\+\+/g, '$1')
    .replace(/<u>([\s\S]*?)<\/u>/g, '$1')
    .replace(/<mark[^>]*>([\s\S]*?)<\/mark>/g, '$1')
    .replace(/<span style="color:#[0-9a-fA-F]{3,8}">([\s\S]*?)<\/span>/g, '$1')
    .replace(/<\/?(?:u|mark|span|sup|sub)>/g, '')
    .replace(/^\s*->\s?([\s\S]*?)\s?<-\s*$/gm, '$1');
}

function clearFormat(){
  const r = taRange();
  const ta = r.ta, v = ta.value;
  if(r.a === r.b){ toast('先选中要清除格式的文字'); return; }
  const sel = v.slice(r.a, r.b);
  const out = stripFmt(sel);
  if(out === sel){ toast('这段没有可清除的格式'); return; }
  maybeUndoSnapshot();
  ta.value = v.slice(0, r.a) + out + v.slice(r.b);
  afterFmt(r.a, r.a + out.length);
}

/* 文字颜色 / 高亮颜色 */
const TEXT_COLORS = ['#e03131', '#e8890c', '#2f9e44', '#1c7ed6', '#7048e8', '#c2255c', '#5c636a', '#111111'];
const MARK_COLORS = ['#ffe066', '#b2f2bb', '#a5d8ff', '#fcc2d7', '#ffd8a8', '#e5dbff'];

function openColorSheet(){

    h += '<button class="cc" data-val="' + c + '" style="background:' + c + '" aria-label="' + c + '">' +
         '<span>A</span></button>';

  MARK_COLORS.forEach(function(c){
    h += '<button class="cc" data-val="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>';
  });
  h += '</div><div class="cc-row" data-cc="reset">' +
       '<button class="cc-reset" data-val="">恢复默认色</button></div>';
  openSheet(h);

  const root = $('#sheetRoot');
  root.querySelectorAll('[data-cc] [data-val]').forEach(function(b){

let sheetOnClose = null;

function openSheet(html){
  const root = $('#sheetRoot');
  root.innerHTML = '<div class="mask"></div><div class="sheet">' + html + '</div>';
  root.classList.add('open');
  root.querySelector('.mask').onclick = function(){ closeSheet(); };
}
function closeSheet(){
  $('#sheetRoot').classList.remove('open');
  if(sheetOnClose){ const f = sheetOnClose; sheetOnClose = null; f(); }
}

function menuItems(title, items){
  let h = '<h4>' + esc(title) + '</h4>';
  items.forEach(function(it, i){
    h += '<button class="sheet-item ' + (it.danger ? 'danger' : '') + '" data-mi="' + i + '">' +
         icon(it.icon || 'info', 20) + '<span>' + esc(it.label) + '</span></button>';
  });
  h += '<button class="sheet-item" data-cancel style="justify-content:center;color:var(--t2);margin-top:2px">取消</button>';
  openSheet(h);
  const root = $('#sheetRoot');
  root.querySelectorAll('[data-mi]').forEach(function(b){
    b.onclick = function(){ const fn = items[+b.dataset.mi].onClick; closeSheet(); fn(); };
  });
  root.querySelector('[data-cancel]').onclick = function(){ closeSheet(); };
}

function promptDialog(title, placeholder, value){
  return new Promise(function(resolve){
    openSheet(
      '<h4>' + esc(title) + '</h4>' +
      '<div class="pd-wrap"><input id="pdInput" class="textfield" placeholder="' + esc(placeholder||'') + '" value="' + esc(value||'') + '" /></div>' +
      '<div class="pd-actions"><button class="pd-btn" id="pdCancel">取消</button><button class="pd-btn primary" id="pdOk">确定</button></div>'
    );
    const inp = $('#pdInput');
    const done = function(v){ sheetOnClose = null; closeSheet(); resolve(v); };
    sheetOnClose = function(){ resolve(null); };
    setTimeout(function(){ inp.focus(); inp.select(); }, 150);
    $('#pdOk').onclick = function(){ done(inp.value.trim() || null); };
    $('#pdCancel').onclick = function(){ done(null); };
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') done(inp.value.trim() || null); });
  });
}

function confirmDialog(msg){
  return new Promise(function(resolve){
    openSheet(
      '<h4>请确认</h4>' +
      '<div class="pd-msg">' + esc(msg) + '</div>' +
      '<div class="pd-actions"><button class="pd-btn" id="cfNo">取消</button><button class="pd-btn primary" id="cfYes">确定</button></div>'
    );
    const done = function(v){ sheetOnClose = null; closeSheet(); resolve(v); };
    sheetOnClose = function(){ resolve(false); };
    $('#cfNo').onclick = function(){ done(false); };
    $('#cfYes').onclick = function(){ done(true); };
  });
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

   7. 长按拖拽排序
   ============================================================ */
const drag = {
  active:false, el:null, id:null, listEl:null,
  startX:0, startY:0, h:0, from:0, to:0,
  others:[], rects:[], timer:null, moved:false
};

function dragStart(e){
  if(ui.selMode) return false;   // 多选时点卡片是勾选，不是拖排序
  const card = e.target.closest('[data-drag-note]');
  if(!card || !card.closest('#noteList')) return false;
  if(e.target.closest('.more')) return false;
  if(e.pointerType === 'mouse' && e.button !== 0) return false;

  drag.active = false;
  drag.id = card.dataset.dragNote;
  drag.el = card;
  drag.startX = e.clientX;
  drag.startY = e.clientY;
  drag.moved = false;
  drag.listEl = card.closest('#noteList');

  clearTimeout(drag.timer);
  drag.timer = setTimeout(function(){ beginDrag(); }, 380);
  return true;
}

function beginDrag(){
  const el = drag.el;
  if(!el) return;
  const rect = el.getBoundingClientRect();
  drag.active = true;
  drag.h = rect.height + 8;   // 8 = gap
  drag.from = Array.prototype.indexOf.call(drag.listEl.children, el);
  drag.to = drag.from;
  drag.others = Array.prototype.filter.call(drag.listEl.children, c => c !== el);
  drag.rects = drag.others.map(c => c.getBoundingClientRect());

  el.classList.add('dragging');
  el.style.width = rect.width + 'px';
  el.style.left = rect.width ? '' : ''; // 占位：靠 transform 移动，不改文档流

  if(navigator.vibrate) navigator.vibrate(12);
  ui.suppressClick = true;
}

function dragMove(e){
  if(!drag.active || !drag.el) return;
  const dy = e.clientY - drag.startY;
  drag.el.style.transform = 'translateY(' + dy + 'px) scale(1.02)';
  drag.moved = true;

  // 判断插入位置
  const y = e.clientY;
  let k = drag.others.length;
  for(let i = 0; i < drag.rects.length; i++){
    const r = drag.rects[i];
    if(y < r.top + r.height / 2){ k = i; break; }
  }
  drag.to = k;

  // 让位动画：others 内部索引 i 对应原位置 i<from? i : i+1
  const fromVirtual = drag.from;
  drag.others.forEach(function(node, i){
    let shift = 0;
    if(k > fromVirtual && i >= fromVirtual && i < k) shift = -drag.h;
    else if(k < fromVirtual && i >= k && i < fromVirtual) shift = drag.h;
    node.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
  });
}

function dragEnd(){
  clearTimeout(drag.timer);
  if(!drag.active){ drag.el = null; return; }
  const el = drag.el, listEl = drag.listEl, k = drag.to;
  const others = drag.others.slice();

  // 复位视觉
  el.classList.remove('dragging');
  el.style.transform = '';
  el.style.width = '';
  others.forEach(function(n){ n.style.transform = ''; });

  // 真正重排 DOM
  const finalOrder = others.slice(0, k).concat([el], others.slice(k));
  finalOrder.forEach(function(n){ listEl.appendChild(n); });

  // 写回 order
  const ids = Array.prototype.map.call(listEl.children, c => c.dataset.dragNote);
  ids.forEach(function(id, i){
    const n = db.notes.find(x => x.id === id);
    if(n) n.order = i;
  });
  save();

  drag.active = false;
  drag.el = null;

  render();
  toast('顺序已保存');
}

function dragCancel(){
  clearTimeout(drag.timer);
  if(drag.active && drag.el){
    drag.el.classList.remove('dragging');
    drag.el.style.transform = '';
    drag.el.style.width = '';
    (drag.others || []).forEach(function(n){ n.style.transform = ''; });
  }
  drag.active = false;
  drag.el = null;
}

/* 交给系统落地一个 Blob：优先系统分享面板，其次下载 */
async function saveBlob(filename, blob){
  const file = new File([blob], filename, { type:blob.type || 'application/octet-stream' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file], title:filename });
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast('已导出：' + filename);
}

async function saveFile(filename, text, mime){
  // 安卓壳：交给原生写入「下载」目录
  if(window.AndroidBridge && window.AndroidBridge.saveFile){
    try{
      const ok = window.AndroidBridge.saveFile(filename, text, mime || 'text/plain');
      toast(ok ? '已保存到「下载」：' + filename : '保存失败');
      return;
    }catch(e){ /* 落回 web 逻辑 */ }
  }
  await saveBlob(filename, new Blob([text], { type:mime }));
}

/* ---------- Markdown ---------- */
const hash = n => '#'.repeat(Math.min(n, 6));

function buildMarkdown(fid){
  const out = [];
  const scope = fid ? getFolder(fid) : null;
  out.push('# 便签导出' + (scope ? ' · ' + scope.name : ''));
  out.push('');
  out.push('> 导出时间：' + fmtFull(Date.now()));
  out.push('> 文件夹 ' + db.folders.length + ' 个，便签 ' + countNotesDeep(fid) + ' 条');
  out.push('');
  if(scope){ out.push('分类路径：' + folderPathText(fid)); out.push(''); }

  if(fid){
    mdFolder(fid, 2, out);
  }else{
    if(notesIn(null).length){
      out.push('## 未分类');
      out.push('');
      mdNotes(null, 3, out);
    }
    subFolders(null).forEach(function(f){ mdFolder(f.id, 2, out); });
  }
  return out.join('\n');
}
function mdFolder(fid, level, out){
  out.push(hash(level) + ' ' + getFolder(fid).name);
  out.push('');
  if(!notesIn(fid).length && !subFolders(fid).length){
    out.push('*（空文件夹）*');
    out.push('');
    return;
  }
  mdNotes(fid, level + 1, out);
  subFolders(fid).forEach(function(f){ mdFolder(f.id, level + 1, out); });
}
function mdNotes(fid, level, out){
  notesIn(fid).forEach(function(n){
    out.push(hash(level) + ' ' + (n.title || '无标题'));
    out.push('');
    if(n.tags.length) out.push('`' + n.tags.map(t => '#' + t).join(' ') + '`');
    out.push('*更新于 ' + fmtFull(n.updatedAt) + (n.pinned ? ' · 置顶' : '') + '*');
    out.push('');
    if(n.content){ out.push(n.content); out.push(''); }
  });
}

/* ---------- 纯文本 ---------- */
/* 把 Markdown 转成适合纯文本阅读的排版（去掉符号，保留结构） */
function stripInline(s){
  return s
    .replace(/`([^`]*)`/g, '$1')
    .replace(/(\*\*|__)(.*?)\1/g, '$2')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2')
    .replace(/~~(.*?)~~/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
}
function mdToPlain(md){
  const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let inCode = false;
  lines.forEach(function(line){
    if(/^\s*```/.test(line)){ inCode = !inCode; out.push('    ┈┈┈'); return; }
    if(inCode){ out.push('    ' + line); return; }

    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const t = stripInline(m[2]);
      out.push(t);
      out.push('─'.repeat(Math.min(t.length * 2 + 4, 40)));
      return;
    }
    m = line.match(/^\s*[-*+]\s+(.*)$/);
    if(m){ out.push('• ' + stripInline(m[1])); return; }
    m = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if(m){ out.push(m[1] + '. ' + stripInline(m[2])); return; }
    m = line.match(/^\s*>\s?(.*)$/);
    if(m){ out.push('│ ' + stripInline(m[1])); return; }
    if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)){ out.push('─'.repeat(30)); return; }
    out.push(stripInline(line));
  });
  // 压缩连续空行
  return out.join('\n').replace(/\n{3,}/g, '\n\n');
}

function buildText(fid){
  const L = [];
  const scope = fid ? getFolder(fid) : null;
  L.push('便签导出' + (scope ? ' · ' + scope.name : ''));
  L.push('导出时间：' + fmtFull(Date.now()));
  L.push('文件夹 ' + db.folders.length + ' 个，便签 ' + countNotesDeep(fid) + ' 条');
  L.push('='.repeat(48));
  L.push('');

  if(fid){
    textFolder(fid, 0, L);
  }else{
    if(notesIn(null).length){
      L.push('【未分类】');
      L.push('');
      textNotes(null, 1, L);
    }
    subFolders(null).forEach(function(f){ textFolder(f.id, 0, L); });
  }
  return L.join('\n');
}
function textFolder(fid, depth, L){
  const pad = '  '.repeat(depth);
  L.push(pad + '【' + folderPathText(fid) + '】');
  L.push('');
  if(!notesIn(fid).length && !subFolders(fid).length){
    L.push(pad + '  （空文件夹）');
    L.push('');
  }else{
    textNotes(fid, depth + 1, L);
  }
  subFolders(fid).forEach(function(f){ textFolder(f.id, depth + 1, L); });
}
function textNotes(fid, depth, L){
  const pad = '  '.repeat(depth);
  notesIn(fid).forEach(function(n){
    L.push(pad + (n.pinned ? '★ ' : '· ') + (n.title || '无标题'));
    if(n.tags.length) L.push(pad + '  标签：' + n.tags.map(t => '#' + t).join(' '));
    L.push(pad + '  更新：' + fmtFull(n.updatedAt));
    L.push('');
    if(n.content){
      mdToPlain(n.content).split('\n').forEach(function(line){ L.push(pad + '  ' + line); });
      L.push('');
    }
    L.push('');
  });
}

/* ---------- HTML ---------- */
function buildHTML(){
  const parts = [];
  if(notesIn(null).length){
    parts.push('<h2>未分类</h2>');
    htmlNotes(null, parts);
  }
  subFolders(null).forEach(function(f){ htmlFolder(f.id, parts); });

  return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8" />\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1" />\n' +
    '<title>便签导出</title>\n<style>\n' +
    'body{max-width:760px;margin:0 auto;padding:32px 20px 80px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;color:#1c1c1e}\n' +
    'h1{font-size:22px;border-bottom:2px solid #e8890c;padding-bottom:10px}\n' +
    'h2{font-size:18px;margin:34px 0 4px;color:#e8890c}\n' +
    '.crumb{font-size:12px;color:#8a8a8e;font-weight:400}\n' +
    'h3{font-size:16px;margin:22px 0 0}\n' +
    '.meta{color:#8a8a8e;font-size:12px;margin-bottom:6px}\n' +
    '.tagline{color:#e8890c;font-size:12px;margin-bottom:4px}\n' +
    '.body{white-space:pre-wrap;font-size:15px;background:#f7f7f9;border-radius:10px;padding:14px 16px}\n' +
    'article{margin-bottom:18px}\n' +
    '@media print{body{padding:0}.body{background:none;border:1px solid #ddd}}\n' +

    parts.join('\n') + '\n</body>\n</html>';
}
function htmlFolder(fid, parts){
  const f = getFolder(fid);
  if(!f) return;
  const parent = f.parentId ? folderPathText(f.parentId) : '';
  parts.push('<h2>' + (parent ? '<span class="crumb">' + esc(parent) + ' / </span>' : '') + esc(f.name) + '</h2>');
  htmlNotes(fid, parts);
  subFolders(fid).forEach(function(c){ htmlFolder(c.id, parts); });
}
function htmlNotes(fid, parts){
  notesIn(fid).forEach(function(n){
    parts.push('<article><h3>' + (n.pinned ? '★ ' : '') + esc(n.title || '无标题') + '</h3>' +
      (n.tags.length ? '<div class="tagline">' + esc(n.tags.map(t => '#' + t).join('  ')) + '</div>' : '') +
      '<div class="meta">更新于 ' + fmtFull(n.updatedAt) + '</div>' +
      (n.content ? '<div class="body">' + esc(n.content) + '</div>' : '') + '</article>');
  });
}

    .replace(/\s+/g, ' ')
    .trim()

function buildNoteMarkdown(n){
  const L = [];
  L.push('# ' + (n.title || '无标题'));
  L.push('');
  if(n.tags && n.tags.length) L.push('`' + n.tags.map(t => '#' + t).join(' ') + '`  ');
  L.push('*更新于 ' + fmtFull(n.updatedAt) + (n.pinned ? ' · 置顶' : '') + '*  ');
  L.push('*位置：' + folderPathText(n.folderId) + '*');
  L.push('');
  if(n.content){ L.push(n.content); L.push(''); }
  return L.join('\n');
}

function buildNoteText(n){
  const L = [];
  const t = n.title || '无标题';
  L.push(t);
  L.push('='.repeat(Math.min(48, Math.max(10, t.length * 2 + 4))));
  L.push('');
  if(n.tags && n.tags.length) L.push('标签：' + n.tags.map(x => '#' + x).join(' '));
  L.push('更新：' + fmtFull(n.updatedAt) + (n.pinned ? '   ★ 置顶' : ''));
  L.push('位置：' + folderPathText(n.folderId));
  L.push('');
  L.push('─'.repeat(32));
  L.push('');
  L.push(n.content ? mdToPlain(n.content) : '（无正文）');
  L.push('');
  return L.join('\n');
}

/* 按文件夹导出时，文件名已经承载了标题，正文里就不要再重复一遍；
   但如果正文本身没有一级标题，补一个，免得单独打开文件不知道叫什么 */
function firstMeaningfulLine(text){
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  for(let i = 0; i < lines.length; i++){ if(lines[i].trim()) return lines[i]; }
  return '';
}
function noteBodyMd(n){
  const title = n.title || '无标题';
  const body = String(n.content || '').replace(/\r\n?/g, '\n').trim();
  if(!body) return '# ' + title + '\n';
  return /^#\s+\S/.test(firstMeaningfulLine(body)) ? body + '\n' : '# ' + title + '\n\n' + body + '\n';
}
function noteBodyText(n){
  const title = n.title || '无标题';
  const body = String(n.content || '').trim();
  if(!body) return title + '\n';
  const plain = mdToPlain(body);
  return /^#\s+\S/.test(firstMeaningfulLine(body)) ? plain + '\n' : title + '\n\n' + plain + '\n';
}

/* ---------- 按文件夹结构导出（一条便签一个文件，目录层级照搬） ---------- */
const BAD_CHARS = /[\\/:*?"<>|\u0000-\u001f]/g;

/* 文件夹名/便签标题都可能含 / 或 :，直接当文件名会丢字符甚至跑出目录 */
function safeSeg(name, max){
  let s = String(name == null ? '' : name)
    .replace(BAD_CHARS, '_')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/^\.+$/, '_');
  if(!s) s = '未命名';
  const m = max || 60;
  return s.length > m ? s.slice(0, m).trim() : s;
}

function buildTreePlan(fmt, fid){
  const scope = fid ? folderPathText(fid).replace(/\s*\/\s*/g, '-') : '';
  const root = '便签' + (scope ? '-' + safeSeg(scope, 30) : '') + '-' + stamp();

  const dirs  = [];                 // 目录相对路径（用 / 分隔）
  const files = [];                 // { dir, name, content }
  const seenDir  = new Set();
  const seenName = new Map();       // dir -> Set(小写文件名)，避免同名覆盖

  function addDir(dir){
    if(dir && !seenDir.has(dir)){ seenDir.add(dir); dirs.push(dir); }
  }
  function uniqName(dir, base, ext){
    if(!seenName.has(dir)) seenName.set(dir, new Set());
    const set = seenName.get(dir);
    let name = base + ext, i = 2;
    while(set.has(name.toLowerCase())){ name = base + ' (' + i + ')' + ext; i++; }
    set.add(name.toLowerCase());
    return name;
  }
  function addNote(n, dir){
    addDir(dir);
    const content = fmt === 'md'   ? noteBodyMd(n)
                  : fmt === 'txt'  ? noteBodyText(n)
                  :                  buildNoteHTML(n);
    files.push({
      dir: dir,
      name: uniqName(dir, safeSeg(n.title || '无标题', 60), '.' + fmt),
      content: content,
      time: n.updatedAt || n.createdAt || Date.now()
    });
  }
  function walk(pid, dir){
    addDir(dir);
    notesIn(pid).forEach(function(n){ addNote(n, dir); });
    subFolders(pid).forEach(function(f){
      const sub = dir ? dir + '/' + safeSeg(f.name, 50) : safeSeg(f.name, 50);
      walk(f.id, sub);
    });
  }

  walk(fid || null, '');
  return { root: root, dirs: dirs, files: files };
}

/* ---- 极简 ZIP 打包（仅存储，不压缩；足够让解压工具还原目录） ---- */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let i = 0; i < 256; i++){
    let c = i;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(entries){
  const enc = new TextEncoder();
  const fallback = new Date();
  function dos(d){
    const t = d instanceof Date && !isNaN(d) ? d : fallback;
    let y = t.getFullYear();
    if(y < 1980) y = 1980;
    if(y > 2107) y = 2107;
    return [
      ((t.getHours() << 11) | (t.getMinutes() << 5) | (t.getSeconds() >> 1)) & 0xFFFF,
      (((y - 1980) << 9) | ((t.getMonth() + 1) << 5) | t.getDate()) & 0xFFFF
    ];
  }

  const locals = [];   // { header, name, data }
  const centrals = [];
  let offset = 0;

  entries.forEach(function(e){
    const nameBytes = enc.encode(e.name);
    const data = e.dir ? new Uint8Array(0) : (e.data || new Uint8Array(0));
    const crc = crc32(data);
    const dt = dos(e.time);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);           // 解压所需版本
    lh.setUint16(6, 0x0800, true);       // bit 11：文件名为 UTF-8
    lh.setUint16(8, 0, true);            // 0 = 仅存储
    lh.setUint16(10, dt[0], true);
    lh.setUint16(12, dt[1], true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);
    locals.push({ header:new Uint8Array(lh.buffer), name:nameBytes, data:data });

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);           // 制作版本
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dt[0], true);
    ch.setUint16(14, dt[1], true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint16(30, 0, true);           // extra
    ch.setUint16(32, 0, true);           // comment
    ch.setUint16(34, 0, true);           // disk
    ch.setUint16(36, 0, true);           // 内部属性
    ch.setUint32(38, e.dir ? 0x41ED0010 : 0x81A40000, true);   // 外部属性：目录位 / 常规文件
    ch.setUint32(42, offset, true);
    centrals.push({ header:new Uint8Array(ch.buffer), name:nameBytes });

    offset += 30 + nameBytes.length + data.length;
  });

  let centralSize = 0;
  centrals.forEach(function(c){ centralSize += 46 + c.name.length; });

  const total = offset + centralSize + 22;
  const out = new Uint8Array(total);
  let p = 0;

  locals.forEach(function(l){
    out.set(l.header, p); p += l.header.length;
    out.set(l.name, p);   p += l.name.length;
    out.set(l.data, p);   p += l.data.length;
  });
  centrals.forEach(function(c){
    out.set(c.header, p); p += c.header.length;
    out.set(c.name, p);   p += c.name.length;
  });

  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, entries.length, true);
  eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, offset, true);
  out.set(new Uint8Array(eocd.buffer), p);
  return out;
}

function zipPlan(plan){
  const enc = new TextEncoder();
  const entries = [{ name: plan.root + '/', dir: true }];
  plan.dirs.forEach(function(d){ entries.push({ name: plan.root + '/' + d + '/', dir: true }); });
  plan.files.forEach(function(f){
    entries.push({
      name: plan.root + '/' + (f.dir ? f.dir + '/' : '') + f.name,
      data: enc.encode(f.content),
      time: f.time ? new Date(f.time) : null,
      dir: false
    });
  });
  return makeZip(entries);
}

async function exportTree(fmt, fid){
  const plan = buildTreePlan(fmt, fid);
  if(!plan.files.length){ toast('这里还没有便签可以导出'); return; }

  // 安卓壳：直接建真实的多层目录，不用解压
  if(window.AndroidBridge && window.AndroidBridge.saveTree){
    try{
      const res = String(window.AndroidBridge.saveTree(JSON.stringify(plan)));
      if(res.indexOf('ok|') === 0){
        const p = res.split('|');
        const skipped = Number(p[2] || 0);
        toast('已写入「下载/' + plan.root + '」' + p[1] + ' 个文件' +
              (skipped ? '（' + skipped + ' 个空文件夹已略过）' : ''));
        return;
      }
      if(res.indexOf('err|') === 0) toast('目录写入失败：' + res.slice(4).slice(0, 40));
    }catch(e){ /* 落回 zip */ }
  }

  // 浏览器：打包成 zip，解压后就是同样的目录结构
  await saveBlob(plan.root + '.zip', new Blob([zipPlan(plan)], { type:'application/zip' }));
}

async function importJSON(file){
  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(e){
    toast('文件不是有效的 JSON');
    return;
  }
  if(!data || !Array.isArray(data.folders) || !Array.isArray(data.notes)){
    toast('这不是本应用导出的备份文件');
    return;
  }
  const ok = await confirmDialog('将导入 ' + data.folders.length + ' 个文件夹、' + data.notes.length + ' 条便签，并与现有数据合并。继续？');
  if(!ok) return;

  const idMap = new Map();
  data.folders.forEach(function(f){ idMap.set(f.id, uid()); });
  data.folders.forEach(function(f){
    db.folders.push({
      id: idMap.get(f.id),
      name: f.name || '未命名',
      parentId: f.parentId ? (idMap.get(f.parentId) || null) : null,
      color: typeof f.color === 'number' ? f.color : 0,
      createdAt: f.createdAt || Date.now()
    });
  });
  let base = db.notes.length ? Math.max.apply(null, db.notes.map(n => n.order)) + 1 : 0;
  data.notes.forEach(function(n){
    db.notes.push({
      id: uid(),
      folderId: n.folderId ? (idMap.get(n.folderId) || null) : null,
      title: n.title || '',
      content: n.content || '',
      tags: Array.isArray(n.tags) ? n.tags.slice() : [],
      pinned: !!n.pinned,
      order: base++,
      createdAt: n.createdAt || Date.now(),
      updatedAt: n.updatedAt || Date.now(),
      // 备份里带了皮肤和历史版本就一起还原，否则恢复出来的便签全长一个样
      skin: typeof n.skin === 'string' ? n.skin : null,
      history: Array.isArray(n.history) ? n.history.slice() : []
    });
  });
  // 备份可能是改过的脏数据：皮肤 id 不存在、历史项缺字段，都在这里统一清掉
  normalize();
  save();
  ui.folderId = null;
  render();
  toast('导入完成');
}

/* ============================================================
   导入数据包：ZIP / 多选文件 / 整个文件夹
   ------------------------------------------------------------
   和「按文件夹结构导出」正好反着走：导出的每个 .md/.txt/.html 文件
   在这里被读回一条便签，路径上的目录段还原成文件夹。
   三种格式的信息量不同：
     .md  → 完整还原（本来就是 Markdown 源文）
     .txt → 只能是纯文本，原有的 #、** 这类语法已经在上一步被拍平了
     .html→ 反过来解析 DOM 再拼回 Markdown，能救回标题/列表/表格/代码块
   ============================================================ */
const PACK_EXT = /\.(md|markdown|txt|html|htm)$/i;
const PACK_SKIP = /(^|\/)(__MACOSX|\.DS_Store)\/|(^|\/)\._/;

function stripBom(s){ return s.charCodeAt(0) === 0xFEFF ? s.slice(1) : s; }
function decodeUtf8(bytes){ return stripBom(new TextDecoder('utf-8').decode(bytes)); }

/* 自己打的 zip 是「仅存储」，系统压缩工具多半用 deflate；两种都认 */
async function inflateRaw(raw){
  if(typeof DecompressionStream === 'undefined') throw new Error('noinflate');
  const s = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  // EOCD 在最末尾，末尾还可能带注释，所以从后往前扫
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('badzip');

  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const items = [];
  let dropped = 0;

  for(let i = 0; i < count; i++){
    if(p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nLen   = dv.getUint16(p + 28, true);
    const eLen   = dv.getUint16(p + 30, true);
    const cLen   = dv.getUint16(p + 32, true);
    const off    = dv.getUint32(p + 42, true);
    const name   = decodeUtf8(u8.subarray(p + 46, p + 46 + nLen)).replace(/\\/g, '/');
    p += 46 + nLen + eLen + cLen;

    if(/\/$/.test(name)) continue;                       // 目录条目
    if(!PACK_EXT.test(name)){ dropped++; continue; }     // 图片、附件之类
    if(csize === 0xFFFFFFFF) { dropped++; continue; }    // zip64，暂不处理

    const lnLen = dv.getUint16(off + 26, true);
    const leLen = dv.getUint16(off + 28, true);
    const start = off + 30 + lnLen + leLen;
    const raw   = u8.subarray(start, start + csize);
    if(method === 0){
      items.push({ path:name, text:decodeUtf8(raw) });
    }else if(method === 8){
      items.push({ path:name, text:decodeUtf8(await inflateRaw(raw)) });
    }else{
      dropped++;                                          // bzip2 / lzma 等
    }
  }
  return { items:items, dropped:dropped };
}

/* ---------- HTML → Markdown（反向转换） ---------- */
const MD_HEAD = { h1:'#', h2:'##', h3:'###', h4:'####', h5:'#####', h6:'######' };

function mdInline(n){
  let s = '';
  Array.prototype.forEach.call(n.childNodes, function(c){
    if(c.nodeType === 3){ s += c.textContent.replace(/\s+/g, ' '); return; }
    if(c.nodeType !== 1) return;
    const tag = c.tagName.toLowerCase();
    if(tag === 'br'){ s += '  \n'; return; }
    if(tag === 'input') return;                            // 任务勾选框在 li 里单独处理
    if(tag === 'code'){ s += '`' + c.textContent.replace(/\s+/g, ' ') + '`'; return; }
    if(tag === 'strong' || tag === 'b'){ s += '**' + mdInline(c) + '**'; return; }
    if(tag === 'em' || tag === 'i'){ s += '*' + mdInline(c) + '*'; return; }
    if(tag === 'img'){
      s += '![' + (c.getAttribute('alt') || '') + '](' + (c.getAttribute('src') || '') + ')';
      return;
    }
    if(tag === 'a'){
      const href = c.getAttribute('href') || '', t = mdInline(c);
      s += (href && href !== t) ? '[' + t + '](' + href + ')' : t;
      return;
    }
    s += mdInline(c);
  });
  return s;
}

function mdTable(t){
  const rows = Array.prototype.slice.call(t.querySelectorAll('tr'));
  if(!rows.length) return '';
  const cells = function(tr){
    return Array.prototype.map.call(tr.children, function(c){
      return mdInline(c).trim().replace(/\n+/g, ' ').replace(/\|/g, '\\|');
    });
  };
  const head = cells(rows[0]);
  const lines = [
    '| ' + head.join(' | ') + ' |',
    '| ' + head.map(function(){ return '---'; }).join(' | ') + ' |'
  ];
  rows.slice(1).forEach(function(tr){
    const c = cells(tr);
    while(c.length < head.length) c.push('');
    lines.push('| ' + c.join(' | ') + ' |');
  });
  return lines.join('\n');
}

function listMd(list, depth){
  const ordered = list.tagName.toLowerCase() === 'ol';
  const lines = [];
  let i = 0;
  Array.prototype.forEach.call(list.children, function(li){
    if(li.tagName.toLowerCase() !== 'li') return;
    let sub = [];
    Array.prototype.forEach.call(li.children, function(c){
      if(/^(ul|ol)$/i.test(c.tagName)) sub.push(c);
    });
    const work = li.cloneNode(true);
    Array.prototype.forEach.call(work.querySelectorAll('ul,ol'), function(x){ x.remove(); });
    const box = work.querySelector('input[type="checkbox"]');
    let marker;
    if(box){ marker = '- [' + ((box.hasAttribute('checked') || box.checked) ? 'x' : ' ') + ']'; }
    else{ i++; marker = ordered ? (i + '.') : '-'; }
    lines.push('  '.repeat(depth) + marker + ' ' + mdInline(work).trim());
    sub.forEach(function(s){ lines.push(listMd(s, depth + 1)); });
  });
  return lines.join('\n');
}

function mdBlock(n){
  if(n.nodeType === 3) return n.textContent.trim();
  if(n.nodeType !== 1) return '';
  const tag = n.tagName.toLowerCase();
  if(MD_HEAD[tag]) return MD_HEAD[tag] + ' ' + mdInline(n).trim();
  if(tag === 'p') return mdInline(n).trim();
  if(tag === 'pre'){
    return '```\n' + n.textContent.replace(/\n$/, '') + '\n```';
  }
  if(tag === 'blockquote'){
    return mdChildren(n).split('\n').map(function(l){ return l ? '> ' + l : '>'; }).join('\n');
  }
  if(tag === 'ul' || tag === 'ol') return listMd(n, 0);
  if(tag === 'hr') return '---';
  if(tag === 'table') return mdTable(n);
  if(tag === 'div' || tag === 'section' || tag === 'article' || tag === 'body') return mdChildren(n);
  return mdInline(n).trim();
}

function mdChildren(el){
  const out = [];
  Array.prototype.forEach.call(el.childNodes, function(c){
    const s = mdBlock(c);
    if(s) out.push(s);
  });
  return out.join('\n\n');
}

/* ---------- 单个文件 → {title, content} ---------- */
function firstLineIdx(lines){
  let i = 0;
  while(i < lines.length && !lines[i].trim()) i++;
  return i;
}

/* 导出时如果正文没有一级标题，会补一行「# 标题」；导回来要把它摘掉，
   否则正文会多出一个和标题重复的 H1 */
function mdToNote(text, title){
  const lines = stripBom(text).replace(/\r\n?/g, '\n').split('\n');
  const i = firstLineIdx(lines);
  const m = /^#\s+(.+?)\s*$/.exec(lines[i] || '');
  if(m && m[1].trim() === title){
    return { title:title, content:lines.slice(i + 1).join('\n').replace(/^\n+/, '').trim() };
  }
  return { title:title, content:lines.join('\n').trim() };
}

function txtToNote(text, title){
  const lines = stripBom(text).replace(/\r\n?/g, '\n').split('\n');
  const i = firstLineIdx(lines);
  if((lines[i] || '').trim() === title){
    return { title:title, content:lines.slice(i + 1).join('\n').replace(/^\n+/, '').trim() };
  }
  return { title:title, content:lines.join('\n').trim() };
}

function htmlToNote(text, fallbackTitle){
  const doc = new DOMParser().parseFromString(stripBom(text), 'text/html');
  const art = doc.querySelector('article.md') || doc.querySelector('article') || doc.body;
  const content = art ? mdChildren(art).trim() : '';
  let title = fallbackTitle;
  // 导出模板里的 H1 在 article 外面，剥掉置顶标记后当标题
  const h1 = doc.body ? doc.body.querySelector('h1') : null;
  if(h1 && art && !art.contains(h1)){
    const t = h1.textContent.replace(/^★\s*/, '').trim();
    if(t) title = t;
  }
  return { title:title, content:content };
}

/* ---------- 路径 → 文件夹 ---------- */
function packBaseName(p){
  const s = String(p).replace(/\\/g, '/');
  return s.slice(s.lastIndexOf('/') + 1);
}
function packDirSegs(p){
  const parts = String(p).replace(/\\/g, '/').split('/');
  parts.pop();
  return parts.filter(function(x){ return x && x !== '.'; });
}

/* 同父目录下已有同名文件夹就复用，避免反复导入堆出一排「工作」 */
function ensureFolder(cache, segs){
  if(!segs || !segs.length) return null;
  const key = segs.join('/');
  if(cache.has(key)) return cache.get(key);
  const parentId = ensureFolder(cache, segs.slice(0, -1));
  const name = segs[segs.length - 1];
  const ex = db.folders.find(function(f){
    return (f.parentId || null) === (parentId || null) && f.name === name;
  });
  let id;
  if(ex){ id = ex.id; }
  else{
    id = uid();
    db.folders.push({ id:id, name:name, parentId:parentId, color:0, createdAt:Date.now() });
  }
  cache.set(key, id);
  return id;
}

async function importPack(fileList){
  const files = Array.prototype.slice.call(fileList || []);
  let items = [], dropped = 0, badZip = 0;

  for(let i = 0; i < files.length; i++){
    const f = files[i];
    const rel = String(f.webkitRelativePath || f.name || '').replace(/\\/g, '/');
    if(/\.zip$/i.test(rel)){
      try{
        const got = await unzip(await f.arrayBuffer());
        items = items.concat(got.items);
        dropped += got.dropped;
      }catch(e){
        badZip++;
      }
      continue;
    }
    if(!PACK_EXT.test(rel)){ dropped++; continue; }
    try{ items.push({ path:rel, text:await f.text() }); }catch(e){ dropped++; }
  }

  items = items.filter(function(it){ return !PACK_SKIP.test(it.path); });

  if(!items.length){
    toast(badZip ? '压缩包没读出内容，试试换成「仅存储」再压缩' : '没找到可导入的 md / txt / html');
    return;
  }

  // 导出的包外面都套着一层「便签-时间戳」；所有文件都在同一个顶层目录下时把它剥掉
  const first = items[0].path;
  if(first.indexOf('/') > -1){
    const top = first.split('/')[0];
    const allIn = items.every(function(it){ return it.path.indexOf(top + '/') === 0; });
    if(allIn){
      items = items.map(function(it){ return { path:it.path.slice(top.length + 1), text:it.text }; });
    }
  }

  const ok = await confirmDialog('找到 ' + items.length + ' 个文件，将按目录结构导入。' +
    '同名文件夹会合并，标题和正文都一样的便签会跳过。继续？');
  if(!ok) return;

  const cache = new Map();
  const seen = new Set(db.notes.map(function(n){
    return (n.folderId || '') + '\u0000' + (n.title || '') + '\u0000' + (n.content || '');
  }));
  let base = db.notes.length ? Math.max.apply(null, db.notes.map(function(n){ return n.order; })) + 1 : 0;
  let added = 0, dup = 0;

  items.forEach(function(it){
    const name = packBaseName(it.path);
    const title = name.replace(PACK_EXT, '').trim() || '无标题';
    let r;
    if(/\.(html|htm)$/i.test(name))      r = htmlToNote(it.text, title);
    else if(/\.(md|markdown)$/i.test(name)) r = mdToNote(it.text, title);
    else                                  r = txtToNote(it.text, title);

    const fid = ensureFolder(cache, packDirSegs(it.path));
    const key = (fid || '') + '\u0000' + r.title + '\u0000' + r.content;
    if(seen.has(key)){ dup++; return; }
    seen.add(key);

    db.notes.push({
      id:uid(), folderId:fid, title:r.title, content:r.content,
      tags:[], pinned:false, order:base++,
      createdAt:Date.now(), updatedAt:Date.now()
    });
    added++;
  });

  normalize();
  save();
  ui.folderId = null;
  ui.tagFilter = null;
  render();

  if(!added){ toast('没有新便签，' + dup + ' 条都已经在了'); return; }
  toast('导入 ' + added + ' 条' + (dup ? '，跳过 ' + dup + ' 条重复' : '') +
        (dropped ? '，忽略 ' + dropped + ' 个非文本文件' : ''));
}

   8.5 预览态就地编辑
   预览里点哪一块就改哪一块：该块变成 contenteditable，改完把这一块
   重新序列化成 Markdown，只替换它对应的那几行源码，别处一概不动。
   好处是不用看满屏符号，也不至于像「整篇 WYSIWYG」那样一动就跑格式。
   ============================================================ */
let blockEdit = null;
let blockLock = false;     // 提交过程中别被 focusout 再打断一次

function updateEdTip(){
  const el = $('#edTip');
  if(!el) return;
