<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f2f2f7" id="metaTheme" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="便签" />
<meta name="format-detection" content="telephone=no" />
<title>便签</title>
<script>
/* 首屏就把主题和个性化样式定下来，避免先橙后蓝、先网格后斑马地闪一下。
   这段必须放在样式之前，且不能依赖下面任何函数。
   个性化全部落在 <html> 的 data-* 上，CSS 用属性选择器接管，见样式第 1 节。 */
(function(){
  var t = 'system', look = {};
  try{ t = localStorage.getItem('noteapp.theme') || 'system'; }catch(e){}
  try{ look = JSON.parse(localStorage.getItem('noteapp.look') || '{}') || {}; }catch(e){}
  var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var el = document.documentElement;
  el.dataset.theme = dark ? 'dark' : 'light';
  // 只写非默认值，属性越少越好排查
  if(look.accent && look.accent !== 'orange') el.dataset.accent = look.accent;
  if(look.table && look.table !== 'grid')    el.dataset.table  = look.table;
  if(look.code  && look.code  !== 'soft')    el.dataset.code   = look.code;
  if(look.size  && look.size  !== 'md')      el.dataset.md     = look.size;
  if(look.lh    && look.lh    !== 'normal')  el.dataset.lh     = look.lh;
  if(look.fzh   && look.fzh   !== 'sys')     el.dataset.fzh    = look.fzh;
  if(look.fen   && look.fen   !== 'sys')     el.dataset.fen    = look.fen;
})();
</script>
<style>
/* ============================================================
   1. 主题变量：只改这里就能换配色
   ============================================================ */
:root{
  --bg:#f2f2f7;
  --surface:#ffffff;
  --surface-2:#ececf1;
  --text:#1c1c1e;
  --t2:#8a8a8e;
  --line:rgba(60,60,67,.13);
  --accent:#e8890c;
  --accent-rgb:232,137,12;   /* 阴影、高亮这类要带透明度的场景，用 rgb 拼 */
  --soft:rgba(232,137,12,.12);
  --danger:#ff3b30;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  --bar:rgba(242,242,247,.86);
}
/* 深色：由 JS 写在 <html data-theme="dark"> 上，不再只用媒体查询 ——
   这样「手动选深色」和「跟随系统」走同一套变量，不会两处维护 */
:root[data-theme="dark"]{
  --bg:#000000;
  --surface:#1c1c1e;
  --surface-2:#2c2c2e;
  --text:#f2f2f7;
  --t2:#8e8e93;
  --line:rgba(255,255,255,.11);
  --accent:#ffa726;
  --accent-rgb:255,167,38;
  --soft:rgba(255,167,38,.16);
  --danger:#ff453a;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --bar:rgba(0,0,0,.78);
}

/* ---------- 主题色：只换 --accent / --soft / --accent-rgb ----------
   所有组件都引用变量，所以换一个属性，按钮、标签、勾选框、阴影全跟着走。
   深色下用更亮的一档，保证黑底上的对比度 */
:root[data-accent="blue"]{--accent:#1c7ed6; --accent-rgb:28,126,214; --soft:rgba(28,126,214,.13)}
:root[data-accent="green"]{--accent:#2f9e44; --accent-rgb:47,158,68; --soft:rgba(47,158,68,.13)}
:root[data-accent="grape"]{--accent:#9c36b5; --accent-rgb:156,54,181; --soft:rgba(156,54,181,.13)}
:root[data-accent="rose"]{--accent:#e64980; --accent-rgb:230,73,128; --soft:rgba(230,73,128,.13)}
:root[data-accent="teal"]{--accent:#0ca678; --accent-rgb:12,166,120; --soft:rgba(12,166,120,.13)}
:root[data-accent="indigo"]{--accent:#4c6ef5; --accent-rgb:76,110,245; --soft:rgba(76,110,245,.13)}
:root[data-accent="slate"]{--accent:#5c636a; --accent-rgb:92,99,106; --soft:rgba(92,99,106,.12)}
:root[data-theme="dark"][data-accent="blue"]{--accent:#4dabf7; --accent-rgb:77,171,247; --soft:rgba(77,171,247,.16)}
:root[data-theme="dark"][data-accent="green"]{--accent:#51cf66; --accent-rgb:81,207,102; --soft:rgba(81,207,102,.16)}
:root[data-theme="dark"][data-accent="grape"]{--accent:#cc5de8; --accent-rgb:204,93,232; --soft:rgba(204,93,232,.16)}
:root[data-theme="dark"][data-accent="rose"]{--accent:#ff87ab; --accent-rgb:255,135,171; --soft:rgba(255,135,171,.16)}
:root[data-theme="dark"][data-accent="teal"]{--accent:#38d9a9; --accent-rgb:56,217,169; --soft:rgba(56,217,169,.16)}
:root[data-theme="dark"][data-accent="indigo"]{--accent:#91a7ff; --accent-rgb:145,167,255; --soft:rgba(145,167,255,.16)}
:root[data-theme="dark"][data-accent="slate"]{--accent:#ced4da; --accent-rgb:206,212,218; --soft:rgba(206,212,218,.14)}

/* ---------- 便签皮肤：只覆盖颜色变量，子树里的组件全部自动跟着变 ----------
   生效范围是「挂了 data-skin 的元素及其子元素」，所以编辑器根节点和列表卡片共用同一套 */
[data-skin="cream"]{
  --bg:#f7efdc; --surface:#fffaf0; --surface-2:#f0e5cd;
  --text:#3a3327; --t2:#8a7c62; --line:rgba(90,75,50,.14);
  --bar:rgba(247,239,220,.88); --soft:rgba(200,140,30,.14);
}
[data-skin="mint"]{
  --bg:#e6f2ea; --surface:#f4fbf6; --surface-2:#dceee2;
  --text:#22352b; --t2:#6d8377; --line:rgba(40,80,60,.14);
  --bar:rgba(230,242,234,.88); --soft:rgba(40,140,90,.14);
}
[data-skin="rose"]{
  --bg:#f9e9ee; --surface:#fff7f9; --surface-2:#f3dde5;
  --text:#3d2830; --t2:#8d6c78; --line:rgba(120,60,80,.13);
  --bar:rgba(249,233,238,.88); --soft:rgba(200,80,120,.12);
}
[data-skin="sky"]{
  --bg:#e6eef8; --surface:#f5f9ff; --surface-2:#dbe7f5;
  --text:#22303f; --t2:#6b7c90; --line:rgba(50,80,120,.13);
  --bar:rgba(230,238,248,.88); --soft:rgba(50,120,200,.12);
}
[data-skin="sand"]{
  --bg:#efe8dd; --surface:#faf6f0; --surface-2:#e6dccc;
  --text:#382f26; --t2:#857864; --line:rgba(90,75,55,.14);
  --bar:rgba(239,232,221,.88); --soft:rgba(160,120,70,.14);
}
/* 变量只影响显式用 var() 的属性。文字颜色是「继承」下来的，
   所以挂皮肤的根节点必须自己重新取一次 --text，否则 input/卡片里的字还是主题色 */
[data-skin]{color:var(--text)}
:root[data-theme="dark"] [data-skin="cream"]{
  --bg:#241f17; --surface:#2d261c; --surface-2:#382f22;
  --text:#f0e6d2; --t2:#a99a80; --line:rgba(255,240,210,.12);
  --bar:rgba(36,31,23,.88); --soft:rgba(255,180,70,.15);
}
:root[data-theme="dark"] [data-skin="mint"]{
  --bg:#16241d; --surface:#1c2c23; --surface-2:#24382c;
  --text:#dfeee4; --t2:#8ba295; --line:rgba(220,255,235,.11);
  --bar:rgba(22,36,29,.88); --soft:rgba(90,220,160,.14);
}
:root[data-theme="dark"] [data-skin="rose"]{
  --bg:#271a1f; --surface:#312128; --surface-2:#3d2932;
  --text:#f4e2e8; --t2:#b1909c; --line:rgba(255,220,235,.11);
  --bar:rgba(39,26,31,.88); --soft:rgba(255,140,180,.14);
}
:root[data-theme="dark"] [data-skin="sky"]{
  --bg:#16202b; --surface:#1c2836; --surface-2:#243447;
  --text:#dfe9f5; --t2:#8ba0b6; --line:rgba(210,235,255,.11);
  --bar:rgba(22,32,43,.88); --soft:rgba(110,180,255,.14);
}
:root[data-theme="dark"] [data-skin="sand"]{
  --bg:#221d18; --surface:#2b241d; --surface-2:#362d24;
  --text:#ece2d4; --t2:#a2947f; --line:rgba(255,235,210,.11);
  --bar:rgba(34,29,24,.88); --soft:rgba(220,180,120,.14);
}

/* ============================================================
   2. 基础
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--f-en),var(--f-zh);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
  font-size:16px;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}

/* ============================================================
   3. 骨架
   ============================================================ */
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:640px; margin:0 auto;
  background:var(--bg);
}
.appbar{
  flex:none;
  position:relative; z-index:6;
  display:grid;
  grid-template-columns:88px 1fr 88px;
  align-items:center;
  padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;
  background:var(--bar);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:.5px solid var(--line);
}
.appbar h1{
  font-size:17px; font-weight:600; letter-spacing:.2px;
  text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.appbar-right{display:flex; justify-content:flex-end}
.appbar > .iconbtn{justify-self:start}
.iconbtn{
  width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center; color:var(--text);
  transition:background .15s;
  flex:none;
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn.on{color:var(--accent)}

.searchbar{
  position:absolute; inset:0; display:none; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;
  background:var(--bar);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
}
.searchbar.on{display:flex}
.searchbar input{
  flex:1; min-width:0;
  -webkit-appearance:none; appearance:none;
  border:0; outline:none;
  background:var(--surface-2);
  border-radius:10px; padding:8px 12px; font-size:16px;
}
.searchbar input::-webkit-search-cancel-button{-webkit-appearance:none}
.searchbar .cancel{font-size:15px; color:var(--accent); padding:0 4px; flex:none}

#view{
  flex:1; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:6px 16px calc(96px + env(safe-area-inset-bottom));
}

.tabbar{
  flex:none; display:flex;
  background:var(--bar);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border-top:.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; padding:7px 0 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:500; color:var(--t2);
  transition:color .15s;
}
.tab.on{color:var(--accent)}

.fab{
  position:fixed;
  right:max(18px, calc(50% - 320px + 18px));
  bottom:calc(72px + env(safe-area-inset-bottom));
  width:54px; height:54px; border-radius:50%;
  background:var(--accent); color:#fff;
  display:grid; place-items:center;
  box-shadow:0 8px 22px rgba(var(--accent-rgb),.42);
  z-index:8;
  transition:transform .15s;
}
.fab:active{transform:scale(.92)}

/* ============================================================
   4. 列表
   ============================================================ */
.sec{
  display:flex; align-items:center; gap:6px;
  margin:18px 2px 10px;
  font-size:12px; font-weight:600; color:var(--t2); letter-spacing:.4px;
}
.sec em{font-style:normal; font-weight:500; opacity:.65}
.sec .clear-tag{margin-left:auto; font-size:12px; font-weight:500; color:var(--accent)}

/* 标签筛选条 */
.tagbar{
  display:flex; gap:7px; overflow-x:auto; overflow-y:hidden;
  padding:8px 0 4px;
  margin:0 -16px; padding-left:16px; padding-right:16px;
  scrollbar-width:none;
}
.tagbar::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 11px; border-radius:999px;
  background:var(--surface); color:var(--text);
  font-size:12.5px; font-weight:500;
  box-shadow:var(--shadow);
  white-space:nowrap;
}
.chip.on{background:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(var(--accent-rgb),.3)}
.chip .num{opacity:.55; font-size:11px}

.folder-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.folder-card{
  position:relative;
  display:flex; flex-direction:column; gap:9px;
  background:var(--surface);
  border-radius:16px;
  padding:13px 10px 12px 13px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .12s;
}
.folder-card:active{transform:scale(.97)}
.fc-top{display:flex; align-items:center; justify-content:space-between; width:100%}
.fc-icon{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; flex:none}
.fc-name{
  font-size:14px; font-weight:600; line-height:1.35; word-break:break-all;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.fc-sub{font-size:11px; color:var(--t2); line-height:1.3}

.note-list{display:flex; flex-direction:column; gap:8px; position:relative}
.note-card{
  position:relative;
  display:flex; align-items:flex-start; gap:4px;
  background:var(--surface);
  border-radius:16px;
  padding:13px 8px 13px 14px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s;
  will-change:transform;
}.note-card:active{transform:scale(.985)}
/* 长按要用来触发拖拽，所以在这些元素上禁用文本选中和系统长按菜单 */
.note-card, .folder-card, .tree-row, .chip, .tab, .btn-primary, .sheet-item, .iconbtn{
  -webkit-user-select:none; -moz-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
.note-card.pinned{box-shadow:var(--shadow), inset 3px 0 0 var(--accent)}
.note-card.dragging{
  z-index:30;
  box-shadow:0 14px 34px rgba(0,0,0,.22);
  transform:scale(1.02);
  transition:none;
  cursor:grabbing;
}
.nc-main{flex:1; min-width:0}
.nc-main h3{
  font-size:15px; font-weight:600; line-height:1.4;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:5px;
}
.nc-main h3 span{overflow:hidden; text-overflow:ellipsis}
.pin-ico{color:var(--accent); flex:none; display:inline-flex; transform:rotate(35deg)}
.nc-main p{
  margin-top:3px; font-size:13px; color:var(--t2); line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.nc-time{margin-top:6px; font-size:11px; color:var(--t2)}

/* 批量选择 */
.sec-act{
  margin-left:auto; font-size:12px; font-weight:600; color:var(--accent);
  padding:3px 6px; border-radius:7px;
}
.sec-act:active{background:var(--soft)}
.note-card.sel-on{box-shadow:var(--shadow), inset 0 0 0 2px var(--accent)}
.sel-dot{
  position:absolute; left:11px; top:15px;
  width:20px; height:20px; border-radius:50%;
  border:1.6px solid var(--t2); background:var(--surface);
  display:grid; place-items:center; color:#fff;
}
.sel-dot svg{opacity:0; transition:opacity .12s}
.sel-dot.on{background:var(--accent); border-color:var(--accent)}
.sel-dot.on svg{opacity:1}
body.sel-mode .note-card{padding-left:42px}
body.sel-mode .note-card .more{display:none}
body.sel-mode .tabbar, body.sel-mode .fab, body.sel-mode #btnSearch{display:none}
body.sel-mode #view{padding-bottom:92px}
#selBar{
  position:fixed; left:0; right:0; bottom:0; z-index:70;
  display:none; gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--bar); backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
body.sel-mode #selBar{display:flex}
.sel-act{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 2px; border-radius:12px;
  font-size:11px; font-weight:500; color:var(--text);
}
.sel-act:active{background:var(--surface-2)}
.sel-act.danger{color:var(--danger)}
.sel-act:disabled{opacity:.35}
.note-tags{
  display:flex; gap:5px; margin-top:7px; overflow:hidden; max-height:20px;
}
.mini-tag{
  flex:none;
  font-size:11px; line-height:1.6;
  color:var(--accent); background:var(--soft);
  border-radius:6px; padding:0 7px;
  white-space:nowrap;
}
.mini-tag.more-tag{background:var(--surface-2); color:var(--t2)}

.more{
  flex:none; width:30px; height:30px; border-radius:8px;
  display:grid; place-items:center; color:var(--t2);
  transition:background .15s;
}
.more:active{background:var(--surface-2)}

/* 树视图 */
.tree{
  background:var(--surface);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:4px;
  overflow:hidden;
}
.tree-row{
  display:flex; align-items:center; gap:8px;
  padding:11px 10px; border-radius:12px;
  cursor:pointer;
  transition:background .15s;
}
.tree-row + .tree-row{box-shadow:inset 0 .5px 0 var(--line)}
.tree-row:active{background:var(--surface-2)}
.tr-icon{display:flex; flex:none}
.tr-name{flex:1; min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr-count{font-size:12px; color:var(--t2); flex:none}

/* 当前文件夹的目录大纲（文件夹 + 笔记全展开，可点击跳转） */
.outline-head{
  display:flex; align-items:center; gap:8px;
  width:100%; margin-top:10px;
  padding:11px 13px;
  background:var(--surface);
  border-radius:14px;
  box-shadow:var(--shadow);
  color:var(--text);
  font-size:13.5px; font-weight:600;
  text-align:left;
  -webkit-user-select:none; user-select:none;
}
.outline-head:active{background:var(--surface-2)}
.outline-head .oh-sub{
  margin-left:auto; font-weight:400; font-size:11.5px; color:var(--t2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.outline-head .oh-chev{flex:none; display:flex; color:var(--t2); transition:transform .18s}
.outline-head.on .oh-chev{transform:rotate(90deg)}
.outline{
  margin-top:8px; padding:5px;
  background:var(--surface);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.ol-row{
  display:flex; align-items:center; gap:7px;
  padding:8px 10px;
  border-radius:9px;
  font-size:13.5px;
  cursor:pointer;
}
.ol-row:active{background:var(--surface-2)}
.ol-row.folder{font-weight:600}
.ol-row.empty-row{color:var(--t2); cursor:default; font-weight:400; padding-left:12px}
.ol-ico{display:flex; flex:none; width:17px; justify-content:center}
.ol-mark{display:flex; flex:none; width:11px; justify-content:center; align-items:center}
.ol-dot{width:3px; height:3px; border-radius:50%; background:var(--t2); opacity:.6}
.ol-pin{display:flex; color:var(--accent); transform:rotate(35deg)}
.ol-name{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ol-name.untitled{color:var(--t2); font-weight:400}
.ol-num{font-size:11px; color:var(--t2); flex:none}

.empty{padding:64px 24px; text-align:center; color:var(--t2)}
.empty svg{opacity:.3; margin-bottom:14px}
.empty p{font-size:14px; margin-bottom:18px}
.btn-primary{
  background:var(--accent); color:#fff;
  border-radius:12px; padding:11px 22px;
  font-size:15px; font-weight:600;
  box-shadow:0 4px 12px rgba(var(--accent-rgb),.3);
}
.btn-primary:active{opacity:.85}

/* ============================================================
   5. 编辑器
   ============================================================ */
#editor{
  position:fixed; inset:0; z-index:40;
  display:flex; flex-direction:column;
  max-width:640px; margin:0 auto;
  background:var(--bg);
  transform:translateX(100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);
}
#editor.open{transform:none}
#editor:not(.open){pointer-events:none}
/* 编辑器顶栏右侧有三个按钮，收窄左列给中间留位置 */
#editor .appbar{grid-template-columns:44px 1fr auto}
.ed-path{
  font-size:12px; color:var(--t2); text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:0 4px;
}
#edTitle{
  flex:none; width:100%; border:0; outline:none; background:transparent;
  font-size:22px; font-weight:700; letter-spacing:.2px;
  padding:16px 20px 4px;
}
#edTitle::placeholder{color:var(--t2); opacity:.55}

/* 标签编辑区 */
#edTags{
  flex:none; display:flex; flex-wrap:wrap; gap:6px;
  padding:6px 20px 10px;
}
.ed-tag{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--soft); color:var(--accent);
  border-radius:8px; padding:3px 8px;
  font-size:12px; font-weight:500;
}
.ed-tag button{color:inherit; opacity:.65; display:flex; padding:0}
.ed-tag button:active{opacity:1}
.tag-add{
  display:inline-flex; align-items:center; gap:3px;
  border-radius:8px; padding:3px 9px;
  font-size:12px; color:var(--t2);
  border:1px dashed var(--line);
}

#edBody{
  flex:1; min-height:0; width:100%;
  border:0; outline:none; background:transparent; resize:none;
  font-size:16px; line-height:1.75;
  padding:4px 20px 24px;
  -webkit-overflow-scrolling:touch;
}
#edBody::placeholder{color:var(--t2); opacity:.55}

/* Markdown 预览 */
/* 字号 / 行距走变量，设置面板只切 <html data-md> / <html data-lh> 就能整体缩放。
   标题用 em 而不是 px，缩放时层级比例才不会走样 */
/* 正文字体：中文和英文各一组，用系统字体族而不是内嵌字体文件。
   中文字体动辄几 MB，base64 塞进单文件 HTML 会把它撑成几十 MB，
   APK 和首屏都受不了；系统字体族能覆盖住想要的观感差异 */
:root{
  --f-zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --f-en:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-fzh="song"]{--f-zh:"Songti SC",STSong,SimSun,"Noto Serif CJK SC","Source Han Serif SC",serif}
:root[data-fzh="kai"]{--f-zh:"Kaiti SC",STKaiti,KaiTi,"Noto Serif CJK SC",serif}
:root[data-fzh="round"]{--f-zh:"Yuanti SC",YouYuan,"Hiragino Maru Gothic ProN","Microsoft YaHei",sans-serif}
:root[data-fzh="hei"]{--f-zh:"Heiti SC",STHeiti,"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
:root[data-fen="serif"]{--f-en:Georgia,"Times New Roman",Times,serif}
:root[data-fen="humanist"]{--f-en:"Trebuchet MS",Verdana,"Segoe UI",sans-serif}
:root[data-fen="book"]{--f-en:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}

:root{--md-size:15.5px; --md-lh:1.75}
:root[data-md="sm"]{--md-size:14.5px}
:root[data-md="lg"]{--md-size:17px}
:root[data-lh="tight"]{--md-lh:1.62}
:root[data-lh="loose"]{--md-lh:1.92}

#edPreview{
  flex:1; min-height:0; overflow-y:auto;
  padding:4px 20px 24px;
  font-size:var(--md-size); line-height:var(--md-lh);
  display:none;
}
#editor.preview #edBody{display:none}
#editor.preview #edPreview{display:block}
#editor.preview #edTitle{opacity:.9}
/* 预览态下如果还没写标题，别把「标题」这个占位符顶在最上面 */
#editor.preview #edTitle:placeholder-shown{display:none}
/* 正文首行已经是同名大标题时，顶部标题框不再重复一遍 */
#editor.preview.dup-title #edTitle{display:none}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{font-weight:700; line-height:1.4; margin:18px 0 8px}
.md-body h1{font-size:1.55em; margin-top:6px}
.md-body h2{font-size:1.3em}
.md-body h3{font-size:1.1em}
.md-body h4{font-size:1.03em}
.md-body h5,.md-body h6{font-size:.98em; font-weight:600; margin:14px 0 6px}
.md-body p{margin:0 0 12px}
.md-body ul,.md-body ol{margin:0 0 12px; padding-left:22px}
.md-body li{margin:3px 0}
.md-body blockquote{
  margin:0 0 12px; padding:2px 0 2px 12px;
  border-left:3px solid var(--accent);
  color:var(--t2);
}
.md-body code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.9em;
  background:var(--surface-2); border-radius:5px; padding:1px 5px;
}
.md-body pre{
  background:var(--surface-2); border-radius:10px;
  padding:12px 14px; overflow-x:auto; margin:0 0 12px;
}
.md-body pre code{background:none; padding:0; font-size:.85em; line-height:1.6}
/* 代码块样式：终端（深色）/ 描边（透明底）/ 色条（左侧强调线） */
:root[data-code="dark"] .md-body pre{
  background:#1b1b1f; color:#e9e9ee;
  border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
:root[data-code="dark"] .md-body pre code{color:inherit}
:root[data-code="line"] .md-body pre{
  background:transparent;
  border:1px solid var(--line);
}
:root[data-code="bar"] .md-body pre{
  background:var(--surface-2);
  border-left:3px solid var(--accent);
  border-radius:4px 10px 10px 4px;
}
/* ---------- 代码块语法高亮 ----------
   默认给深色字配浅底（柔和 / 描边 / 色条三种样式）；
   深色主题、以及强制深底的「终端」样式各写一份亮色配色。
   两套都是照 VS Code 的 token 色系调的，只是把对比度往上提了一点 */
.md-body .hl-c{color:#6e7781; font-style:italic}   /* 注释 */
.md-body .hl-s{color:#a31515}                       /* 字符串 */
.md-body .hl-k{color:#0b5cad}                       /* 关键字 */
.md-body .hl-t{color:#267f99}                       /* 类型 / 标签 */
.md-body .hl-n{color:#098658}                       /* 数字 */
.md-body .hl-f{color:#795e26}                       /* 函数 / 方法 */
.md-body .hl-l{color:#0000d0}                       /* true / null 等字面量 */
.md-body .hl-p{color:#7a3e9d}                       /* 属性 / 键名 */
:root[data-theme="dark"] .md-body .hl-c,
:root[data-code="dark"]  .md-body .hl-c{color:#6a9955}
:root[data-theme="dark"] .md-body .hl-s,
:root[data-code="dark"]  .md-body .hl-s{color:#ce9178}
:root[data-theme="dark"] .md-body .hl-k,
:root[data-code="dark"]  .md-body .hl-k{color:#569cd6}
:root[data-theme="dark"] .md-body .hl-t,
:root[data-code="dark"]  .md-body .hl-t{color:#4ec9b0}
:root[data-theme="dark"] .md-body .hl-n,
:root[data-code="dark"]  .md-body .hl-n{color:#b5cea8}
:root[data-theme="dark"] .md-body .hl-f,
:root[data-code="dark"]  .md-body .hl-f{color:#dcdcaa}
:root[data-theme="dark"] .md-body .hl-l,
:root[data-code="dark"]  .md-body .hl-l{color:#569cd6}
:root[data-theme="dark"] .md-body .hl-p,
:root[data-code="dark"]  .md-body .hl-p{color:#9cdcfe}
/* 行内代码也跟着着色：这里只上色不上斜体，不然一行里全是斜的 */
.md-body code .hl-c{font-style:normal}

/* ---------- 行内格式 ---------- */
.md-body u{text-decoration:underline; text-underline-offset:2px}
.md-body mark{
  background:rgba(var(--accent-rgb),.24); color:inherit;
  padding:.06em .22em; border-radius:4px;
}
.md-body sup,.md-body sub{font-size:.74em; line-height:0}

.md-body hr{border:0; border-top:1px solid var(--line); margin:18px 0}
.md-body a{color:var(--accent); text-decoration:none}
.md-body strong{font-weight:700}
.md-body .md-empty{color:var(--t2); font-size:14px}
/* 表格：手机上列多时整块横向滚动，不把正文撑宽 */
.md-body .md-table{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 0 12px}
.md-body table{border-collapse:collapse; width:100%; font-size:.87em; line-height:1.55}
.md-body th,.md-body td{
  border:1px solid var(--line); padding:6px 9px;
  text-align:left; vertical-align:top; word-break:break-word;
  /* 给每列一个下限，否则窄屏上短列会被长内容挤成一行一个字 */
  min-width:7.2em;
}
.md-body th{background:var(--surface-2); font-weight:600; white-space:nowrap}
/* 表格样式：斑马（隔行浅色）/ 横线（只留横线）/ 卡片（外框圆角 + 强调表头） */
:root[data-table="zebra"] .md-body th,
:root[data-table="zebra"] .md-body td{border:0; border-bottom:1px solid var(--line)}
:root[data-table="zebra"] .md-body tbody tr:nth-child(2n) td{background:rgba(var(--accent-rgb),.07)}
:root[data-table="line"] .md-body th,
:root[data-table="line"] .md-body td{border:0; border-bottom:1px solid var(--line)}
:root[data-table="line"] .md-body th{
  background:transparent; border-bottom:1.5px solid var(--accent);
}
:root[data-table="card"] .md-body .md-table{
  border:1px solid var(--line); border-radius:12px;
}
:root[data-table="card"] .md-body th,
:root[data-table="card"] .md-body td{border:0; border-bottom:1px solid var(--line)}
:root[data-table="card"] .md-body tr:last-child td{border-bottom:0}
:root[data-table="card"] .md-body th{background:var(--soft); color:var(--accent)}
.md-body .ta-c{text-align:center}
.md-body .ta-r{text-align:right}
.md-body .ta-l{text-align:left}
.md-body img{max-width:100%; height:auto; border-radius:8px; vertical-align:middle}
.md-body li.task{list-style:none; margin-left:-17px}
.md-body li.task input{
  -webkit-appearance:none; appearance:none;
  width:15px; height:15px; margin:0 7px 0 0;
  vertical-align:-2px; opacity:1; position:relative;
  border:1.5px solid var(--t2); border-radius:4px; background:transparent;
}
.md-body li.task input:checked{background:var(--accent); border-color:var(--accent)}
.md-body li.task input:checked::after{
  content:''; position:absolute; left:4px; top:0.5px;
  width:4px; height:8px; border:solid #fff;
  border-width:0 2px 2px 0; transform:rotate(45deg);
}
.md-body ul ul,.md-body ul ol,.md-body ol ul,.md-body ol ol{margin:3px 0}

/* 预览态就地编辑：鼠标悬停给个淡底，点下去整块变成可编辑。
   描边用 outline 而不是 border，免得一加边框整段文字被挤得跳一下 */
/* 只过渡阴影：background 一旦加了过渡，切换代码块样式时会先闪一帧旧底色 */
.md-body [data-bs]{border-radius:6px; transition:box-shadow .12s}
@media (hover:hover){
  #editor.preview .md-body [data-bs]:hover{
    background:rgba(var(--accent-rgb),.07);
    box-shadow:0 0 0 6px rgba(var(--accent-rgb),.07);
    cursor:text;
  }
}
#editor.preview .md-body [contenteditable="true"]{
  outline:2px solid var(--accent); outline-offset:5px;
  background:rgba(var(--accent-rgb),.07);
  box-shadow:none; cursor:text;
}
#editor.preview .md-body [contenteditable="true"] a{pointer-events:none}
#editor.preview .md-body li.task input{cursor:pointer; pointer-events:auto}
#edTip{display:none; font-size:11px; font-weight:400; color:var(--t2); margin-left:8px}
#editor.preview #edTip{display:inline}
#edTip.on{color:var(--accent)}
/* 编辑中的代码块不要被 hover 底色盖住行内高亮 */
#editor.preview .md-body pre[contenteditable="true"]{background:var(--surface-2)}

/* 格式工具栏：只在源码编辑态出现，横向滚动。
   放在正文和底栏之间 —— 手机上正好贴着键盘，不用把手指挪到屏幕顶上 */
#edFmt{
  flex:none; display:none; align-items:center; gap:2px;
  padding:5px 10px; overflow-x:auto; scrollbar-width:none;
  border-top:.5px solid var(--line);
  -webkit-overflow-scrolling:touch;
}
#edFmt::-webkit-scrollbar{display:none}
/* 只在源码编辑态出现：预览态和查找态都让位给正文 */
#editor.open:not(.preview):not(.finding) #edFmt{display:flex}
#edFmt button{
  flex:none; display:inline-flex; align-items:center; justify-content:center;
  min-width:33px; height:31px; padding:0 7px;
  border-radius:8px; color:var(--text); font-size:13.5px; line-height:1;
}
#edFmt button:active{background:var(--surface-2)}
#edFmt button.on{background:var(--soft); color:var(--accent)}
#edFmt .sep{flex:none; width:1px; height:18px; margin:0 3px; background:var(--line)}
#edFmt .b{font-weight:800; font-size:15px}
#edFmt .i{font-style:italic; font-family:Georgia,serif; font-size:15px}
#edFmt .u{text-decoration:underline; text-underline-offset:2px; font-size:15px}
#edFmt .s{text-decoration:line-through; font-size:15px}
#edFmt .mk{
  background:rgba(var(--accent-rgb),.24); border-radius:4px;
  padding:1px 5px; font-size:12.5px;
}

/* 便签内查找 */
#edFind{display:none; flex-direction:column; gap:5px; padding:0 10px 10px}
#editor.finding #edFind{display:flex}
#edFind .frow{display:flex; align-items:center; gap:4px}
#editor.finding #edFind{display:flex}
#edFind input{
  flex:1; min-width:0;
  -webkit-appearance:none; appearance:none;
  border:0; outline:none;
  background:var(--surface-2); color:var(--text);
  border-radius:10px; padding:8px 12px; font-size:15px;
}
#edFind input::-webkit-search-cancel-button{-webkit-appearance:none}
#edFind .cnt{
  flex:none; min-width:40px; text-align:center;
  font-size:12px; color:var(--t2);
  font-variant-numeric:tabular-nums;
}
#edFind .nav{
  width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center; color:var(--text); flex:none;
}
#edFind .nav:disabled{opacity:.28}
#edFind .nav:active:not(:disabled){background:var(--surface-2)}
#edFind .done{flex:none; font-size:15px; color:var(--accent); padding:0 4px}
#edFind .rep{flex:none; font-size:13px; color:var(--accent); padding:0 6px; white-space:nowrap}
#edFind .rep:disabled{color:var(--t2); opacity:.5}
#edRepRow .fill{flex:1; min-width:0}

/* 颜色选择面板 */
.cc-row{display:flex; flex-wrap:wrap; gap:10px; padding:2px 0 12px}
.cc{
  width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
  color:#fff; font-size:13.5px; font-weight:700;
}
.cc:active{transform:scale(.94)}
.cc-reset{
  font-size:13px; color:var(--accent);
  padding:6px 2px;
}

#edFindView{
  display:none; flex:1; min-height:0; overflow-y:auto;
  padding:4px 20px 24px;
  font-size:16px; line-height:1.75;
  white-space:pre-wrap; word-break:break-word;
  -webkit-overflow-scrolling:touch;
}
#editor.finding #edFindView{display:block}
#editor.finding #edBody,
#editor.finding #edPreview{display:none}
#edFindView mark{
  background:rgba(var(--accent-rgb),.25); color:inherit;
  border-radius:3px; padding:1px 0;
}
#edFindView mark.cur{background:var(--accent); color:var(--surface)}
#edFindView .ph{color:var(--t2); font-size:14px}

/* 列表里搜索命中的高亮 */
mark.hl{
  background:rgba(var(--accent-rgb),.26); color:inherit;
  border-radius:3px; padding:0 1px; font-weight:inherit;
}


.ed-foot{
  flex:none; display:flex; justify-content:space-between; align-items:center;
  padding:4px 14px calc(4px + env(safe-area-inset-bottom));
  font-size:11px; color:var(--t2);
  border-top:.5px solid var(--line);
}
.ed-undo{display:flex; align-items:center; gap:1px}
.ed-undo #edCount{margin-left:6px}
.ubtn{
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border:0; background:none; padding:0; border-radius:9px;
  color:var(--t2); -webkit-tap-highlight-color:transparent;
}
.ubtn:active:not(:disabled){background:var(--surface-2); color:var(--text)}
.ubtn:disabled{opacity:.25}

/* ============================================================
   6. 菜单 / 对话框 / 提示
   ============================================================ */
#sheetRoot{position:fixed; inset:0; z-index:60; display:none}
#sheetRoot.open{display:block}
.mask{position:absolute; inset:0; background:rgba(0,0,0,.42)}
.sheet{
  position:absolute; left:0; right:0; bottom:0;
  max-width:640px; margin:0 auto;
  max-height:82vh; overflow-y:auto;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  padding:6px 8px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.18);
}
#sheetRoot.open .sheet{animation:sheetUp .26s cubic-bezier(.32,.72,0,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h4{font-size:13px; font-weight:600; color:var(--t2); margin:14px 14px 6px}
.sheet-item{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:14px; border-radius:12px;
  font-size:15px; text-align:left;
  transition:background .12s;
}
.sheet-item:active{background:var(--surface-2)}
.sheet-item.danger{color:var(--danger)}
.sheet-item:disabled{opacity:.32}

/* 历史版本列表 */
.hist-now{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:12px; color:var(--t2);
  padding:6px 2px 10px;
}
.hist-list{display:flex; flex-direction:column; gap:1px; margin:0 -8px}
.hist-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left; font:inherit;
  border:0; background:none; padding:9px 8px; border-radius:12px;
  color:var(--text); -webkit-tap-highlight-color:transparent;
}
.hist-item:active{background:var(--surface-2)}
.hist-item svg{color:var(--t2); flex:none}
.hist-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.hist-time{font-size:13.5px}
.hist-snip{font-size:12px; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hist-len{font-size:11px; color:var(--t2); flex:none}
.sheet-item.on{color:var(--accent)}
.pick-desc{margin-left:auto; color:var(--t2); font-size:12px}
.pick-ok{margin-left:8px; display:flex; color:var(--accent)}

/* 皮肤选择：3 列色卡 */
.skin-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  padding:2px 12px 6px;
}
.skin-cell{
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  padding:13px 6px 11px;
  border-radius:14px;
  border:1.5px solid transparent;
  background:var(--surface-2);
  transition:border-color .15s, background .15s;
}
.skin-cell.on{border-color:var(--accent); background:var(--soft)}
.skin-dot{
  width:34px; height:34px; border-radius:50%;
  box-shadow:inset 0 0 0 1px var(--line), 0 1px 4px rgba(0,0,0,.12);
}
.skin-name{font-size:12px; color:var(--text)}
.skin-ok{position:absolute; top:7px; right:7px; display:none; color:var(--accent)}
.skin-cell.on .skin-ok{display:flex}

/* 个性化面板：预览样片 + 分段按钮 + 色点行 */
.look-pv{
  margin:2px 12px 4px; padding:10px 12px 2px;
  background:var(--surface-2); border-radius:12px;
  font-size:13px; line-height:1.62;
  max-height:190px; overflow:hidden;
}
.look-pv .md-body{padding:0}
.look-pv .md-body p{margin:0 0 8px}
.look-pv .md-body th,.look-pv .md-body td{min-width:0; padding:4px 7px}
.look-pv .md-body pre{margin:0 0 8px; padding:8px 10px}
.look-pv .md-body pre code{font-size:.82em}
.look-tip{
  padding:0 14px 2px; font-size:12px; line-height:1.5; color:var(--t2);
}
.seg{display:flex; gap:6px; padding:0 12px 2px}
.seg button{
  flex:1; min-width:0;
  padding:9px 4px; border-radius:10px;
  background:var(--surface-2); color:var(--text);
  font-size:13px; text-align:center;
  border:1.5px solid transparent;
  transition:border-color .15s, background .15s, color .15s;
}
.seg button.on{
  border-color:var(--accent); background:var(--soft);
  color:var(--accent); font-weight:600;
}

  palette:'<path d="M12 3.6c-4.7 0-8.4 3.7-8.4 8.4s3.7 8.4 8.4 8.4c1.3 0 2.2-.9 2.2-2 0-.5-.2-.9-.5-1.2-.3-.3-.4-.7-.4-1.1 0-1 .8-1.7 1.7-1.7h1.7c2.1 0 3.7-1.6 3.7-3.7 0-3.9-3.7-7.1-8.4-7.1z"/><circle cx="8.2" cy="10.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="7.9" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.8" cy="10.2" r="1.15" fill="currentColor" stroke="none"/>'

function icon(name, size=22, sw=1.8){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+PATH[name]+'</svg>';
}

/* ============================================================
   1. 数据层
     folder = { id, name, parentId, color, createdAt }
     note   = { id, folderId, title, content, tags[], pinned, order, createdAt, updatedAt }
   ============================================================ */
const STORE_KEY = 'noteapp.v1';

/* 版本号：改这里，build-apk.sh 会拿它和 build.gradle 的 versionName 对账，不一致就拒绝打包 */
const APP_VERSION = '1.9.0';

/* 便签皮肤：目前只有纯色。颜色定义在 CSS 的 [data-skin="…"] 里，
   sw 只用来画选择面板上的色点 */
const SKINS = [
  { id:'default', name:'默认', sw:'linear-gradient(135deg,#ffffff 50%,#1c1c1e 50%)' },
  { id:'cream',   name:'米黄', sw:'#f7efdc' },
  { id:'mint',    name:'薄荷', sw:'#e6f2ea' },
  { id:'rose',    name:'樱粉', sw:'#f9e9ee' },
  { id:'sky',     name:'天青', sw:'#e6eef8' },
  { id:'sand',    name:'沙褐', sw:'#efe8dd' }
];

/* ---------- 个性化设置 ----------
   主题色、新建便签默认皮肤、Markdown 样式（表格 / 代码块 / 字号 / 行距）。
   全部落到 <html> 的 data-* 属性上，由 CSS 属性选择器接管 —— 跟主题、皮肤
   的驱动方式保持一致：改一个属性，所有引用变量的组件自动跟着变。 */
const LOOK_KEY = 'noteapp.look';
const LOOK_DEF = { accent:'orange', skin:'default', table:'grid', code:'soft',
                   size:'md', lh:'normal', fzh:'sys', fen:'sys' };
let look = Object.assign({}, LOOK_DEF);
try{
  const savedLook = JSON.parse(localStorage.getItem(LOOK_KEY) || '{}');
  if(savedLook && typeof savedLook === 'object'){
    Object.keys(LOOK_DEF).forEach(function(k){ if(savedLook[k]) look[k] = savedLook[k]; });
  }
}catch(e){}

/* 主题色：只决定 --accent，浅色/深色两档色值在 CSS 里各写一份 */
const ACCENTS = [
  { id:'orange', name:'琥珀', sw:'#e8890c' },
  { id:'blue',   name:'海蓝', sw:'#1c7ed6' },
  { id:'green',  name:'松绿', sw:'#2f9e44' },
  { id:'grape',  name:'葡萄', sw:'#9c36b5' },
  { id:'rose',   name:'玫瑰', sw:'#e64980' },
  { id:'teal',   name:'青碧', sw:'#0ca678' },
  { id:'indigo', name:'靛青', sw:'#4c6ef5' },
  { id:'slate',  name:'石墨', sw:'#5c636a' }
];
const LOOK_TABLES = [
  { id:'grid',  name:'网格' },
  { id:'zebra', name:'斑马' },
  { id:'line',  name:'横线' },
  { id:'card',  name:'卡片' }
];
const LOOK_CODES = [
  { id:'soft', name:'柔和' },
  { id:'dark', name:'终端' },
  { id:'line', name:'描边' },
  { id:'bar',  name:'色条' }
];
const LOOK_SIZES = [{ id:'sm', name:'小' }, { id:'md', name:'标准' }, { id:'lg', name:'大' }];
/* 字体用系统字体族而不是内嵌字体文件：一套中文字体动辄几 MB，
   base64 塞进单文件 HTML 会把它撑到几十 MB，首屏和 APK 都受不了 */
const LOOK_FZHS = [
  { id:'sys',   name:'系统' },
  { id:'song',  name:'宋体' },
  { id:'kai',   name:'楷体' },
  { id:'round', name:'圆体' },
  { id:'hei',   name:'黑体' }
];
const LOOK_FENS = [
  { id:'sys',     name:'系统' },
  { id:'serif',   name:'衬线' },
  { id:'humanist',name:'人文' },
  { id:'book',    name:'书籍' }
];
const LOOK_LHS   = [{ id:'tight', name:'紧凑' }, { id:'normal', name:'标准' }, { id:'loose', name:'宽松' }];

function applyLook(){
  const el = document.documentElement;
  // 等于默认值就不写属性，CSS 里「没有属性」即默认样式
  const put = function(attr, val, def){
    if(!val || val === def) el.removeAttribute(attr);
    else el.setAttribute(attr, val);
  };
  put('data-accent', look.accent, 'orange');
  put('data-table',  look.table,  'grid');
  put('data-code',   look.code,   'soft');
  put('data-md',     look.size,   'md');
  put('data-lh',     look.lh,     'normal');
  put('data-fzh',    look.fzh,    'sys');
  put('data-fen',    look.fen,    'sys');
}
function setLook(key, val){
  look[key] = val;
  try{ localStorage.setItem(LOOK_KEY, JSON.stringify(look)); }catch(e){}
  applyLook();
}

const COLORS = [
  {c:'#e8890c', rgb:'232,137,12'},
  {c:'#2f9e44', rgb:'47,158,68'},
  {c:'#1c7ed6', rgb:'28,126,214'},
  {c:'#9c36b5', rgb:'156,54,181'},
  {c:'#e8590c', rgb:'232,89,12'},
  {c:'#0ca678', rgb:'12,166,120'}
];
function tint(col){
  const a = isDark() ? 0.26 : 0.13;
  return 'rgba(' + col.rgb + ',' + a + ')';
}

let db = { folders: [], notes: [] };

const THEME_KEY = 'noteapp.theme';
let savedTheme = 'system';
try{ savedTheme = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}

let ui = { view:'notes', folderId:null, searching:false, query:'', editingId:null,
           tagFilter:null, preview:false, suppressClick:false, outlineOn:false,
           selMode:false, sel:new Set(),
           theme:savedTheme };

/* 主题：light / dark / system 三种，system 时实时跟随系统 */
function isDark(){
  return document.documentElement.dataset.theme === 'dark';
}
function applyTheme(){
  const t = ui.theme || 'system';
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.getElementById('metaTheme');
  if(m) m.setAttribute('content', dark ? '#000000' : '#f2f2f7');
}
function setTheme(t){
  ui.theme = t;
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  applyTheme();
  render();
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad = n => String(n).padStart(2,'0');

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.folders) && Array.isArray(d.notes)) db = d;
    }
  }catch(e){ console.warn('本地数据读取失败', e); }
  if(!db.folders.length && !db.notes.length) seed();
  normalize();
  save();
}
/* 兼容旧版本数据：补齐 tags / pinned / order */
function normalize(){
  db.folders.forEach(f => { if(typeof f.color !== 'number') f.color = 0; });
  db.notes.forEach((n, i) => {
    if(!Array.isArray(n.tags)) n.tags = [];
    if(typeof n.pinned !== 'boolean') n.pinned = false;
    if(typeof n.order !== 'number') n.order = i;
    // 皮肤是后加的字段，老数据没有；已删除的皮肤 id 也在这里清掉
    if(n.skin && !SKINS.some(s => s.id === n.skin)) n.skin = null;
    // 历史版本：导入的 JSON 可能是脏数据，只留结构正确的项
    if(n.history !== undefined && !Array.isArray(n.history)) n.history = [];
    if(Array.isArray(n.history)){
      n.history = n.history.filter(function(h){
        return h && typeof h === 'object' && typeof h.content === 'string';
      }).map(function(h){
        return { at: Number(h.at) || Date.now(), title: String(h.title || ''), content: String(h.content || '') };
      });
      trimHistory(n.history);
    }
  });
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); return; }
  catch(e){}
  // 存不下多半是历史版本占的地方 —— 正文优先，先清历史再试一次
  let dropped = false;
  db.notes.forEach(function(n){ if(n.history && n.history.length){ n.history = []; dropped = true; } });
  if(dropped){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(db));
      toast('空间不足，已清空历史版本');
      return;
    }catch(e2){}
  }
  toast('存储空间不足，建议导出备份');
}

/* ---------- 查询 ---------- */
const getFolder = id => db.folders.find(f => f.id === id) || null;
const subFolders = pid =>
  db.folders
    .filter(f => (f.parentId || null) === (pid || null))
    .sort((a,b) => a.name.localeCompare(b.name, 'zh-Hans-CN'));

/* 排序：置顶 → 手动顺序 → 最近更新 */
function sortNotes(list){
  return list.slice().sort((a,b) => {
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if(a.order !== b.order) return a.order - b.order;
    return b.updatedAt - a.updatedAt;
  });
}
const notesIn = fid => sortNotes(db.notes.filter(n => (n.folderId || null) === (fid || null)));

function descendantIds(fid){
  const out = [fid], stack = [fid];
  while(stack.length){
    const cur = stack.pop();
    db.folders.forEach(f => {
      if(f.parentId === cur && !out.includes(f.id)){ out.push(f.id); stack.push(f.id); }
    });
  }
  return out;
}
function countNotesDeep(fid){
  if(!fid) return db.notes.length;
  const ids = descendantIds(fid);
  return db.notes.filter(n => ids.includes(n.folderId)).length;
}
function folderPathText(fid){
  if(!fid) return '未分类';
  const arr = [];
  let cur = getFolder(fid), guard = 0;
  while(cur && guard++ < 50){ arr.unshift(cur.name); cur = cur.parentId ? getFolder(cur.parentId) : null; }
  return arr.join(' / ');
}
/* 全库标签统计 */
function allTags(){
  const m = new Map();
  db.notes.forEach(n => n.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return Array.from(m.entries()).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hans-CN'));
}

/* ---------- 时间 ---------- */
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const same = x => x.getFullYear()===d.getFullYear() && x.getMonth()===d.getMonth() && x.getDate()===d.getDate();
  if(same(now)) return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if(same(y)) return '昨天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if(d.getFullYear() === now.getFullYear()) return (d.getMonth()+1) + '月' + d.getDate() + '日';
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
}
function fmtFull(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function stamp(){
  const d = new Date();
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
}

/* 先列这一层的笔记，再展开子文件夹 —— 每条笔记都紧贴它的父文件夹，
   否则"文件夹A的笔记"会漂到"文件夹A的子文件夹"后面，看着像孙子 */
function folderContent(fid, depth){
  // 层级太深时缩进封顶，避免长名字被挤到只剩几个字
  const pad = 10 + Math.min(depth, 8) * 16;
  let h = noteRows(fid, pad);

        '<span class="ol-name">' + esc(f.name) + '</span>' +
        '<span class="ol-num">' + (n ? n + ' 条' : '空') + '</span>' +
      '</div>' +
      folderContent(f.id, depth + 1);
  });
  return h;
}

function noteRows(fid, pad){
  return notesIn(fid).map(function(n){

/* 把 Markdown 正文压成纯文本摘要（列表里显示用） */
function plainText(md){
  return String(md || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^\s{0,3}#{1,6}\s+/gm, '')
    .replace(/^\s{0,3}>\s?/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/^\s*\d+[.)]\s+/gm, '')
    .replace(/(\*\*|__)(.*?)\1/g, '$2')
    .replace(/~~(.*?)~~/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
}

/* 把命中的关键词包成 <mark>（先转义再加标签，顺序不能反） */
function hlText(text, q){
  const t = String(text == null ? '' : text);
  const lq = String(q == null ? '' : q).toLowerCase();
  if(!lq) return esc(t);
  const lower = t.toLowerCase();
  let out = '', i = 0;
  while(true){
    const k = lower.indexOf(lq, i);
    if(k < 0){ out += esc(t.slice(i)); break; }
    out += esc(t.slice(i, k)) + '<mark class="hl">' + esc(t.slice(k, k + lq.length)) + '</mark>';
    i = k + lq.length;
  }
  return out;
}

/* 搜索时正文摘要只截命中附近的一段，而不是永远从开头截 */
function snippetAround(text, q, before, after){
  const t = String(text || '');
  if(!t) return t;
  const ql = String(q || '').toLowerCase();
  const k = ql ? t.toLowerCase().indexOf(ql) : -1;
  if(k < 0) return t.length > 90 ? t.slice(0, 90) + '…' : t;
  const b = before || 16, a = after || 46;
  const s = Math.max(0, k - b);
  const e = Math.min(t.length, k + ql.length + a);
  return (s > 0 ? '…' : '') + t.slice(s, e) + (e < t.length ? '…' : '');
}

function noteCard(n, showPath, q){
  const title = n.title || '无标题';
  const body = snippetAround(plainText(n.content), q);
  const meta = fmtTime(n.updatedAt) + (showPath ? ' · ' + folderPathText(n.folderId) : '');
  const tags = n.tags || [];
  const shown = tags.slice(0, 3);
  const rest = tags.length - shown.length;

  let tagsHtml = '';
  if(tags.length){
    tagsHtml = '<div class="note-tags">' +
      shown.map(t => '<span class="mini-tag">#' + esc(t) + '</span>').join('') +
      (rest > 0 ? '<span class="mini-tag more-tag">+' + rest + '</span>' : '') +
      '</div>';
  }
  const picked = ui.selMode && ui.sel.has(n.id);
  return '<div class="note-card' + (n.pinned ? ' pinned' : '') + (picked ? ' sel-on' : '') + '"' +
      (n.skin ? ' data-skin="' + n.skin + '"' : '') +
      ' data-open-note="' + n.id + '" data-drag-note="' + n.id + '">' +
      (ui.selMode ? '<span class="sel-dot' + (picked ? ' on' : '') + '">' + icon('check',12,3.2) + '</span>' : '') +
      '<div class="nc-main">' +
        '<h3>' + (n.pinned ? '<i class="pin-ico">' + icon('pin',13,2) + '</i>' : '') +
          '<span>' + hlText(title, q) + '</span></h3>' +
        (body ? '<p>' + hlText(body, q) + '</p>' : '') +
        tagsHtml +
        '<div class="nc-time">' + esc(meta) + '</div>' +
      '</div>' +
      '<button class="more" data-more-note="' + n.id + '">' + icon('more',18) + '</button>' +
    '</div>';
}

function treeRows(pid, depth){

function viewSearch(){
  const q = ui.query.toLowerCase();

/* ============================================================
   3. Markdown 渲染（轻量，自写，无依赖）
   ============================================================ */
/* Markdown 渲染
   支持：ATX / setext 标题、段落与硬换行、粗体 / 斜体 / 删除线、行内代码、
   围栏代码块、引用（内部可再放列表或表格）、有序 / 无序 / 任务列表（多级）、
   GFM 表格（含 :--: 对齐）、链接、图片、自动链接、分割线、反斜杠转义。
   所有文本先 esc()，链接与图片只放行 http(s)/mailto，避免 XSS。 */
/* ============================================================
   3.4 代码块语法高亮
   ------------------------------------------------------------
   自己写而不是引 prism/highlight.js：这个 App 是单文件、零依赖，
   为一个代码块拖进 30KB 的库不划算。用单遍扫描而不是层层 replace —
   先替换字符串再替换关键字，字符串里的关键字会被二次着色，颜色就串了。
   ============================================================ */
function hlWords(str){
  const o = Object.create(null);
  String(str || '').split(/\s+/).forEach(function(w){ if(w) o[w] = 1; });
  return o;
}

function hlDef(o){
  return {
    line: o.line || [],
    block: o.block || [],
    quotes: o.quotes || '\'"',
    triple: o.triple || [],
    multiline: o.multiline || [],
    kw: hlWords(o.kw),
    types: hlWords(o.types),
    lit: hlWords(o.lit),
    prop: !!o.prop,
    tag: !!o.tag,
    ci: !!o.ci
  };
}
