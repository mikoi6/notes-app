/* 文本节点里的 Markdown 元字符要转义，否则「a*b」这种内容改完再渲染就跑版 */
/* 把浏览器规范化过的颜色（rgb(...) / #abc）转回 #rrggbb。
   就地编辑提交时要从 DOM 的 inline style 里把颜色捞回来 */
function cssColorHex(v){
  v = String(v || '').trim();
  if(!v) return null;
  let m = v.match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
  if(m) return '#' + m[1].toLowerCase();
  m = v.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if(m){
    return '#' + [1, 2, 3].map(function(k){
      return ('0' + Math.min(255, +m[k]).toString(16)).slice(-2);
    }).join('');
  }
  return null;
}

function mdEscInline(t){
  return String(t).replace(/\u00a0/g, ' ').replace(/([\\`*_\[\]])/g, '\\$1');
}

/* DOM → 行内 Markdown。块级子节点（列表 / 代码块 / 表格）由各自的函数处理 */
function mdInlineSrc(node){
  let out = '';
  Array.prototype.forEach.call(node.childNodes, function(ch){
    if(ch.nodeType === 3){ out += mdEscInline(ch.nodeValue); return; }
    if(ch.nodeType !== 1) return;
    const tag = ch.tagName.toLowerCase();
    if(tag === 'br'){ out += '\\\n'; return; }              // 硬换行
    if(tag === 'input'){ return; }                           // 任务勾选框不写进正文
    if(tag === 'ul' || tag === 'ol' || tag === 'pre' ||
       tag === 'table' || tag === 'blockquote'){ return; }
    if(tag === 'code'){
      const t = String(ch.textContent || '').replace(/\n/g, ' ');
      if(!t) return;
      const q = t.indexOf('`') > -1 ? '``' : '`';
      out += q + (q === '``' ? ' ' + t + ' ' : t) + q;
      return;
    }
    if(tag === 'strong' || tag === 'b'){ out += '**' + mdInlineSrc(ch) + '**'; return; }
    if(tag === 'em' || tag === 'i'){ out += '*' + mdInlineSrc(ch) + '*'; return; }
    if(tag === 'del' || tag === 's' || tag === 'strike'){ out += '~~' + mdInlineSrc(ch) + '~~'; return; }
    if(tag === 'u'){ out += '<u>' + mdInlineSrc(ch) + '</u>'; return; }
    if(tag === 'sup'){ out += '<sup>' + mdInlineSrc(ch) + '</sup>'; return; }
    if(tag === 'sub'){ out += '<sub>' + mdInlineSrc(ch) + '</sub>'; return; }
    if(tag === 'mark'){
      // 没带颜色就还原成 == 短语法，带颜色的保留标签
      const bg = cssColorHex(ch.style.backgroundColor || ch.style.background);
      const txt = mdInlineSrc(ch);
      out += bg ? '<mark style="background:' + bg + '">' + txt + '</mark>' : '==' + txt + '==';
      return;
    }
    if(tag === 'span'){
      const co = cssColorHex(ch.style.color);
      const txt = mdInlineSrc(ch);
      out += co ? '<span style="color:' + co + '">' + txt + '</span>' : txt;
      return;
    }
    if(tag === 'a'){
      const href = ch.getAttribute('href') || '';
      const txt = mdInlineSrc(ch);
      if(!href){ out += txt; return; }
      out += (txt === href ? '<' + href + '>' : '[' + txt + '](' + href + ')');
      return;
    }
    if(tag === 'img'){
      out += '![' + mdEscInline(ch.getAttribute('alt') || '') + '](' + (ch.getAttribute('src') || '') + ')';
      return;
    }
    out += mdInlineSrc(ch);
  });
  return out;
}

/* 列表：按缩进递归，任务项还原成 - [ ] / - [x] */
function mdListSrc(el, indent, out){
  const pad = new Array(indent + 1).join(' ');
  const ordered = el.tagName === 'OL';
  let num = parseInt(el.getAttribute('start') || '1', 10) || 1;
  Array.prototype.forEach.call(el.children, function(li){
    if(li.tagName !== 'LI') return;
    const isTask = li.classList.contains('task');
    let mark;
    if(isTask){
      const cb = li.querySelector('input[type="checkbox"]');
      mark = '- [' + (cb && cb.checked ? 'x' : ' ') + ']';
    }else{
      mark = ordered ? (num++) + '.' : '-';
    }
    // 任务项的勾选框后面自带一个空格，直接拼会变成「- [x]  已完成」
    const parts = String(mdInlineSrc(li)).replace(/^[ \t]+/, '').split('\n');
    out.push(pad + mark + ' ' + parts[0]);
    for(let k = 1; k < parts.length; k++) out.push(pad + '   ' + parts[k]);
    Array.prototype.forEach.call(li.children, function(ch){
      if(ch.tagName === 'UL' || ch.tagName === 'OL') mdListSrc(ch, indent + 2, out);
    });
  });
}

function mdTableSrc(box){
  const tb = box.tagName === 'TABLE' ? box : box.querySelector('table');
  if(!tb) return null;
  const rows = Array.prototype.slice.call(tb.querySelectorAll('tr'));
  if(!rows.length) return null;
  const cell = function(c){
    return mdInlineSrc(c).replace(/\n/g, ' ').replace(/\|/g, '\\|').trim();
  };
  const headCells = Array.prototype.slice.call(rows[0].children);
  const head = headCells.map(cell);
  const cols = Math.max(1, head.length);
  const aligns = headCells.map(function(c){
    if(c.classList.contains('ta-c')) return 'c';
    if(c.classList.contains('ta-r')) return 'r';
    if(c.classList.contains('ta-l')) return 'l';
    return '';
  });
  const line = function(cells){
    const v = [];
    for(let k = 0; k < cols; k++) v.push(k < cells.length && cells[k] ? cells[k] : ' ');
    return '| ' + v.join(' | ') + ' |';
  };
  const out = [line(head), '| ' + aligns.map(function(a){
    return a === 'c' ? ':---:' : a === 'r' ? '---:' : a === 'l' ? ':---' : '---';
  }).join(' | ') + ' |'];
  rows.slice(1).forEach(function(tr){
    out.push(line(Array.prototype.map.call(tr.children, cell)));
  });
  return out;
}

function mdPreSrc(el){
  const code = el.tagName === 'CODE' ? el : (el.querySelector('code') || el);
  // 编辑器里回车可能落成 <br>，textContent 拿不到换行，innerText 才准
  let t = (typeof code.innerText === 'string' && code.innerText) ? code.innerText : (code.textContent || '');
  t = String(t).replace(/\u00a0/g, ' ').replace(/\n+$/, '');
  return ['```'].concat(t.split('\n')).concat(['```']);
}

function mdQuoteSrc(bq){
  const lines = [];
  Array.prototype.forEach.call(bq.children, function(ch){
    if(ch.tagName === 'UL' || ch.tagName === 'OL') mdListSrc(ch, 0, lines);
    else if(ch.tagName === 'PRE') mdPreSrc(ch).forEach(function(x){ lines.push(x); });
    else mdInlineSrc(ch).split('\n').forEach(function(x){ lines.push(x); });
  });
  return lines.map(function(l){ return l ? '> ' + l : '>'; });
}

function blockSrcLines(el){
  const tag = el.tagName;
  if(tag === 'PRE') return mdPreSrc(el);
  // 居中段落写成一行 -> 文字 <-，和解析端一一对应
  if(tag === 'P' && el.classList.contains('ta-c')){
    return ['-> ' + mdInlineSrc(el).replace(/\n/g, ' ').trim() + ' <-'];
  }
  if(tag === 'UL' || tag === 'OL'){ const out = []; mdListSrc(el, 0, out); return out; }
  if(tag === 'BLOCKQUOTE') return mdQuoteSrc(el);
  if(el.classList.contains('md-table') || tag === 'TABLE') return mdTableSrc(el);
  if(/^H[1-6]$/.test(tag)){
    const hashes = new Array(+tag.charAt(1) + 1).join('#');
    return mdInlineSrc(el).split('\n').map(function(t, k){
      return k === 0 ? (hashes + ' ' + t.trim()).replace(/\s+$/, '') : t;
    });
  }
  return mdInlineSrc(el).split('\n');
}

function placeCaret(el, ev){
  try{
    const sel = window.getSelection();
    let r = null;
    if(ev && document.caretRangeFromPoint){
      r = document.caretRangeFromPoint(ev.clientX, ev.clientY);
    }
    if(r && el.contains(r.startContainer)){
      sel.removeAllRanges(); sel.addRange(r);
      return;
    }
    const end = document.createRange();
    end.selectNodeContents(el); end.collapse(false);
    sel.removeAllRanges(); sel.addRange(end);
  }catch(e){ /* 定位失败就退化成末尾，别让编辑开不起来 */ }
}

function startBlockEdit(el, ev){
  if(!ui.preview || blockLock) return;
  if(el.tagName === 'HR' || el.classList.contains('md-empty')) return;
  if(blockEdit) commitBlockEdit();

  const bs = +el.dataset.bs, be = +el.dataset.be;
  if(!(be > bs)) return;
  // 用 bs/be 回查当前 DOM 里的那一块：上一次提交后节点已经换过一批
  const live = $('#edPreview').querySelector('[data-bs="' + bs + '"][data-be="' + be + '"]');
  if(!live) return;
  el = live;

  if(el.classList.contains('md-table')){
    el.querySelectorAll('th,td').forEach(function(c){ c.setAttribute('tabindex', '-1'); });
  }
  /* 代码块先把高亮拆成纯文本：在 span 里打字颜色不会跟着变，
     光标还容易钻进某个 token 中间，编辑起来比没有着色还难受 */
  if(el.tagName === 'PRE'){
    const cd = el.querySelector('code');
    if(cd) cd.innerHTML = esc(cd.textContent);
  }

  blockEdit = { el: el, bs: bs, be: be, scroll: $('#edPreview').scrollTop };
  el.setAttribute('contenteditable', 'true');
  el.classList.add('blk-edit');
  el.spellcheck = false;
  el.focus();
  placeCaret(el, ev);
  updateEdTip();
}

function commitBlockEdit(){
  if(!blockEdit || blockLock) return;
  const el = blockEdit.el, bs = blockEdit.bs, be = blockEdit.be, sc = blockEdit.scroll;
  blockLock = true;
  let lines = null;
  try{ lines = blockSrcLines(el); }catch(e){ lines = null; }
  el.removeAttribute('contenteditable');
  el.classList.remove('blk-edit');
  blockEdit = null;

  if(lines){
    const ta = $('#edBody');
    const src = ta.value.split('\n');
    if(be <= src.length){
      const text = src.slice(0, bs).concat(lines, src.slice(be)).join('\n');
      if(text !== ta.value){
        undoSnapshot();
        ta.value = text;
        updateCount();
        commitEdits();
      }
    }
  }
  renderPreview();
  $('#edPreview').scrollTop = sc;
  blockLock = false;
  updateEdTip();
}

function cancelBlockEdit(){
  if(!blockEdit || blockLock) return;
  const el = blockEdit.el, sc = blockEdit.scroll;
  el.removeAttribute('contenteditable');
  blockEdit = null;
  renderPreview();
  $('#edPreview').scrollTop = sc;
  updateEdTip();
}

/* 点任务勾选框直接把源码里的 [ ] / [x] 翻过来，不用进编辑态 */
function toggleTaskBox(box){
  const blk = box.closest('[data-bs]');
  if(!blk) return;
  const bs = +blk.dataset.bs, be = +blk.dataset.be;
  const boxes = Array.prototype.slice.call(blk.querySelectorAll('input[type="checkbox"]'));
  const k = boxes.indexOf(box);
  const ta = $('#edBody');
  const lines = ta.value.split('\n');
  const sc = $('#edPreview').scrollTop;
  let seen = -1;
  for(let i = bs; i < be && i < lines.length; i++){
    if(!/^\s*[-*+]\s+\[[ xX]\]/.test(lines[i])) continue;
    seen++;
    if(seen !== k) continue;
    lines[i] = lines[i].replace(/\[([ xX])\]/, function(_, c){ return c === ' ' ? '[x]' : '[ ]'; });
    undoSnapshot();
    ta.value = lines.join('\n');
    updateCount();
    commitEdits();
    renderPreview();
    $('#edPreview').scrollTop = sc;
    return;
  }
}

$('#edPreview').addEventListener('click', function(e){
  if(!ui.preview || blockLock) return;
  // 链接照常打开，别被「点一下就编辑」拦下来
  if(e.target.closest('a')) return;
  const box = e.target.closest('input[type="checkbox"]');
  if(box){ e.preventDefault(); toggleTaskBox(box); return; }
  if(blockEdit && blockEdit.el.contains(e.target)) return;
  const blk = e.target.closest('[data-bs]');
  if(!blk) return;
  // 已经拖选了一段文字，说明想复制而不是改，放过
  const sel = window.getSelection();
  if(sel && String(sel).trim()) return;
  startBlockEdit(blk, e);
});

$('#edPreview').addEventListener('keydown', function(e){
  if(!blockEdit) return;
  if(e.key === 'Escape'){ e.preventDefault(); cancelBlockEdit(); return; }
  const el = blockEdit.el;

  if(e.key === 'Enter'){
    // 表格里回车 = 收工；标题回车也是收工（不然会把标题拆两半）
    if(el.classList.contains('md-table') || /^H[1-6]$/.test(el.tagName)){
      e.preventDefault(); commitBlockEdit(); return;
    }
    if(el.tagName === 'PRE' || el.tagName === 'UL' ||
       el.tagName === 'OL' || el.tagName === 'BLOCKQUOTE') return;   // 交给浏览器
    // 段落里回车写成硬换行，保证「一个块 = 一段源码」，不会把后面的行挤乱
    e.preventDefault();
    document.execCommand('insertLineBreak');
    return;
  }

  if(e.key === 'Tab' && el.classList.contains('md-table')){
    e.preventDefault();
    const cells = Array.prototype.slice.call(el.querySelectorAll('th,td'));
    const nxt = cells[cells.indexOf(document.activeElement) + (e.shiftKey ? -1 : 1)];
    if(nxt){ nxt.focus(); placeCaret(nxt); }
    else commitBlockEdit();
  }
});

// 粘贴只取纯文本，免得把别的网页的字体、颜色整套搬进来
$('#edPreview').addEventListener('paste', function(e){
  if(!blockEdit) return;
  e.preventDefault();
  const t = ((e.clipboardData || window.clipboardData).getData('text/plain') || '');
  document.execCommand('insertText', false, t);
});

$('#edPreview').addEventListener('focusout', function(){
  if(!blockEdit || blockLock) return;
  setTimeout(function(){
    if(!blockEdit || blockLock) return;
    if(!blockEdit.el.contains(document.activeElement)) commitBlockEdit();
  }, 0);
});

/* ============================================================
   8.6 批量选择
   ============================================================ */
function selBarHtml(){
  return '<button class="sel-act" data-sel="all">' + icon('check',20,2.2) + '<span>全选</span></button>' +
         '<button class="sel-act" data-sel="move">' + icon('move',20,1.9) + '<span>移动</span></button>' +
         '<button class="sel-act" data-sel="skin">' + icon('palette',20,1.8) + '<span>皮肤</span></button>' +
         '<button class="sel-act danger" data-sel="del">' + icon('trash',20,1.9) + '<span>删除</span></button>';
}

const BACK_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>';
const X_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function visibleNoteIds(){
  return Array.prototype.map.call(
    document.querySelectorAll('#view .note-card[data-drag-note]'),
    function(c){ return c.dataset.dragNote; }
  );
}

function setSelMode(on){
  ui.selMode = !!on;
  if(!ui.selMode) ui.sel.clear();
  $('#btnBack').innerHTML = ui.selMode ? X_ICON : BACK_ICON;
  render();
  updateSelBar();
}

function toggleSel(id){
  if(ui.sel.has(id)) ui.sel.delete(id);
  else ui.sel.add(id);
  render();
  updateSelBar();
}

function updateSelBar(){
  const bar = $('#selBar');
  if(!bar) return;
  const ids = visibleNoteIds();
  const allOn = ids.length > 0 && ids.every(function(id){ return ui.sel.has(id); });
  const all = bar.querySelector('[data-sel="all"] span');
  if(all) all.textContent = allOn ? '取消全选' : '全选';
  ['move','skin','del'].forEach(function(k){
    const b = bar.querySelector('[data-sel="' + k + '"]');
    if(b) b.disabled = ui.sel.size === 0;
  });
}

function selAll(){
  const ids = visibleNoteIds();
  const allOn = ids.length > 0 && ids.every(function(id){ return ui.sel.has(id); });
  ui.sel.clear();
  if(!allOn) ids.forEach(function(id){ ui.sel.add(id); });
  render();
  updateSelBar();
}

function selMove(){
  const ids = Array.from(ui.sel);
  if(!ids.length) return;
  pickFolder('移动 ' + ids.length + ' 条便签到…', new Set(), function(target){
    const now = Date.now();
    ids.forEach(function(id){
      const n = db.notes.find(x => x.id === id);
      if(n){ n.folderId = target; n.updatedAt = now; }
    });
    save();
    setSelMode(false);
    toast('已移动到「' + folderPathText(target) + '」');
  });
}

function selSkin(){
  const ids = Array.from(ui.sel);
  if(!ids.length) return;
  openSkinPicker(ids);
}

function selDelete(){
  const ids = Array.from(ui.sel);
  if(!ids.length) return;
  confirmDialog('删除选中的 ' + ids.length + ' 条便签？此操作无法撤销。').then(function(ok){
    if(!ok) return;
    const hit = new Set(ids);
    db.notes = db.notes.filter(function(n){ return !hit.has(n.id); });
    save();
    setSelMode(false);
    toast('已删除 ' + ids.length + ' 条');
  });
}

function selPin(on){
  const ids = Array.from(ui.sel);
  if(!ids.length) return;
  ids.forEach(function(id){
    const n = db.notes.find(x => x.id === id);
    if(n) n.pinned = on;
  });
  save();
  setSelMode(false);
  toast(on ? '已置顶 ' + ids.length + ' 条' : '已取消置顶');
}

function selTag(){
  const ids = Array.from(ui.sel);
  if(!ids.length) return;
  promptDialog('给 ' + ids.length + ' 条便签加标签', '标签名（不用带 #）').then(function(t){
    if(!t) return;
    ids.forEach(function(id){
      const n = db.notes.find(x => x.id === id);
      if(n && n.tags.indexOf(t) === -1) n.tags.push(t);
    });
    save();
    setSelMode(false);
    toast('已加 #' + t);
  });
}

function openSelMenu(){
  const n = ui.sel.size;
  if(!n){ toast('先选几条便签'); return; }
  menuItems('已选 ' + n + ' 条', [
    { icon:'pin', label:'置顶', onClick:function(){ selPin(true); } },
    { icon:'pin', label:'取消置顶', onClick:function(){ selPin(false); } },
    { icon:'tag', label:'加标签', onClick:selTag }
  ]);
}

$('#selBar').innerHTML = selBarHtml();
$('#selBar').addEventListener('click', function(e){
  const b = e.target.closest('[data-sel]');
  if(!b || b.disabled) return;
  const k = b.dataset.sel;
  if(k === 'all') selAll();
  else if(k === 'move') selMove();
  else if(k === 'skin') selSkin();
  else if(k === 'del') selDelete();
});

/* ============================================================
   9. 事件
   ============================================================ */
$('#view').addEventListener('click', function(e){
  if(ui.suppressClick){ ui.suppressClick = false; return; }

  // 多选态下点卡片 = 勾选/取消勾选，不再打开便签
  if(e.target.closest('[data-sel-mode]')){
    if(ui.selMode){ setSelMode(false); return; }
    if(!db.notes.length){ toast('还没有便签'); return; }
    ui.view = 'notes';
    setSelMode(true);
    return;
  }
  if(ui.selMode){
    const card0 = e.target.closest('[data-drag-note]');
    if(card0) toggleSel(card0.dataset.dragNote);
    return;
  }

  const mNote = e.target.closest('[data-more-note]');
  if(mNote) return openNoteMenu(mNote.dataset.moreNote);

  const mFolder = e.target.closest('[data-more-folder]');
  if(mFolder) return openFolderMenu(mFolder.dataset.moreFolder);

  const oNote = e.target.closest('[data-open-note]');
  if(oNote){
    const nid = oNote.dataset.openNote;
    // 从搜索进来是要定位关键词去改，直接进编辑，省得预览闪一下又切走
    openEditor(nid, !!(ui.searching && ui.query));
    // 从搜索结果点进来，直接把关键词带进便签内查找
    if(ui.searching && ui.query) setTimeout(function(){ openFind(ui.query); }, 300);
    return;
  }

  if(e.target.closest('[data-toggle-outline]')){
    ui.outlineOn = !ui.outlineOn;
    render();
    return;
  }

  const oFolder = e.target.closest('[data-open-folder]');
  if(oFolder){
    ui.folderId = oFolder.dataset.openFolder;
    ui.view = 'notes';
    ui.tagFilter = null;
    render();
    $('#view').scrollTop = 0;
    return;
  }
  const chip = e.target.closest('[data-tag]');
  if(chip){
    ui.tagFilter = chip.dataset.tag;
    ui.searching = false;
    render();
    $('#view').scrollTop = 0;
    return;
  }
  if(e.target.closest('[data-clear-tag]')){
    ui.tagFilter = null;
    render();
    return;
  }
  if(e.target.closest('[data-new-note]'))   return newNote();
  if(e.target.closest('[data-new-folder]')) return newFolder(ui.folderId);
  if(e.target.closest('[data-go-root]')){
    ui.folderId = null;
    ui.view = 'notes';
    render();
  }
});

/* 拖拽：pointer 事件在列表容器上委托 */
const viewEl = $('#view');
viewEl.addEventListener('pointerdown', function(e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  dragStart(e);
}, { passive:true });

window.addEventListener('pointermove', function(e){
  if(!drag.el) return;
  if(!drag.active){
    // 长按判定期间：移动过多就取消
    if(Math.abs(e.clientX - drag.startX) > 8 || Math.abs(e.clientY - drag.startY) > 8){
      clearTimeout(drag.timer);
      drag.el = null;
    }
    return;
  }
  e.preventDefault();
  dragMove(e);
}, { passive:false });

window.addEventListener('pointerup', function(){
  if(drag.active) dragEnd();
  else { clearTimeout(drag.timer); drag.el = null; }
  setTimeout(function(){ ui.suppressClick = false; }, 320);
}, { passive:true });

window.addEventListener('pointercancel', dragCancel, { passive:true });
// 拖拽中阻止页面滚动
document.addEventListener('touchmove', function(e){
  if(drag.active) e.preventDefault();
}, { passive:false });

$('#btnSearch').onclick = function(){
  ui.searching = true;
  ui.tagFilter = null;
  $('#searchBar').classList.add('on');
  $('#searchInput').value = '';
  ui.query = '';
  render();
  setTimeout(function(){ $('#searchInput').focus(); }, 50);
};
$('#searchInput').addEventListener('input', function(e){
  ui.query = e.target.value.trim();
  render();
});
$('#searchCancel').onclick = function(){
  ui.searching = false;
  ui.query = '';
  $('#searchBar').classList.remove('on');
  render();
};

$('#btnMenu').onclick = function(){
  if(ui.selMode) return openSelMenu();
  openMainMenu();
};
$('#btnFab').onclick = function(){
  menuItems('新建', [
    { icon:'note',   label:'新建便签',   onClick:newNote },
    { icon:'folder', label:'新建文件夹', onClick:function(){ newFolder(ui.folderId); } }
  ]);
};

/* 编辑器 */
$('#edBack').onclick = closeEditor;
$('#edTitle').addEventListener('input', function(){ maybeUndoSnapshot(); scheduleSave(); if(ui.preview) renderPreview(); });
$('#edBody').addEventListener('input', function(){ maybeUndoSnapshot(); scheduleSave(); updateCount(); if(ui.preview) renderPreview(); });

/* ---------- 粘贴到标题：一大段文字直接进正文 ----------
   新建便签时多半是「先把东西粘进来」，手快就粘在标题上了。
   这时得自己剪切 → 点正文 → 再粘一次，纯属白费手脚。
   只拦两件事，其余照常粘：带换行的（标题本来就装不下），和超过 40 字的
   （不会有人把一整段话当标题）。整段就是一个网址的例外——书签便签的标题
   本来就是那个链接，长也合理。
   阈值就这一个数，觉得太松或太紧改这里。 */
const TITLE_PASTE_MAX = 40;

function pasteGoesToBody(text){
  const t = String(text || '').replace(/\r\n?/g, '\n').trim();
  if(!t) return false;
  if(t.indexOf('\n') !== -1) return true;                    // 多行，标题里放不下
  if(t.length <= TITLE_PASTE_MAX) return false;              // 短标题，照常粘
  if(/^(https?:\/\/|www\.)\S+$/i.test(t)) return false;      // 整段就是一个网址
  return true;
}

$('#edTitle').addEventListener('paste', function(e){
  const data = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  // 拿不到剪贴板内容（老 WebView）就别拦，拦了会把粘的东西吞掉
  if(!pasteGoesToBody(data)) return;
  e.preventDefault();
  const body = $('#edBody');
  // 正文里已经有东西就接在末尾。光标停在标题上，不存在「插在这儿」，
  // 与其猜一个位置，不如给一个每次都一样的落点
  if(body.value && !/\n$/.test(body.value)) body.value += '\n\n';
  body.value += data.replace(/\r\n?/g, '\n');
  maybeUndoSnapshot();
  updateCount();
  scheduleSave();
  // 放进正文却还停在预览，屏幕上什么都没变，看着像是没粘上
  if(ui.preview) setPreview(false);
  body.focus();
  body.setSelectionRange(body.value.length, body.value.length);
  toast('已放进正文');
});

$('#edUndo').onclick = doUndo;
$('#edRedo').onclick = doRedo;

// Ctrl/Cmd + Z 撤回，Ctrl + Shift + Z 或 Ctrl + Y 重做
document.addEventListener('keydown', function(e){
  if(!$('#editor').classList.contains('open')) return;
  if(!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const ae = document.activeElement;
  // 便签内查找框里交给浏览器自己处理
  if(ae && ae.id === 'edFindInput') return;
  const k = (e.key || '').toLowerCase();
  if(k === 'z' && !e.shiftKey){ e.preventDefault(); doUndo(); }
  else if((k === 'z' && e.shiftKey) || k === 'y'){ e.preventDefault(); doRedo(); }
});

$('#edTags').addEventListener('click', function(e){
  const del = e.target.closest('[data-del-tag]');
  if(del){
    const n = db.notes.find(x => x.id === ui.editingId);
    if(!n) return;
    n.tags = n.tags.filter(t => t !== del.dataset.delTag);
    n.updatedAt = Date.now();
    save(); renderTags(); setSaved('已保存');
    return;
  }
  if(e.target.closest('#edAddTag')) addTags();
});

/* 预览/编辑的切换只留这一个入口：按钮、打开便签、进入查找全走它，
   否则状态、图标、DOM 类各改一遍，迟早对不上 */
function setPreview(on){
  const prev = $('#edPreview'), body = $('#edBody');
  // 切走之前先把没提交的就地编辑落盘，否则那块改动会被重渲染吞掉
  if(!on && blockEdit) commitBlockEdit();
  // 两边高度差很多，只能按滚动比例带过去；不带的话读到一半点「编辑」会跳回顶部
  const fromEl = ui.preview ? prev : body;
  const fromMax = fromEl.scrollHeight - fromEl.clientHeight;
  const ratio = fromMax > 0 ? fromEl.scrollTop / fromMax : 0;

  ui.preview = !!on;
  const btn = $('#edPreviewBtn');
  $('#editor').classList.toggle('preview', ui.preview);
  btn.classList.toggle('on', ui.preview);
  btn.setAttribute('aria-label', ui.preview ? '编辑' : '预览');
  btn.innerHTML = icon(ui.preview ? 'edit' : 'eye', 21, 1.9);
  if(ui.preview) renderPreview();
  updateUndoBtns();
  updateEdTip();

  const toEl = ui.preview ? prev : body;
  const toMax = toEl.scrollHeight - toEl.clientHeight;
  if(toMax > 0 && ratio > 0) toEl.scrollTop = toMax * ratio;
}
$('#edPreviewBtn').onclick = function(){ setPreview(!ui.preview); };
function renderPreview(){
  $('#edPreview').innerHTML = '<div class="md-body">' + mdToHtml($('#edBody').value, true) + '</div>';
  // 正文第一行往往就是「# 和标题同名」的大标题，这时顶部标题框会让同一句话出现两遍。
  // 预览态把它让出来，编辑态照常显示，改标题进编辑即可
  const h = $('#edPreview').querySelector('h1');
  const t = ($('#edTitle').value || '').trim();
  $('#editor').classList.toggle('dup-title', !!(h && t && h.textContent.trim() === t));
}

/* 便签内查找 */
$('#edFindBtn').onclick = function(){ find.on ? closeFind() : openFind(''); };
$('#edFindClose').onclick = closeFind;
$('#edFindPrev').onclick = function(){ gotoFind(-1); };
$('#edFindNext').onclick = function(){ gotoFind(1); };
$('#edRepOne').onclick = replaceOne;
$('#edRepAll').onclick = replaceAllHits;
// 替换框里回车 = 替换这一处并跳到下一处，连续敲回车就一路替下去
$('#edRepInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); replaceOne(); }
  if(e.key === 'Escape'){ e.preventDefault(); closeFind(); }
});
$('#edFindInput').addEventListener('input', function(){ renderFind(true); });
$('#edFindInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); gotoFind(e.shiftKey ? -1 : 1); }
  if(e.key === 'Escape'){ e.preventDefault(); closeFind(); }
});
$('#edFindView').addEventListener('click', function(e){
  const m = e.target.closest('mark[data-fi]');
  if(!m) return;
  find.idx = Number(m.dataset.fi);
  markFindCur();
  updateFindCount();
});

$('#edMore').onclick = function(){
  const n = db.notes.find(x => x.id === ui.editingId);
  if(!n) return;
  menuItems('更多操作', [
    { icon:'pin',   label:n.pinned ? '取消置顶' : '置顶', onClick:function(){
        n.pinned = !n.pinned; save(); toast(n.pinned ? '已置顶' : '已取消置顶');
      } },
    { icon:'tag',   label:'添加标签', onClick:addTags },
    { icon:'palette', label:'背景皮肤', onClick:function(){ openSkinPicker(n.id); } },
    { icon:'sun', label:'个性化设置', onClick:openLookSheet },
    { icon:'clock', label:'历史版本', onClick:openHistory },
    { icon:'search', label:'在本便签内查找', onClick:function(){ openFind(''); } },
    { icon:'down',  label:'导出这条便签', onClick:function(){ commitEdits(); openNoteExportMenu(n.id); } },
    { icon:'move',  label:'移动到…',  onClick:function(){ moveNote(n.id); } },
    { icon:'trash', label:'删除', danger:true, onClick:async function(){
        const ok = await confirmDialog('删除这条便签？此操作无法撤销。');
        if(!ok) return;
        db.notes = db.notes.filter(x => x.id !== n.id);
        ui.editingId = null;
        $('#editor').classList.remove('open');
        save(); render(); toast('已删除');
      } }
  ]);
};

$('#fileInput').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(f) importJSON(f);
  e.target.value = '';
});

/* 三个导入入口共用一个处理函数：先把 File 列表拷成数组再清空 input，
   否则边读边清会把选中的文件弄丢 */
['packZip', 'packFiles', 'packDir'].forEach(function(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('change', function(e){
    const picked = e.target.files ? Array.prototype.slice.call(e.target.files) : [];
    e.target.value = '';
    if(picked.length) importPack(picked);
  });
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && ui.selMode && !$('#sheetRoot').classList.contains('open')){
    setSelMode(false);
  }
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden && ui.editingId){
    clearTimeout(saveTimer);
    if(blockEdit) commitBlockEdit();
    commitEdits();
  }
});

/* ============================================================
   10. 启动
   ============================================================ */
applyTheme();
applyLook();
loadDB();
render();

/* 安卓返回键：逐层关闭，返回 true 表示已消费 */
window.androidBack = function(){
  if($('#sheetRoot').classList.contains('open')){ closeSheet(); return true; }
  if(ui.selMode){ setSelMode(false); return true; }
  if(find.on){ closeFind(); return true; }
  if(ui.editingId){ closeEditor(); return true; }
  if(ui.searching){
    ui.searching = false; ui.query = '';
    $('#searchBar').classList.remove('on');
    render(); return true;
  }
  if(ui.tagFilter){ ui.tagFilter = null; render(); return true; }
  if(ui.outlineOn){ ui.outlineOn = false; render(); return true; }
  if(ui.folderId){
    const f = getFolder(ui.folderId);
    ui.folderId = f ? (f.parentId || null) : null;
    render(); return true;
  }
  if(ui.view === 'tree'){ ui.view = 'notes'; render(); return true; }
  return false;
};

if(matchMedia('(prefers-color-scheme: dark)').addEventListener){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    // 只有「跟随系统」时才响应系统切换，手动选过就听用户的
    if(ui.theme === 'system'){ applyTheme(); render(); }
  });
}
</script>
